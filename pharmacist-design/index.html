<!doctype html>

<head>
<meta charset="utf-8" />

<title>굿팜 약사님용앱 · 클라이언트 3.0 — 디자인 시안(최신)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<style>
  :root{ --bg:#eef1f2; --card:#fff; --ink:#1c2b2a; --muted:#68767a; --line:#e2e7e8; --brand:#0AB4AD; --brand-d:#08837E; --brand-soft:#e6f7f4; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#0e1413; --card:#161e1d; --ink:#e8efee; --muted:#94a2a3; --line:#243130; --brand-soft:#123330; } }
  :root[data-theme="dark"]{ --bg:#0e1413; --card:#161e1d; --ink:#e8efee; --muted:#94a2a3; --line:#243130; --brand-soft:#123330; }
  :root[data-theme="light"]{ --bg:#eef1f2; --card:#fff; --ink:#1c2b2a; --muted:#68767a; --line:#e2e7e8; --brand-soft:#e6f7f4; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,system-ui,sans-serif;letter-spacing:-0.01em;line-height:1.5}
  .wrap{max-width:1280px;margin:0 auto;padding:36px 20px 60px}
  header.top{margin-bottom:26px}
  .eyebrow{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-d);background:var(--brand-soft);padding:6px 12px;border-radius:999px}
  h1{font-size:clamp(22px,3.5vw,30px);font-weight:800;margin:14px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0;max-width:70ch}
  .sec{margin-top:34px}
  .sec h2{font-size:17px;font-weight:800;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--brand-soft)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .card{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card.wide{grid-column:1/-1}
  figcaption{font-size:13px;font-weight:700;color:var(--ink);padding:12px 14px;border-bottom:1px solid var(--line)}
  .frame{width:100%;background:#f4f6f7;overflow:hidden}
  @media (prefers-color-scheme:dark){ .frame{background:#1a1f23} }
  iframe{width:100%;height:100%;border:0;display:block}
  footer{margin-top:40px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
