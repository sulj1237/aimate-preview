<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>상품관리 · 굿팜 약사님용앱</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<link href="ds.css" rel="stylesheet" />
<style>
  .cam{flex:1;margin:14px 20px 20px;border-radius:20px;position:relative;overflow:hidden;
    background:linear-gradient(160deg,#0E1A19,#08302D);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  .reticle{width:210px;height:150px;position:relative}
  .reticle i{position:absolute;width:26px;height:26px;border:3px solid var(--brand-300)}
  .reticle .a{top:0;left:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
  .reticle .b{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
  .reticle .c{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
  .reticle .d{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
  .reticle .ln{position:absolute;left:8px;right:8px;top:50%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--brand-300),transparent);animation:scan 2.4s ease-in-out infinite}
  @keyframes scan{0%,100%{transform:translateY(-64px)}50%{transform:translateY(64px)}}
  .cam .h{font-size:13px;color:#BFEDEA;font-weight:500}
  .cam .h .demo{opacity:.6}
</style>
<link href="ds-large.css" rel="stylesheet" />
</head>
<body>
<div class="stage">
  <div class="device" data-screen-label="상품관리 진입">
    <div class="statusbar">
      <span class="num">9:41</span>
      <div class="sb-right">
        <svg width="18" height="11" viewBox="0 0 18 11" fill="none"><path d="M1 8.5h2v1.5H1zM5 6h2v4H5zM9 3.5h2V10H9zM13 1h2v9h-2z" fill="currentColor"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 2.5C5.6 2.5 3.4 3.4 1.7 4.9.6 3.6.0 2.2.0 2.2A12 12 0 0 1 8 -.5 12 12 0 0 1 16 2.2s-.6 1.4-1.7 2.7C12.6 3.4 10.4 2.5 8 2.5z" fill="currentColor"/></svg>
        <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="currentColor" fill="none"/><rect x="2" y="2" width="16" height="7" rx="1" fill="currentColor"/><rect x="22.5" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor"/></svg>
      </div>
    </div>

    <div class="appbar">
      <button class="ico-btn" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <h1>상품관리</h1>
    </div>

    <div class="pad" style="padding-bottom:0">
      <div class="searchbox">
        <span class="si"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input placeholder="상품명으로 검색" />
      </div>
    </div>

    <div class="cam" onclick="location.href='product-form.html'" style="cursor:pointer">
      <div class="reticle"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><div class="ln"></div></div>
      <div class="h">바코드를 비추면 자동으로 인식합니다</div>
    </div>
  </div>
</div>
</body>
</html>
