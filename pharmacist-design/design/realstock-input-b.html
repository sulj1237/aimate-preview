<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>실재고 입력 · 시안 B · 굿팜 약사님용앱</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<link href="ds.css" rel="stylesheet" />
<style>
  /* ── 시안 B(확정) · 세그먼트 단일 포커스 + 총 수량 강조 + 사유 Bottom Sheet ──
     ① 입력 속도 ② 오입력 방지 ③ 큰 글씨 ④ 공간 활용 ⑤ 한 손 조작 최적화.
     한 번에 한 필드만 큰 숫자로 입력(토스식) → 큰 글씨에서도 잘림·줄바꿈 최소. */

  /* 상품 헤더(초압축) — 칩+상품명 1줄 + 앱 조회 시점 재고·동기화 1줄 그룹화 */
  .phead{padding:12px 0 10px;border-bottom:1px solid var(--g-100)}
  .ptitle{display:flex;align-items:center;gap:8px;min-width:0}
  .bc-chip{flex:none;background:var(--g-100);color:var(--g-600);border-radius:6px;padding:3px 9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
  .pnm{font-size:15px;font-weight:700;color:var(--g-900);letter-spacing:var(--tracking);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .pmeta{margin-top:7px;font-size:12.5px;color:var(--g-500);font-weight:500}
  .pmeta b{color:var(--g-800);font-weight:700}
  .pmeta .dot{color:var(--g-300);margin:0 8px}

  /* 세그먼트 — 진열/창고 전환(각 필드 현재값 뱃지 동반) */
  .seg{display:flex;background:var(--g-100);border-radius:12px;padding:4px;margin:16px 0 0}
  .seg button{flex:1;height:46px;border:0;border-radius:9px;background:transparent;font-family:inherit;font-size:15px;font-weight:700;color:var(--g-500);cursor:pointer;transition:all .14s ease;display:flex;align-items:center;justify-content:center;gap:7px}
  .seg button.on{background:#fff;color:var(--brand-700);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .seg button .badge{font-size:12.5px;font-weight:700;color:var(--g-400)}
  .seg button.on .badge{color:var(--brand-500)}

  /* 활성 필드 큰 숫자 포커스 디스플레이 */
  .focus{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 4px}
  .focus .fl{font-size:14px;font-weight:600;color:var(--g-500)}
  .focus .fv{font-size:62px;font-weight:800;color:var(--g-900);letter-spacing:-.02em;line-height:1}
  .focus .fv small{font-size:22px;font-weight:700;color:var(--g-400);margin-left:5px}
  .focus .fv .ph{color:var(--g-300)}
  .focus .fhint{margin-top:10px;font-size:12.5px;color:var(--g-400);font-weight:500}

  .dock{flex-shrink:0;background:var(--g-50);border-top:1px solid var(--g-200);padding:10px 12px max(10px,env(safe-area-inset-bottom))}

  /* 총 수량 강조 바(상시 노출) — 키패드 열려도 항상 확인 */
  .totbar{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:14px;background:var(--brand-50);border:1px solid var(--brand-100);margin-bottom:10px}
  .totbar .tl{font-size:14px;font-weight:700;color:var(--brand-700)}
  .totbar .warn{font-size:12px;font-weight:700;color:var(--sys-orange);display:none}
  .totbar .warn.show{display:inline-flex;align-items:center;gap:3px}
  .totbar .tv{margin-left:auto;font-size:26px;font-weight:800;color:var(--brand-700);letter-spacing:var(--tracking-title);line-height:1}
  .totbar .tv small{font-size:14px;font-weight:700;color:var(--brand-500);margin-left:2px}

  /* 재고 보정 사유 — Bottom Sheet 트리거(총≠전산 일 때만·공간 최소) */
  .rsbtn{width:100%;height:42px;margin-bottom:10px;border:1px dashed var(--g-300);border-radius:11px;background:#fff;
    font-family:inherit;font-size:13.5px;font-weight:600;color:var(--g-600);cursor:pointer;align-items:center;justify-content:center;gap:6px;display:none;padding:0 14px}
  .rsbtn.show{display:flex}
  .rsbtn.filled{border-style:solid;border-color:var(--brand-200);color:var(--brand-700);background:var(--brand-50)}
  .rsbtn .rtxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rsbtn .rplus{flex:none;font-weight:700}

  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .keypad button{height:52px;border-radius:12px;border:1px solid var(--g-200);background:#fff;color:var(--g-900);font-family:inherit;font-size:22px;font-weight:600;cursor:pointer;transition:background .1s ease;display:flex;align-items:center;justify-content:center}
  .keypad button:active{background:var(--g-100)}
  .kp-confirm{width:100%;height:52px;margin-top:9px;border-radius:12px;border:0;background:var(--brand-500);color:#fff;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:var(--tracking);cursor:pointer}
  .kp-confirm:active{background:var(--brand-600)}

  /* Bottom Sheet(사유 입력) */
  .scrim{position:absolute;inset:0;background:rgba(16,24,40,.45);display:none;align-items:flex-end;z-index:50}
  .scrim.show{display:flex}
  .sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:22px 20px max(20px,env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(0,0,0,.18)}
  .sheet h4{font-size:16px;font-weight:700;color:var(--g-900);margin:0 0 4px;letter-spacing:var(--tracking-title)}
  .sheet p{font-size:12.5px;color:var(--g-500);margin:0 0 14px;line-height:1.5}
  .sheet .rin{width:100%;height:48px;border:1.5px solid var(--g-300);border-radius:12px;padding:0 13px;font-family:inherit;font-size:15px;color:var(--g-900);outline:none;letter-spacing:var(--tracking)}
  .sheet .rin:focus{border-color:var(--brand-500);box-shadow:0 0 0 3px rgba(10,180,173,.12)}
  .sheet .rin::placeholder{color:var(--g-400)}
  .sheet .rcount{margin:6px 2px 0;text-align:right;font-size:11.5px;color:var(--g-400);font-variant-numeric:tabular-nums}
  .sheet .acts{display:flex;gap:8px;margin-top:16px}
  .sheet .acts button{flex:1;height:48px;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;border:0}
  .sheet .cancel{background:var(--g-100);color:var(--g-700)}
  .sheet .ok{background:var(--brand-500);color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="device" data-screen-label="실재고 입력 · 시안 B">
    <div class="statusbar">
      <span class="num">9:41</span>
      <div class="sb-right">
        <svg width="18" height="11" viewBox="0 0 18 11" fill="none"><path d="M1 8.5h2v1.5H1zM5 6h2v4H5zM9 3.5h2V10H9zM13 1h2v9h-2z" fill="currentColor"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 2.5C5.6 2.5 3.4 3.4 1.7 4.9.6 3.6.0 2.2.0 2.2A12 12 0 0 1 8 -.5 12 12 0 0 1 16 2.2s-.6 1.4-1.7 2.7C12.6 3.4 10.4 2.5 8 2.5z" fill="currentColor"/></svg>
        <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="currentColor" fill="none"/><rect x="2" y="2" width="16" height="7" rx="1" fill="currentColor"/><rect x="22.5" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor"/></svg>
      </div>
    </div>

    <div class="appbar">
      <button class="ico-btn" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <h1>실재고 입력</h1>
    </div>

    <div class="scroll pad" style="flex:1;display:flex;flex-direction:column">
      <div class="phead">
        <div class="ptitle"><span class="bc-chip">8801234567890</span><span class="pnm">타이레놀콜드-에스정 (아세트아미노펜·클로르페니라민 복합제)</span></div>
        <div class="pmeta"><span>앱 조회 시점 재고 <b>48개</b></span><span class="dot">·</span><span>앱 동기화 06-26 09:10</span></div>
      </div>

      <!-- 진열/창고 세그먼트 -->
      <div class="seg">
        <button class="on" id="s-disp" onclick="pick('disp')">진열 <span class="badge num" id="b-disp">0</span></button>
        <button id="s-wh" onclick="pick('wh')">창고 <span class="badge num" id="b-wh">0</span></button>
      </div>

      <!-- 활성 필드 큰 숫자 -->
      <div class="focus">
        <div class="fl" id="fl">진열 수량</div>
        <div class="fv num"><span id="fv"><span class="ph">0</span></span><small>개</small></div>
        <div class="fhint">진열·창고를 더한 값이 총 수량으로 저장돼요</div>
      </div>
    </div>

    <div class="dock">
      <!-- 총 수량 강조 바(상시 노출) -->
      <div class="totbar">
        <span class="tl">총 수량</span>
        <span class="warn" id="warn">전산과 다름</span>
        <span class="tv num"><span id="v-tot">0</span><small>개</small></span>
      </div>

      <!-- 재고 보정 사유 — Bottom Sheet 트리거(총≠전산 일 때만) -->
      <button class="rsbtn" id="rsbtn" onclick="openSheet()"><span class="rtxt" id="rsbtnTxt">재고 보정 사유 남기기</span><span class="rplus" id="rsbtnPlus">＋</span></button>

      <div class="keypad" id="keypad"></div>
      <button class="kp-confirm" onclick="location.href='realstock-list.html'">목록에 담기</button>
    </div>

    <!-- Bottom Sheet -->
    <div class="scrim" id="scrim">
      <div class="sheet">
        <h4>재고 보정 사유 <span style="font-size:12px;font-weight:500;color:var(--g-400)">선택</span></h4>
        <p>앱 조회 시점 재고와 실물 수량이 다를 때, 그 사유를 남겨 주세요.</p>
        <input class="rin" id="rsInp" type="text" maxlength="30" placeholder="예: 정기 실사 중 차이 확인, 실물 기준 정정" oninput="document.getElementById('rc').textContent=this.value.length" />
        <div class="rcount"><span id="rc">0</span>/30</div>
        <div class="acts">
          <button class="cancel" onclick="closeSheet()">취소</button>
          <button class="ok" onclick="saveSheet()">저장</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const BASE = 48;                      // 앱 조회 시점 재고(데모)
  const inv = { disp:"86", wh:"63" };   // 데모 입력값(진열 86 · 창고 63 → 총 149)
  let active='disp', reason='';
  const DEL = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>';
  const big = v => v==="" ? '<span class="ph">0</span>' : v;
  function paintPad(){
    const nums = [1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="press('${n}')">${n}</button>`).join('');
    document.getElementById('keypad').innerHTML = nums + `<button onclick="press('00')">00</button>` + `<button onclick="press('0')">0</button>` + `<button aria-label="지우기" onclick="press('del')">${DEL}</button>`;
  }
  function render(){
    document.getElementById('b-disp').textContent = (+inv.disp||0);
    document.getElementById('b-wh').textContent   = (+inv.wh||0);
    document.getElementById('fl').textContent = active==='disp' ? '진열 수량' : '창고 수량';
    document.getElementById('fv').innerHTML = big(inv[active]);
    const tot=(+inv.disp||0)+(+inv.wh||0);
    document.getElementById('v-tot').textContent = tot;
    document.getElementById('s-disp').classList.toggle('on', active==='disp');
    document.getElementById('s-wh').classList.toggle('on', active==='wh');
    const diff = tot!==BASE && (inv.disp!==""||inv.wh!=="");
    document.getElementById('warn').classList.toggle('show', diff);
    const btn=document.getElementById('rsbtn');
    btn.classList.toggle('show', diff);
    btn.classList.toggle('filled', !!reason);
    document.getElementById('rsbtnTxt').textContent = reason ? ('재고 보정 사유 · '+reason) : '재고 보정 사유 남기기';
    document.getElementById('rsbtnPlus').textContent = reason ? '✎' : '＋';
  }
  function pick(f){ active=f; render(); }
  function press(k){ let c=inv[active]; if(k==='del') c=c.slice(0,-1); else c=(c==="0"?"":c)+k; if(c.length>5) return; inv[active]=c; render(); }
  function openSheet(){ const i=document.getElementById('rsInp'); i.value=reason; document.getElementById('rc').textContent=reason.length; document.getElementById('scrim').classList.add('show'); setTimeout(()=>i.focus(),50); }
  function closeSheet(){ document.getElementById('scrim').classList.remove('show'); }
  function saveSheet(){ reason=document.getElementById('rsInp').value.trim(); closeSheet(); render(); }
  paintPad(); render();
</script>
</body>
</html>
