<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>실재고 입력 · 시안 C · 굿팜 약사님용앱</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<link href="ds.css" rel="stylesheet" />
<style>
  /* ── 시안 C · 계산기 느낌(시안2) + 정보 집중(시안3) 결합 ──
     정보 밀도↓·여백↑·숫자 우선. 상단 상품정보는 세로로 여유있게, 입력은 진열/창고 2카드,
     총 수량은 보조 표시, 재고 보정 사유는 총 수량 아래 한 줄. Apple/Samsung Health·Square 지향. */

  /* 1) 상단 상품 정보 — 한 줄 압축 X, 세로로 충분한 여백 */
  .pinfo{padding:14px 2px 4px}
  .bc-chip{display:inline-block;background:var(--g-100);color:var(--g-600);border-radius:7px;padding:4px 10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;letter-spacing:.02em}
  .pname{margin-top:12px;font-size:18px;font-weight:700;color:var(--g-900);line-height:1.4;letter-spacing:var(--tracking);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .facts{margin-top:16px;display:flex;flex-direction:column;gap:12px}
  .fact{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
  .fact .fl{font-size:13px;font-weight:600;color:var(--g-500);flex:none}
  .fact .fv{font-size:20px;font-weight:700;color:var(--g-900);letter-spacing:var(--tracking-title);text-align:right}
  .fact .fv small{font-size:14px;font-weight:600;color:var(--g-500);margin-left:2px}
  .fact.time .fv{font-size:15.5px;font-weight:600;color:var(--g-700);font-variant-numeric:tabular-nums}

  /* 도킹 입력 영역 */
  .dock{flex-shrink:0;background:var(--g-50);border-top:1px solid var(--g-200);padding:12px 12px max(10px,env(safe-area-inset-bottom))}

  /* 2) 진열/창고 2카드 — 활성 카드 숫자 강조(계산기 느낌) */
  .cells{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .cell{background:#fff;border:1.5px solid var(--g-200);border-radius:16px;padding:12px 16px;cursor:pointer;transition:all .12s ease}
  .cell:active{background:var(--g-50)}
  .cell.on{border-color:var(--brand-500);background:var(--brand-50);box-shadow:0 0 0 3px rgba(10,180,173,.12)}
  .cell .cl{font-size:13px;font-weight:600;color:var(--g-500)}
  .cell.on .cl{color:var(--brand-700)}
  .cell .cv{margin-top:3px;font-size:28px;font-weight:800;color:var(--g-900);letter-spacing:-.01em;line-height:1.05}
  .cell.on .cv{color:var(--brand-700)}
  .cell .cv small{font-size:15px;font-weight:600;color:var(--g-400);margin-left:2px}
  .cell .cv .ph{color:var(--g-300)}

  /* 3) 재고 보정 사유 — 화면(스크롤)에 위치. 총≠앱 조회 재고일 때 노출. 카드 + N/30 */
  .rsbox{margin-top:16px;background:#fff;border:1px solid var(--g-200);border-radius:14px;padding:12px 16px;display:none}
  .rsbox.show{display:block}
  .rsbox .rl{font-size:12.5px;font-weight:600;color:var(--g-700)}
  .rsbox .opt{font-weight:500;color:var(--g-400);margin-left:5px}
  .rsbox .rin{width:100%;height:44px;margin-top:7px;border:1.5px solid var(--g-300);border-radius:11px;padding:0 13px;
    font-family:inherit;font-size:14.5px;color:var(--g-900);background:#fff;outline:none;letter-spacing:var(--tracking)}
  .rsbox .rin:focus{border-color:var(--brand-500);box-shadow:0 0 0 3px rgba(10,180,173,.12)}
  .rsbox .rin::placeholder{color:var(--g-400)}
  .rsbox .rcount{margin-top:5px;text-align:right;font-size:11.5px;color:var(--g-400);font-variant-numeric:tabular-nums}

  /* 총 수량 — 키패드 바로 위 고정 바(브랜드 강조) */
  .totbar{display:flex;align-items:baseline;gap:8px;padding:6px 4px 12px}
  .totbar .tl{font-size:14px;font-weight:600;color:var(--g-600)}
  .totbar .tv{margin-left:auto;font-size:26px;font-weight:800;color:var(--brand-700);letter-spacing:var(--tracking-title);line-height:1}
  .totbar .tv small{font-size:14px;font-weight:700;color:var(--brand-500);margin-left:2px}

  /* 4) 키패드·CTA — 기존 유지 */
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .keypad button{height:46px;border-radius:12px;border:1px solid var(--g-200);background:#fff;color:var(--g-900);
    font-family:inherit;font-size:21px;font-weight:600;cursor:pointer;transition:background .1s ease;display:flex;align-items:center;justify-content:center}
  .keypad button:active{background:var(--g-100)}
  .kp-confirm{width:100%;height:50px;margin-top:9px;border-radius:12px;border:0;background:var(--brand-500);color:#fff;
    font-family:inherit;font-size:16px;font-weight:700;letter-spacing:var(--tracking);cursor:pointer}
  .kp-confirm:active{background:var(--brand-600)}
</style>
</head>
<body>
<div class="stage">
  <div class="device" data-screen-label="실재고 입력 · 시안 C">
    <div class="statusbar">
      <span class="num">9:41</span>
      <div class="sb-right">
        <svg width="18" height="11" viewBox="0 0 18 11" fill="none"><path d="M1 8.5h2v1.5H1zM5 6h2v4H5zM9 3.5h2V10H9zM13 1h2v9h-2z" fill="currentColor"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 2.5C5.6 2.5 3.4 3.4 1.7 4.9.6 3.6.0 2.2.0 2.2A12 12 0 0 1 8 -.5 12 12 0 0 1 16 2.2s-.6 1.4-1.7 2.7C12.6 3.4 10.4 2.5 8 2.5z" fill="currentColor"/></svg>
        <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="currentColor" fill="none"/><rect x="2" y="2" width="16" height="7" rx="1" fill="currentColor"/><rect x="22.5" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor"/></svg>
      </div>
    </div>

    <div class="appbar">
      <button class="ico-btn" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <h1>실재고 입력</h1>
    </div>

    <!-- 1) 상단 상품 정보(세로·여백) + 2) 입력 카드 — 스크롤 -->
    <div class="scroll pad" style="flex:1">
      <div class="pinfo">
        <span class="bc-chip">8801234567890</span>
        <div class="pname">타이레놀콜드-에스정 (아세트아미노펜·클로르페니라민 복합제)</div>
        <div class="facts">
          <div class="fact"><div class="fl">앱 조회 시점 재고</div><div class="fv num">48<small>개</small></div></div>
          <div class="fact time"><div class="fl">조회 시각</div><div class="fv">2026.06.26 09:10</div></div>
        </div>
      </div>

      <!-- 2) 진열/창고 2카드 -->
      <div class="cells">
        <div class="cell on" id="c-disp" onclick="pick('disp')"><div class="cl">진열</div><div class="cv num" id="v-disp"><span class="ph">0</span></div></div>
        <div class="cell" id="c-wh" onclick="pick('wh')"><div class="cl">창고</div><div class="cv num" id="v-wh"><span class="ph">0</span></div></div>
      </div>

      <!-- 3) 재고 보정 사유 — 화면(스크롤)에 위치, 총≠앱 조회 재고일 때 노출 -->
      <div class="rsbox" id="rsrow">
        <label class="rl" for="rsInp">재고 보정 사유<span class="opt">선택</span></label>
        <input class="rin" id="rsInp" type="text" maxlength="30" placeholder="앱 조회 시점 재고와 차이가 발생한 사유를 입력해 주세요." />
        <div class="rcount"><span id="rcnt">0</span>/30</div>
      </div>
    </div>

    <!-- 4) 총 수량만 키패드에 붙임 + 키패드·CTA — 하단 고정 -->
    <div class="dock">
      <div class="totbar"><span class="tl">총 수량</span><span class="tv num"><span id="v-tot">0</span><small>개</small></span></div>
      <div class="keypad" id="keypad"></div>
      <button class="kp-confirm" onclick="location.href='realstock-list.html'">목록에 담기</button>
    </div>
  </div>
</div>
<script>
  const BASE = 48;                      // 앱 조회 시점 재고(데모)
  const inv = { disp:"86", wh:"63" };   // 데모: 진열 86 · 창고 63 → 총 149
  let active = 'disp';
  const DEL = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>';
  const cell = v => v==="" ? '<span class="ph">0</span>' : (v+'<small>개</small>');
  const reasonInp = document.getElementById('rsInp');
  function setKeypad(on){ document.getElementById('keypad').style.display = on ? '' : 'none'; }
  function paintPad(){
    const nums = [1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="press('${n}')">${n}</button>`).join('');
    document.getElementById('keypad').innerHTML = nums + `<button onclick="press('00')">00</button>` + `<button onclick="press('0')">0</button>` + `<button aria-label="지우기" onclick="press('del')">${DEL}</button>`;
  }
  function render(){
    document.getElementById('v-disp').innerHTML = cell(inv.disp);
    document.getElementById('v-wh').innerHTML   = cell(inv.wh);
    const tot=(+inv.disp||0)+(+inv.wh||0);
    document.getElementById('v-tot').textContent = tot;
    document.getElementById('c-disp').classList.toggle('on', active==='disp');
    document.getElementById('c-wh').classList.toggle('on', active==='wh');
    // 재고 보정 사유: 총≠앱 조회 시점 재고일 때만 노출(총 수량 아래 한 줄)
    document.getElementById('rsrow').classList.toggle('show', tot!==BASE && (inv.disp!==""||inv.wh!==""));
  }
  function pick(f){ active=f; reasonInp.blur(); setKeypad(true); render(); }
  function press(k){ let c=inv[active]; if(k==='del') c=c.slice(0,-1); else c=(c==="0"?"":c)+k; if(c.length>5) return; inv[active]=c; render(); }
  reasonInp.addEventListener('input', function(){ document.getElementById('rcnt').textContent = reasonInp.value.length; });
  reasonInp.addEventListener('focus', function(){ active=null; setKeypad(false); render(); });
  paintPad(); render();
</script>
</body>
</html>
