<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>홈 · 굿팜 약사님용앱</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<link href="ds.css" rel="stylesheet" />
<style>
  .hbar{height:56px;padding:0 20px;flex-shrink:0;display:flex;align-items:center;gap:10px;background:#FFFFFF}
  .logo{display:inline-flex;align-items:flex-start;gap:7px;font-size:20px;font-weight:800;letter-spacing:-0.03em;color:var(--g-900)}
  .logo .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#75EFDA,#23C5BE);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;box-shadow:0 2px 8px -2px rgba(35,197,190,.6)}
  .logo .dot{width:5px;height:5px;border-radius:99px;background:#FFE14D;margin-left:-4px;margin-top:3px}
  .hbar .menu{margin-left:auto;width:40px;height:40px;border-radius:99px;border:0;background:transparent;color:var(--g-700);display:grid;place-items:center;cursor:pointer}
  .hbar .menu:active{background:var(--g-100)}
  .scroll{background:var(--g-50)}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px 6px;background:#FFFFFF}
  .quick .q{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:14px;background:var(--g-50);border:1px solid var(--g-100);cursor:pointer;transition:background .12s ease}
  .quick .q:active{background:var(--g-100)}
  .quick .q .qi{width:30px;height:30px;color:var(--brand-600);display:grid;place-items:center}
  .quick .q .ql{font-size:12.5px;font-weight:600;color:var(--g-800)}
  .sect{padding:20px 20px 4px}
  .sect-t{font-size:15px;font-weight:700;color:var(--g-900);letter-spacing:-0.015em;margin:0 0 12px}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  /* 세로형 타일(아이콘 위·라벨 아래 중앙) — 홈 전체 통일 */
  .tile{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:20px 12px;text-align:center;
    border-radius:14px;background:#FFFFFF;border:1px solid var(--g-200);cursor:pointer;transition:transform .1s ease}
  .tile:active{transform:scale(.99)}
  .tile .ic{width:44px;height:44px;border-radius:12px;background:var(--brand-50);color:var(--brand-600);display:grid;place-items:center;flex-shrink:0}
  .tile .nm{font-size:14px;font-weight:700;color:var(--g-800);letter-spacing:-0.012em;line-height:1.3}
  .tile.wide{width:100%}
  .tabbar{flex-shrink:0;padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:#FFFFFF;border-top:1px solid var(--g-200);display:grid;grid-template-columns:repeat(5,1fr)}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 0;color:var(--g-500);font-size:11px;font-weight:500;cursor:pointer}
  .tab.active{color:var(--brand-600);font-weight:600}
  .tab .ti{width:24px;height:24px;display:grid;place-items:center}
</style>
<link href="ds-large.css" rel="stylesheet" />
</head>
<body>
