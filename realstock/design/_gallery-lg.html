<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>굿팜 약사님용앱 · 큰 글씨(접근성) 화면 모음</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<style>
  :root{--brand-500:#0AB4AD;--brand-700:#08837E;--g-300:#DEE2E6;--g-500:#ADB5BD;--g-600:#868E96;--g-900:#212529}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard",system-ui,sans-serif;letter-spacing:-0.01em;color:var(--g-900);background:#EDF0F2;padding:36px 28px 80px}
  .wrap{max-width:1400px;margin:0 auto}
  h1{font-size:24px;font-weight:800;letter-spacing:-0.03em}
  .sub{font-size:13.5px;color:var(--g-600);margin-top:7px;line-height:1.6}
  .sub b{color:var(--brand-700);font-weight:700}
  .group{margin-top:34px}
  .group-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .group-h .bar{width:5px;height:20px;border-radius:99px;background:var(--brand-500)}
  .group-h h2{font-size:18px;font-weight:800;letter-spacing:-0.02em}
  .group-h .cnt{font-size:12px;font-weight:700;color:var(--brand-700);background:#E7FBFA;padding:3px 10px;border-radius:99px}
  .row{display:flex;flex-wrap:wrap;gap:22px}
  .card{width:390px}
  .cap{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;padding:0 2px}
  .cap .id{font-size:11px;font-weight:800;color:var(--g-500)}
  .cap .nm{font-size:14px;font-weight:700}
  .cap .file{font-size:11px;color:var(--g-500);margin-left:auto;font-family:ui-monospace,monospace}
  .frame{width:390px;height:844px;border-radius:38px;overflow:hidden;background:#fff;border:1px solid var(--g-300);box-shadow:0 18px 44px -20px rgba(16,24,40,.28)}
  .frame iframe{width:390px;height:844px;border:0;display:block}
  @media(max-width:1360px){.card,.frame,.frame iframe{width:340px}.card{width:340px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>굿팜 약사님용앱 · 큰 글씨(접근성) 화면 모음</h1>
  <p class="sub">기본 14개 화면에 <b>큰 글씨 오버레이(ds-large.css)</b>를 적용한 버전 — 폰트 ≈ 1.22x, 터치타깃 확대. 같은 390×844 화면에서 글자가 커지며 줄바꿈·스크롤이 늘어나는 형태를 검증용으로 확인.</p>
  <div id="wrap"></div>
</div>
<script>
  const GROUPS = [
    { title:"홈", screens:[ ["S-00","홈","home-lg.html"] ]},
    { title:"실재고 관리", screens:[
      ["R-01","실재고 스캔","realstock-scan-lg.html"],
      ["R-02","실재고 입력","realstock-input-lg.html"],
      ["R-03","미등록 상품 안내","realstock-unregistered-lg.html"],
      ["R-04","제출 목록","realstock-list-lg.html"],
      ["R-05","제출 결과","realstock-result-lg.html"],
      ["R-06","제출 이력","realstock-history-lg.html"],
      ["R-07","제출 상세","realstock-detail-lg.html"],
    ]},
    { title:"상품관리", screens:[
      ["P-01","상품관리 진입","product-entry-lg.html"],
      ["P-02","검색 결과","product-search-lg.html"],
      ["P-04","상품 정보 (수정/신규)","product-form-lg.html"],
      ["P-05","저장 결과","product-result-lg.html"],
    ]},
    { title:"공통", screens:[ ["C-01","제조사 선택","maker-select-lg.html"] ]},
  ];
  document.getElementById('wrap').innerHTML = GROUPS.map(g=>{
    const cards = g.screens.map(([id,nm,file])=>`
      <div class="card">
        <div class="cap"><span class="id">${id}</span><span class="nm">${nm}</span><span class="file">${file}</span></div>
        <div class="frame"><iframe src="${file}" loading="lazy" title="${nm}"></iframe></div>
      </div>`).join('');
    return `<section class="group"><div class="group-h"><span class="bar"></span><h2>${g.title}</h2><span class="cnt">${g.screens.length}</span></div><div class="row">${cards}</div></section>`;
  }).join('');
  function postHeight(){ if(window.parent===window)return; const h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight); window.parent.postMessage({type:"embed-height",height:h},"*"); }
  window.addEventListener('load',postHeight); window.addEventListener('resize',postHeight);
  document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',postHeight)); postHeight();
</script>
</body>
</html>
