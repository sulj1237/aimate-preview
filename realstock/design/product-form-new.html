<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>상품 정보 · 신규 등록 · 굿팜 약사님용앱</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<link href="ds.css" rel="stylesheet" />
<style>
  .bc-head{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600;color:var(--g-500);
    letter-spacing:.02em;margin-left:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag-new{margin-left:auto;margin-right:4px;flex-shrink:0;font-size:11px;font-weight:700;color:var(--sys-orange);
    background:var(--sys-orange-bg);padding:3px 9px;border-radius:99px}
</style>
</head>
<body>
<div class="stage">
  <div class="device" data-screen-label="상품 정보 · 신규 등록">
    <div class="statusbar">
      <span class="num">9:41</span>
      <div class="sb-right">
        <svg width="18" height="11" viewBox="0 0 18 11" fill="none"><path d="M1 8.5h2v1.5H1zM5 6h2v4H5zM9 3.5h2V10H9zM13 1h2v9h-2z" fill="currentColor"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 2.5C5.6 2.5 3.4 3.4 1.7 4.9.6 3.6.0 2.2.0 2.2A12 12 0 0 1 8 -.5 12 12 0 0 1 16 2.2s-.6 1.4-1.7 2.7C12.6 3.4 10.4 2.5 8 2.5z" fill="currentColor"/></svg>
        <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="currentColor" fill="none"/><rect x="2" y="2" width="16" height="7" rx="1" fill="currentColor"/><rect x="22.5" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor"/></svg>
      </div>
    </div>

    <div class="appbar">
      <button class="ico-btn" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <h1>신규 등록</h1>
      <span class="bc-head num">8809999999999</span>
      <span class="tag-new">신규</span>
    </div>

    <div class="scroll pad">
      <div class="field"><label>상품명 <span class="req">*</span></label><input placeholder="상품명 입력" /></div>
      <div class="field"><label>분류 <span class="req">*</span></label><select><option value="" selected>선택</option><option>일반의약품</option><option>의약외품</option></select></div>
      <div class="field"><label>제조사</label><div class="sel ph">제조사 선택<span class="ar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span></div></div>
      <div class="field"><label>판매가 (원) <span class="req">*</span></label><input placeholder="0" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,8)" /></div>
      <div class="field"><label>단위</label><select><option value="" selected>선택</option><option>정</option><option>캡슐</option><option>ml</option><option>g</option><option>병</option><option>박스(소)</option><option>박스(대)</option></select></div>
      <div class="field"><label>재고 수량</label><input placeholder="0" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,6)" /></div>
      <div class="field"><label>상품 상세위치</label><input placeholder="예: A-3 선반" /></div>

      <div class="hint left">신규 등록 시 <b>초기 재고 수량</b>을 입력합니다. 이후 실재고는 <b>실재고 관리</b>에서 관리합니다.</div>
    </div>

    <div class="bottom">
      <button class="btn btn-primary btn-lg">등록</button>
    </div>
  </div>
</div>
</body>
</html>
