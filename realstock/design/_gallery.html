<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>굿팜 약사님용앱 · 화면 디자인 모음</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<style>
  :root{
    --brand-500:#0AB4AD; --brand-600:#16A59F; --brand-700:#08837E;
    --g-50:#F8F9FA; --g-100:#F1F3F5; --g-200:#E9ECEF; --g-300:#DEE2E6;
    --g-500:#ADB5BD; --g-600:#868E96; --g-700:#495057; --g-900:#212529;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard",-apple-system,system-ui,sans-serif;letter-spacing:-0.01em;
    color:var(--g-900);background:#EDF0F2;padding:36px 28px 80px}
  header{max-width:1400px;margin:0 auto 8px}
  h1{font-size:26px;font-weight:800;letter-spacing:-0.03em}
  .sub{font-size:13.5px;color:var(--g-600);margin-top:7px;line-height:1.6}
  .sub b{color:var(--brand-700);font-weight:700}
  .wrap{max-width:1400px;margin:0 auto}

  .group{margin-top:38px}
  .group-h{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .group-h .bar{width:5px;height:20px;border-radius:99px;background:var(--brand-500)}
  .group-h h2{font-size:18px;font-weight:800;letter-spacing:-0.02em}
  .group-h .cnt{font-size:12px;font-weight:700;color:var(--brand-700);background:#E7FBFA;
    padding:3px 10px;border-radius:99px}

  .row{display:flex;flex-wrap:wrap;gap:22px}
  .card{width:390px}
  .card .cap{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;padding:0 2px}
  .card .cap .id{font-size:11px;font-weight:800;color:var(--g-500);font-variant-numeric:tabular-nums}
  .card .cap .nm{font-size:14px;font-weight:700;color:var(--g-900)}
  .card .cap .file{font-size:11px;color:var(--g-500);margin-left:auto;font-family:ui-monospace,monospace}
  .frame{width:390px;height:844px;border-radius:38px;overflow:hidden;background:#fff;
    border:1px solid var(--g-300);box-shadow:0 18px 44px -20px rgba(16,24,40,.28)}
  .frame iframe{width:390px;height:844px;border:0;display:block}

  @media(max-width:1360px){.card,.frame,.frame iframe{width:340px}.card{width:340px}}
</style>
</head>
<body>
<header>
  <h1>굿팜 약사님용앱 · 화면 디자인 모음</h1>
  <p class="sub">상품 등록·수정 및 실재고 입력 기능 · 디자인 시스템(<b>ds.css</b>) 적용 화면 <b>23종</b>(기본 13 + 상태·예외 케이스 10).<br/>
    실제 디자인 파일을 그대로 임베드해 렌더한 것입니다 — 각 프레임은 390×844 기준.</p>
</header>

<div class="wrap" id="wrap"></div>

<script>
  const GROUPS = [
    { title:"홈", screens:[
      ["S-00","홈","home.html"],
    ]},
    { title:"실재고 관리", screens:[
      ["R-01","실재고 스캔","realstock-scan.html"],
      ["R-02","실재고 입력","realstock-input.html"],
      ["R-03","미등록 상품 안내","realstock-unregistered.html"],
      ["R-04","제출 목록","realstock-list.html"],
      ["R-05","제출 결과","realstock-result.html"],
      ["R-06","제출 이력","realstock-history.html"],
      ["R-07","제출 상세","realstock-detail.html"],
    ]},
    { title:"상품관리", screens:[
      ["P-01","상품관리 진입","product-entry.html"],
      ["P-02","검색 결과","product-search.html"],
      ["P-04","상품 정보 (수정/신규)","product-form.html"],
      ["P-05","저장 결과","product-result.html"],
    ]},
    { title:"공통", screens:[
      ["C-01","제조사 선택","maker-select.html"],
    ]},
    { title:"상태 · 예외 케이스", screens:[
      ["R-01a","실재고 스캔 · 0건","realstock-scan-empty.html"],
      ["R-01b","실재고 스캔 · 인식 실패","realstock-scan-fail.html"],
      ["R-04b","제출 목록 · 6건","realstock-list-6.html"],
      ["R-05b","제출 결과 · 전송 실패","realstock-result-fail.html"],
      ["P-02b","검색 결과 · 결과 없음","product-search-empty.html"],
      ["P-04b","상품 정보 · 신규 등록","product-form-new.html"],
      ["P-04c","상품 정보 · 검증 오류","product-form-error.html"],
      ["P-05b","저장 결과 · 검증 실패","product-result-error.html"],
      ["P-05c","저장 결과 · 전송 실패","product-result-fail.html"],
    ]},
  ];
  document.getElementById('wrap').innerHTML = GROUPS.map(g=>{
    const cards = g.screens.map(([id,nm,file])=>`
      <div class="card">
        <div class="cap"><span class="id">${id}</span><span class="nm">${nm}</span><span class="file">${file}</span></div>
        <div class="frame"><iframe src="${file}" loading="lazy" title="${nm}"></iframe></div>
      </div>`).join('');
    return `<section class="group">
      <div class="group-h"><span class="bar"></span><h2>${g.title}</h2><span class="cnt">${g.screens.length}</span></div>
      <div class="row">${cards}</div>
    </section>`;
  }).join('');

  // 부모(planning portal AutoIframe)로 콘텐츠 높이 전달
  function postHeight(){
    if(window.parent === window) return;
    const h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    window.parent.postMessage({ type:"embed-height", height:h }, "*");
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load', postHeight));
  postHeight();
</script>
</body>
</html>
