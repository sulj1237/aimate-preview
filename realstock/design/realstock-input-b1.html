<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>실재고 입력 · 시안1 트리플셀 · 굿팜 약사님용앱</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<link href="ds.css" rel="stylesheet" />
<style>
  /* ── 시안 1 · 트리플 셀 고정형 ──
     상단 정보는 1블록으로 압축, 진열·창고·총(강조)을 키패드 위에 3칸 병렬로 상시 노출 */

  /* 상품 헤더(압축) — 바코드 칩 + 상품명(좌측·2줄) + 메타 1줄 그룹화 */
  .phead{padding:14px 0 12px;border-bottom:1px solid var(--g-100)}
  .ptitle{line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bc-chip{display:inline-block;vertical-align:middle;background:var(--g-100);color:var(--g-600);border-radius:6px;
    padding:3px 9px;margin-right:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
  .pnm{font-size:15.5px;font-weight:700;color:var(--g-900);vertical-align:middle;letter-spacing:var(--tracking)}
  .pmeta{margin-top:8px;font-size:12.5px;color:var(--g-500);font-weight:500;display:flex;flex-wrap:wrap;gap:4px 10px}
  .pmeta b{color:var(--g-800);font-weight:700}
  .pmeta .dot{color:var(--g-300)}

  /* 도킹 입력 영역 */
  .dock{flex-shrink:0;background:var(--g-50);border-top:1px solid var(--g-200);padding:10px 12px max(10px,env(safe-area-inset-bottom))}

  /* 3칸 셀 — 진열 · 창고 · 총(강조). 활성 셀 브랜드 아웃라인 */
  .cells{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:8px;margin-bottom:10px}
  .cell{background:#fff;border:1.5px solid var(--g-200);border-radius:14px;padding:11px 10px;text-align:center;cursor:pointer;transition:all .12s ease}
  .cell:active{background:var(--g-50)}
  .cell.on{border-color:var(--brand-500);background:var(--brand-50);box-shadow:0 0 0 3px rgba(10,180,173,.12)}
  .cell .cl{font-size:12px;font-weight:600;color:var(--g-500)}
  .cell.on .cl{color:var(--brand-700)}
  .cell .cv{font-size:23px;font-weight:800;color:var(--g-900);margin-top:3px;letter-spacing:var(--tracking-title);line-height:1.1}
  .cell .cv small{font-size:12px;font-weight:600;color:var(--g-400);margin-left:1px}
  .cell .cv .ph{font-size:16px;font-weight:600;color:var(--g-300)}
  /* 총 셀 — 강조(브랜드), 읽기 전용 */
  .cell.total{background:var(--brand-500);border-color:var(--brand-500);cursor:default}
  .cell.total .cl{color:rgba(255,255,255,.85)}
  .cell.total .cv{color:#fff}
  .cell.total .cv small{color:rgba(255,255,255,.8)}

  /* 재고 차이 사유 — 총≠전산 일 때만 노출되는 Accordion(접힘 기본) */
  .rsbar{margin-bottom:10px;border:1px solid var(--g-200);border-radius:12px;background:#fff;overflow:hidden;display:none}
  .rsbar.show{display:block}
  .rsbar summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 13px;font-size:13px;font-weight:600;color:var(--g-700)}
  .rsbar summary::-webkit-details-marker{display:none}
  .rsbar .opt{font-size:11px;font-weight:500;color:var(--g-400)}
  .rsbar .chev{margin-left:auto;transition:transform .18s ease;color:var(--g-400)}
  .rsbar[open] .chev{transform:rotate(180deg)}
  .rsbar .rin{width:calc(100% - 26px);margin:0 13px 12px;height:42px;border:1.5px solid var(--g-300);border-radius:10px;padding:0 12px;
    font-family:inherit;font-size:14px;color:var(--g-900);background:#fff;outline:none;letter-spacing:var(--tracking)}
  .rsbar .rin:focus{border-color:var(--brand-500);box-shadow:0 0 0 3px rgba(10,180,173,.12)}
  .rsbar .rin::placeholder{color:var(--g-400)}

  /* 키패드 */
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .keypad button{height:50px;border-radius:12px;border:1px solid var(--g-200);background:#fff;color:var(--g-900);
    font-family:inherit;font-size:21px;font-weight:600;cursor:pointer;transition:background .1s ease;display:flex;align-items:center;justify-content:center}
  .keypad button:active{background:var(--g-100)}
  .kp-confirm{width:100%;height:52px;margin-top:9px;border-radius:12px;border:0;background:var(--brand-500);color:#fff;
    font-family:inherit;font-size:16px;font-weight:700;letter-spacing:var(--tracking);cursor:pointer}
  .kp-confirm:active{background:var(--brand-600)}
</style>
</head>
<body>
<div class="stage">
  <div class="device" data-screen-label="시안1 · 트리플셀">
    <div class="statusbar">
      <span class="num">9:41</span>
      <div class="sb-right">
        <svg width="18" height="11" viewBox="0 0 18 11" fill="none"><path d="M1 8.5h2v1.5H1zM5 6h2v4H5zM9 3.5h2V10H9zM13 1h2v9h-2z" fill="currentColor"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 2.5C5.6 2.5 3.4 3.4 1.7 4.9.6 3.6.0 2.2.0 2.2A12 12 0 0 1 8 -.5 12 12 0 0 1 16 2.2s-.6 1.4-1.7 2.7C12.6 3.4 10.4 2.5 8 2.5z" fill="currentColor"/></svg>
        <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="currentColor" fill="none"/><rect x="2" y="2" width="16" height="7" rx="1" fill="currentColor"/><rect x="22.5" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor"/></svg>
      </div>
    </div>

    <div class="appbar">
      <button class="ico-btn" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <h1>실재고 입력</h1>
    </div>

    <div class="scroll pad" style="flex:1">
      <div class="phead">
        <div class="ptitle"><span class="bc-chip">8801234567890</span><span class="pnm">타이레놀콜드-에스정 (아세트아미노펜·클로르페니라민 복합제)</span></div>
        <div class="pmeta"><span>전산상 재고 <b>48개</b></span><span class="dot">·</span><span>동기화 06-26 09:10</span></div>
      </div>
    </div>

    <div class="dock">
      <!-- 진열·창고·총 3칸 상시 노출(키패드 열려도 항상 보임) -->
      <div class="cells">
        <div class="cell on" id="c-disp" onclick="pick('disp')"><div class="cl">진열</div><div class="cv num" id="v-disp"><span class="ph">0</span></div></div>
        <div class="cell" id="c-wh" onclick="pick('wh')"><div class="cl">창고</div><div class="cv num" id="v-wh"><span class="ph">0</span></div></div>
        <div class="cell total"><div class="cl">총 수량</div><div class="cv num"><b id="v-tot">0</b><small>개</small></div></div>
      </div>

      <!-- 재고 차이 사유 — 총≠전산 일 때만 노출 · 접힘 기본(공간 최소) -->
      <details class="rsbar" id="rsbar" open>
        <summary>재고 차이 사유 <span class="opt">선택</span><span class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span></summary>
        <input class="rin" id="rsInp" type="text" maxlength="30" placeholder="전산상 재고와 차이가 발생한 사유를 입력해 주세요." />
      </details>

      <div class="keypad" id="keypad"></div>
      <button class="kp-confirm" onclick="location.href='realstock-list.html'">목록에 담기</button>
    </div>
  </div>
</div>
<script>
  const BASE = 48;
  const inv = { disp:"86", wh:"63" };
  let active = 'disp';
  const DEL = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>';
  const cell = v => v==="" ? '<span class="ph">0</span>' : (v+'<small>개</small>');
  function paintPad(){
    const nums = [1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="press('${n}')">${n}</button>`).join('');
    document.getElementById('keypad').innerHTML = nums + `<button onclick="press('00')">00</button>` + `<button onclick="press('0')">0</button>` + `<button aria-label="지우기" onclick="press('del')">${DEL}</button>`;
  }
  function render(){
    document.getElementById('v-disp').innerHTML = cell(inv.disp);
    document.getElementById('v-wh').innerHTML   = cell(inv.wh);
    const tot = (+inv.disp||0)+(+inv.wh||0);
    document.getElementById('v-tot').textContent = tot;
    document.getElementById('c-disp').classList.toggle('on', active==='disp');
    document.getElementById('c-wh').classList.toggle('on', active==='wh');
    document.getElementById('rsbar').classList.toggle('show', tot!==BASE && (inv.disp!==""||inv.wh!==""));
  }
  function pick(f){ active=f; render(); }
  function press(k){ let c=inv[active]; if(k==='del') c=c.slice(0,-1); else c=(c==="0"?"":c)+k; if(c.length>5) return; inv[active]=c; render(); }
  paintPad(); render();
</script>
</body>
</html>
