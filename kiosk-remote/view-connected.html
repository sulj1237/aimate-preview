<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>원격지원 모달 · 연결 중</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 문서형 화면 기획서 — 개요 → 플로우 → 화면 카드(왼쪽 화면 그림 · 오른쪽 번호별 설명). 실제 어드민 · 키오스크 화면을 본뜨므로 라이트 단일 테마. */
:root{
  color-scheme: light;
  --page:#f3f4f6; --paper:#ffffff; --ink:#24272c; --muted:#6c727a; --line:#e2e5e9; --soft:#f6f7f9;
  --teal:#5bbfba; --teal-dark:#3a9f9a; --teal-soft:#e7f5f4;
  --side:#4a4b4d; --admin:#e9e9e9; --thead:#f3f4f5;
  --kiosk:#e3302b; --navy:#1d2a7a; --yellow:#ffd83a;
  --red:#d9433c; --red-soft:#fde4e2; --green:#23935a; --green-soft:#e1f4e9; --amber-soft:#fff1d6; --amber:#8f6200;
  --mk:#1d2a7a;
  --font:"Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:32px 64px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-size:26px;margin:0;text-wrap:balance}
h2{font-size:19px;margin:0 0 12px;text-wrap:balance}
.meta{color:var(--muted);font-size:13px}
.sec{background:var(--paper);border-radius:12px;padding:24px;min-width:0}
.lead{margin:6px 0 0;font-size:15px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0;padding:0;list-style:none}
.steps li{background:var(--soft);border-radius:8px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.steps b{font-size:12px;color:var(--teal-dark);letter-spacing:.04em}
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 24px;margin:0;padding-left:18px}
.idx{display:flex;flex-wrap:wrap;gap:6px}
.idx a{font-size:12.5px;text-decoration:none;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.idx a span{color:var(--muted);margin-right:4px;font-variant-numeric:tabular-nums}
.fl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:22px}
.fl li{position:relative;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.fl li b{font-size:13.5px}
.fl li.ok{background:var(--green-soft);border-color:#9fd6b5}
.fl li:not(:last-child)::after{content:"→";position:absolute;right:-18px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
@media (max-width:1000px){.fl{grid-template-columns:1fr;gap:18px}.fl li:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-19px;transform:translateX(-50%)}}
.flow pre{margin:0;display:flex;justify-content:center;background:transparent;overflow-x:auto}

/* 화면 카드 */
.scr{display:grid;grid-template-columns:minmax(0,640px) minmax(0,1fr);gap:24px;align-items:start}
.scr-h{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}
.scr-h .id{font-size:12px;font-weight:700;color:#fff;background:var(--navy);border-radius:4px;padding:2px 8px;letter-spacing:.03em}
.scr-h h3{margin:0;font-size:17px}
.scr-h .where{color:var(--muted);font-size:12.5px}
.canvas{overflow-x:auto;min-width:0}
.desc{display:flex;flex-direction:column;gap:12px;min-width:0}
.desc ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.desc li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:13.5px}
.desc li i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--mk);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.desc li b{display:block}
.desc .cases{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:12.5px}
.nav{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.nav b{color:var(--ink);font-weight:500}
.decided{display:inline-block;font-size:11px;background:var(--teal-soft);color:var(--teal-dark);border-radius:4px;padding:0 6px;margin-left:4px}

.sess{margin-left:auto;font-size:11px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}.sess b{color:var(--red)}
/* 마커 */
.mk{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--mk);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 3px #fff;z-index:5}

/* --- 슈퍼어드민 그림 --- */
.sa{position:relative;width:640px;background:var(--admin);border-radius:8px;display:flex;overflow:hidden;border:1px solid var(--line)}
.sa-side{width:92px;background:var(--side);padding:12px 8px;display:flex;flex-direction:column;gap:6px}
.sa-side i{display:block;height:14px;border-radius:3px;background:#606164}
.sa-side i.cur{background:#2f3032}
.sa-main{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.crumb{font-size:10.5px;color:var(--muted)}
.ttl{font-size:15px;font-weight:700}
.card{background:#fff;border-radius:6px;padding:12px}
.card-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.card-h strong{font-size:13px}
.card-h .cnt{font-size:11px;color:var(--muted)} .card-h .cnt em{font-style:normal;color:var(--teal);font-weight:700}
.card-h .acts{margin-left:auto;display:flex;gap:6px;position:relative}
.b-line{border:1px solid var(--teal);color:var(--teal-dark);background:#fff;border-radius:3px;font-size:11px;padding:4px 9px;font-weight:500}
.b-fill{background:var(--teal);color:#fff;border-radius:3px;font-size:11px;padding:5px 10px;font-weight:500}
.b-gray{background:#e4e5e7;border:1px solid #d3d5d8;border-radius:3px;font-size:10.5px;padding:2px 10px}
.tbl{width:100%;border-collapse:collapse;font-size:11px;text-align:center}
.tbl th{background:var(--thead);font-weight:500;padding:6px 4px}
.tbl td{padding:6px 4px;border-bottom:1px solid var(--line)}
.dot-ok{color:var(--teal)} .dot-bad{color:var(--red)}
.ghost{height:46px;background:#fff;border-radius:6px;opacity:.7}
.sa-toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#2f3237;color:#fff;font-size:11.5px;padding:7px 14px;border-radius:6px;white-space:nowrap}

/* --- 원격지원 페이지 그림 --- */
.rp{position:relative;width:640px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f4f5f7}
.rp-bar{display:flex;align-items:center;gap:5px;background:#eceef1;padding:7px 10px;border-bottom:1px solid var(--line)}
.rp-bar i{width:8px;height:8px;border-radius:50%;background:#cfd3d7}
.rp-url{margin-left:8px;flex:1;background:#fff;border-radius:4px;padding:2px 8px;font-size:10.5px;color:var(--muted)}
.rp-head{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;font-size:12px;font-weight:700;display:flex;gap:8px;align-items:center}
.rp-head span{color:var(--teal);font-weight:900}
.rp-body{display:flex;justify-content:center;padding:18px 0 22px}
.rp-card{position:relative;width:400px;background:#fff;border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:11px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.rp-card.wide{width:580px}
.rp-card h4{margin:0;font-size:14px;display:flex;align-items:center;gap:6px}
.st{font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:999px}
.st.wait{background:var(--amber-soft);color:var(--amber)} .st.ok{background:var(--green-soft);color:var(--green)}
.st.bad{background:var(--red-soft);color:#a1241e} .st.end{background:#eceef0;color:var(--muted)}
.code{display:flex;justify-content:center;gap:6px}
.code span{width:40px;height:50px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:24px;font-weight:700;background:#fafbfb;font-variant-numeric:tabular-nums}
.code.dim span{color:#c3c6ca}
.howto{background:var(--soft);border-radius:6px;padding:9px 11px;font-size:11px;line-height:1.65}
.howto ol{margin:2px 0 0;padding-left:16px}
.timer{text-align:center;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.timer b{color:var(--red)}
.acts{display:flex;justify-content:flex-end;gap:6px}
.btn-g{background:#e4e5e7;border:1px solid #d3d5d8;border-radius:3px;font-size:11px;padding:5px 12px}
.btn-t{background:var(--teal);color:#fff;border-radius:3px;font-size:11px;padding:5px 12px;font-weight:500}
.btn-r{background:var(--red);color:#fff;border-radius:3px;font-size:11px;padding:5px 12px;font-weight:500}
.dev{display:grid;grid-template-columns:84px 1fr;border:1px solid var(--line);border-radius:6px;font-size:11px}
.dev div{padding:5px 9px;border-bottom:1px solid var(--line)} .dev div:nth-last-child(-n+2){border-bottom:0}
.dev .k{background:var(--thead);color:var(--muted)}
.mini-k{aspect-ratio:16/8;background:var(--kiosk);border-radius:6px;display:grid;place-items:center;color:#fff;font-size:11px;text-align:center}
.mini-k b{display:block;font-size:26px;font-weight:900;color:var(--navy);-webkit-text-stroke:4px #fff;paint-order:stroke fill}
.rp-toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#2f3237;color:#fff;font-size:11px;padding:6px 12px;border-radius:6px;white-space:nowrap}
.p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.6}

/* --- 키오스크 그림 --- */
.ks{position:relative;width:640px;aspect-ratio:16/10;background:var(--kiosk);border:9px solid #1b1c1f;border-radius:14px;overflow:hidden}
.ks-top{position:absolute;inset:10px 12px auto 12px;display:flex;align-items:center;gap:7px;z-index:2}
.ks-ids{background:rgba(25,10,10,.55);color:#fff;border-radius:999px;padding:4px 11px;font-size:9.5px;display:flex;gap:9px;font-variant-numeric:tabular-nums}
.ks-ids b{font-weight:500;color:#ffd0ce;margin-right:3px}
.ks-remote{margin-left:auto;background:#2a0f0f;border-radius:999px;padding:3px 3px 3px 10px;display:flex;align-items:center;gap:7px;color:#fff;font-size:10.5px}
.ks-remote i{width:7px;height:7px;border-radius:50%;background:#ff6b63}
.ks-remote span{background:#e86a64;font-weight:700;border-radius:999px;padding:3px 11px}
.ks-gear{margin-left:auto;width:26px;height:26px;color:#dadada;position:relative}
.ks-remote + .ks-gear{margin-left:0}
.ks-title{position:absolute;top:28px;left:0;right:0;text-align:center;font-size:50px;font-weight:900;color:var(--navy);-webkit-text-stroke:7px #fff;paint-order:stroke fill;line-height:1.1}
.ks-sub{position:absolute;top:108px;left:0;right:0;text-align:center;color:#fff;font-size:22px;font-weight:700}
.ks-sub em{font-style:normal;color:var(--yellow)}
.ks-ph{position:absolute;left:12px;right:12px;bottom:12px;top:152px;background:#fff;border-radius:3px;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:14px 22px}
.ks-ph div{background:linear-gradient(180deg,#eef0f2,#dcdfe3);border-radius:3px;display:grid;place-items:end center;padding-bottom:10px;font-size:10.5px;color:#4b5058}
.ks-dim{position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:4}
.ks-modal{position:relative;background:#fff;border-radius:12px;width:270px;padding:15px 16px;display:flex;flex-direction:column;gap:9px}
.ks-modal h5{margin:0;font-size:14px;text-align:center}
.ks-modal p{margin:0;text-align:center;color:var(--muted);font-size:10.5px}
.ks-modal p.err{color:var(--red)}
.dots{display:flex;justify-content:center;gap:9px}.dots span{width:10px;height:10px;border-radius:50%;border:1.5px solid #c7cacf}
.boxes{display:flex;justify-content:center;gap:5px}.boxes span{width:30px;height:36px;border:1.5px solid #d5d8dc;border-radius:6px;display:grid;place-items:center;font-size:17px;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.pad span{background:#f1f2f4;border-radius:6px;height:24px;display:grid;place-items:center;font-size:12px}
.pad span.fn{font-size:9.5px;color:var(--muted)}
.k-link{text-align:center;color:var(--navy);font-weight:700;font-size:11.5px;text-decoration:underline;text-underline-offset:2px;position:relative}
.k-acts{display:grid;grid-template-columns:1fr 1fr;gap:5px}.k-acts span{border-radius:6px;height:28px;display:grid;place-items:center;font-size:12px;font-weight:700;background:#e9eaec}
.k-acts span.ok{background:var(--navy);color:#fff}
.ks-banner{position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:3;background:#1b1c1f;color:#fff;border-radius:7px;padding:6px 13px;font-size:11px;white-space:nowrap}

.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cmp .rp{width:100%}
.cmp .rp-card{width:auto;margin:0 12px}
.cap{font-size:12px;color:var(--muted);margin:6px 0 0}
.tblx{width:100%;border-collapse:collapse;font-size:13px}
.tblx th,.tblx td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tblx th{background:var(--soft);font-weight:500;color:var(--muted);font-size:12.5px}
.tbl-wrap{overflow-x:auto}

@media (max-width: 1000px){ .scr{grid-template-columns:minmax(0,1fr)} .steps{grid-template-columns:1fr 1fr} .rules{grid-template-columns:1fr} .cmp{grid-template-columns:minmax(0,1fr)} }
</style>
<style>
.stp{background:var(--paper);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.stp-h{display:flex;align-items:center;gap:10px}
.stp-h .n{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.stp-h h3{margin:0;font-size:17px}
.row.wideR{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
.row.wideR .zoom{zoom:.68}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.who{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:700;border-radius:6px;padding:3px 9px}
.who.k{background:#fde4e2;color:#a1241e}.who.a{background:var(--teal-soft);color:var(--teal-dark)}
.note{display:flex;flex-direction:column;gap:10px;padding-top:28px}
.zoom{zoom:.84;max-width:100%}
.do{font-size:14px;margin:0}.do b{color:var(--teal-dark)}
.say{background:#eef3ff;border-left:4px solid var(--navy);border-radius:6px;padding:9px 12px;font-size:13.5px;line-height:1.6}
.say::before{content:"상담 멘트";display:block;font-size:11px;font-weight:700;color:var(--navy);margin-bottom:2px}
.now{background:#fff6d6;border:1px solid #f0d77a;border-radius:8px;padding:9px 12px;font-size:13.5px}
.now b{color:#8a6100}
.chk{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px 24px}
.chk li{padding-left:24px;position:relative}
.chk li::before{content:"";position:absolute;left:0;top:4px;width:14px;height:14px;border:1.5px solid var(--teal-dark);border-radius:3px}
.faq dt{font-weight:700;margin-top:10px}.faq dt:first-child{margin-top:0}.faq dd{margin:2px 0 0;color:var(--muted)}
.sess{margin-left:auto;font-size:11px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}.sess b{color:var(--red)}
/* 실제 캡처 기반 어드민 */
.cap{position:relative;container-type:inline-size;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.cap img{display:block;width:100%;height:auto}
.cap .add{position:absolute;left:65.9%;top:8.6%;width:18.2%;height:18.5%;border:1px solid #5bbfba;background:#fff;color:#3a9f9a;border-radius:.5cqw;font-size:1.7cqw;font-weight:500;display:grid;place-items:center;white-space:nowrap;box-shadow:0 0 0 .35cqw rgba(29,42,122,.35)}
.cap .mk2{position:absolute;left:61.6%;top:9%;width:3.4cqw;height:3.4cqw;border-radius:50%;background:var(--navy);color:#fff;font-size:1.4cqw;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 .3cqw #fff}
.cap-cap{font-size:12px;color:var(--muted)}
/* 모달 */
.mdl{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.mdl>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top left}
.mdl .dimA{position:relative;background:rgba(20,22,26,.18);display:grid;place-items:center;padding:28px 0}
.mdl h4{display:flex;align-items:center;gap:6px;margin:0;font-size:14px}
.mdl .mcard{position:relative;width:62%;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;zoom:.8}
.mdl .mcard.wide{width:86%;zoom:.72}
.mdl .mcard{border:1px solid #c9ccd1;border-radius:10px}
.mdl .wbar{border-radius:10px 10px 0 0;display:flex;align-items:center;gap:6px;background:#e9ebee;padding:8px 12px;border-bottom:1px solid #d6d9dd}
.mdl .wbar i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.mdl .wbar i:nth-child(2){background:#febc2e}.mdl .wbar i:nth-child(3){background:#28c840}
.mdl .wbar span{margin-left:10px;flex:1;background:#fff;border-radius:5px;padding:2px 10px;font-size:11px;color:var(--muted)}
.mdl .mhead{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;background:#fff}
.mdl .mhead span{color:var(--teal);font-weight:900}
.mdl .mbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;position:relative}
/* 키오스크 사진 */
.ks-ph.real{display:block;padding:0;overflow:hidden;background:#fff}
.ks-ph.real img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:900px){.row{grid-template-columns:minmax(0,1fr)}.note{padding-top:0}.zoom{zoom:.55}}
</style>
<style>
.row.ar{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.row.ar .zoom{zoom:.6}
.full{position:relative;container-type:inline-size;border-radius:8px;overflow:hidden;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.full>img{display:block;width:100%;height:auto}
.full .mask{font-size:1.6cqw!important;position:absolute;left:.4%;top:8.2%;width:13.2%;height:5.4%;background:#5c5d60;border-radius:.4cqw;color:#fff;font-size:1cqw;font-weight:700;display:flex;align-items:center;padding-left:.8cqw}
.full .btnx{position:absolute;left:76.1%;top:47.7%;width:9.6%;height:5.4%;border:2px solid #5bbfba;background:#fff;color:#3a9f9a;border-radius:.3cqw;font-size:1.05cqw;font-weight:500;display:grid;place-items:center;white-space:nowrap}
.full .ring{position:absolute;left:75.5%;top:46.4%;width:10.8%;height:8%;border:.35cqw solid #ff3b30;border-radius:.6cqw;box-shadow:0 0 0 .5cqw rgba(255,59,48,.18)}
.full .mk3{position:absolute;left:72.4%;top:47%;width:2.6cqw;height:2.6cqw;border-radius:50%;background:#ff3b30;color:#fff;font-size:1.4cqw;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 .3cqw #fff}
.full .bigv{position:absolute;right:1.2%;bottom:2%;background:var(--navy);color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:3}
