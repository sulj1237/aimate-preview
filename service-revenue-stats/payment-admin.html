<style>

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{display:inline-flex;align-items:center;gap:6px;height:26px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:#fff;font-size:12.5px;color:#2b2f33;cursor:pointer}

  .tbl tr.bmh td{background:#f6f7fb;border-top:1px solid var(--line);font-size:12.5px;padding:7px 10px}.bmn{color:#6b7280;font-size:11.5px;margin-left:4px}
  .tbl tr.bmi td:first-child{padding-left:22px}.bml{color:#9aa1a9;margin-right:4px}.wy{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:4px;background:#eef0f3;color:#4b5563;font-weight:600}

.sck{display:inline-block!important}.schh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px}.schh .btn{margin-left:auto}.ro4 b{display:block;font-size:12.5px;padding:5px 0}.chg{color:#d9480f!important;font-weight:700}#optTbl th,#optTbl td,.tbl.sch th,.tbl.sch td{font-size:11px;padding:6px 6px;white-space:nowrap}.tbl.sch td:last-child{white-space:normal}.tbl.sch{width:100%}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px}.dgrid label{display:block;font-size:11.5px;color:#5b6168;margin-bottom:3px}.dgrid .fi{height:30px;font-size:12px;padding:0 8px}.dgrid .w2{grid-column:span 2}
.dmck{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
/* 옵션 표 서비스 상태 칸 — 데모 기간은 상태 아래 줄로(표가 창 밖으로 넘치지 않게, 11-26) */.dmSeg{display:flex!important;flex-direction:column;align-items:flex-start;gap:4px}.dmSeg .demoPer{margin-left:0}.dmSeg .fi{height:26px!important;font-size:11px!important;padding:0 4px!important;width:84px!important}.dmSeg .demoPer .fi{width:80px!important}#optTbl td{vertical-align:top}.optWrap{overflow-x:auto}#demoPer,.demoPer{display:inline-flex;align-items:center;gap:4px;margin-left:6px}#demoPer .fi{width:96px;height:28px;font-size:12px;padding:0 6px}
.st.ex{background:#fff3d6;color:#a86b00}

.hbtn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;color:#3d444b}

.lnk{border:0;background:none;color:#159b8d;font-size:11.5px;font-weight:700;cursor:pointer;text-decoration:underline;padding:0}

<div class="wrap">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="topbar">
      <div class="crumb">약국관리 &gt; 약국 관리 &gt; <b>상세</b><script>/* 다른 화면에서 왔으면 이전 페이지로 돌아가는 링크(11-26) */(()=>{const f=new URLSearchParams(location.search).get('from'); if(f) document.write('<a class="back" onclick="history.back()" style="color:#159b8d;cursor:pointer;font-weight:700;margin-left:10px">‹ '+f.replace(/[<>&"]/g,'')+'</a>');})();</script></div>
      <div class="demo">시안 화면
        <button data-go="svc">약국 서비스 수정</button>
        <button data-go="sub">정기 결제 내역</button>

<script>
const fmt=n=>Number(n).toLocaleString('ko-KR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove('show'),1800); }

/* 카테고리 — 실데이터 기준으로 정함. 화면에는 안내 문구만 */
const DISC_CAT=[ // 금액 할인 사유 — 화면 안내 문구 (근거 데이터는 스토리보드 디스크립션)
  ['계약 할인','계약 · 제휴 조건으로 약속한 할인 (예: DRS 파머시 퍼스트 중복)'],
  ['보상 · 테스트','서비스 오류 보상 · 테스트로 할인할 때'],
  ['기타','위에 해당하지 않을 때 — 메모에 이유 입력']];
const PAY_CAT=[ // 수기 결제 사유
  ['재시도 결제','정기 결제가 실패한 달을 다시 결제할 때 (밀린 대금 포함)'],
  ['누락분 결제','이용 중인 서비스 금액이 정기 결제에서 빠졌을 때'],
  ['취소 후 재결제','결제 취소 뒤 받을 금액을 다시 결제할 때 (차액 · 일할 · 반값)'],
  ['요금제 변경','요금제를 바꾸면서 결제할 때'],
  ['개국','개국하면서 결제할 때'],
  ['서비스 외 결제','장비(PC · 바코드건) · 설치 · 개국 작업비 · 라벨지처럼 서비스 요금이 아닐 때 — 서비스 청구 통계에서 빼고 기타 판매로 집계'],
  ['기타','위에 해당하지 않을 때 — 메모에 이유 입력']];
const CANCEL_CAT=[ // 결제 취소 사유
  ['해지','서비스를 해지해 그 달 결제를 돌려줄 때'],
  ['폐업 · 양도','폐업 · 양도양수로 결제를 돌려줄 때'],
  ['과다 청구','해지 · 할인 · 서비스 변경이 정기 결제 금액에 반영되지 않아 더 결제됐을 때'],
  ['중복 결제','같은 청구월이 두 번 결제됐을 때'],
  ['카드 변경','다른 카드로 다시 결제하기 위해 취소할 때'],
  ['기타','위에 해당하지 않을 때 — 메모에 이유 입력']];
const opt=(a,v)=>a.map(([t])=>`<option value="${t}" ${t===v?'selected':''}>${t}</option>`).join('');
/* 사유 표시 — 고른 카테고리는 회색 테두리 태그, 직접 쓴 메모는 일반 글자. 저장 값은 '[카테고리] 메모' */
const rsn=s=>{ const m=/^\[([^\]]+)\]\s*(.*)$/.exec(s||''); return m?'<span class="ctag">'+esc(m[1])+'</span>'+esc(m[2]):esc(s||''); };
const hintOf=(a,v)=>(a.find(x=>x[0]===v)||a[0])[1];

/* 예시 약국 — 스마트 OCR 단독(49,500) · 10월 말 파머시 퍼스트 해지 */
const PH={name:'샘플약국', store:'2024047xxxx', card:'신한카드 · 뒤 4자리 ****', method:'수기 정기결제(레거시)'};
// 정기 결제 내역: [id, 과금일, 청구월, 결제상태, 결제액, 취소 금액, 실패 사유, 결제 이유, 취소 사유 · 메모] (+ [9] 취소 등록자 · [10] 결제 등록자 · [11] 취소일시 — CXAT)
// 취소일시 — 한 줄에 결제와 취소를 같이 보여 주므로 취소 금액 칸 아래에 취소일(수기 취소는 입금일)을 따로 표시
const CXAT={6:'2026-11-06 11:15',2:'2026-08-05 14:30'};
const cxAt=h=>h[11]||CXAT[h[0]]||'2026-11-06 11:15';
const CXLB={cx:' ',rq:'요청',cf:'요청',bank:'취소금 입금'};   // 취소 완료는 날짜만
const HIST=[
  [7,'2026-11-06 11:20','2026-11','ok',49500,0,'','[취소 후 재결제] 11월분 · 파머시 퍼스트 해지 반영',''],
  [6,'2026-11-05 10:02','2026-11','cx',71500,71500,'','11월 서비스 이용료','[과다 청구] 파머시 퍼스트 10월 해지 미반영'],

/* 사유 기타 → 메모 필수: 라벨에 필수 표시, 비어 있으면 저장 · 결제 · 취소 막음 */
function memoReq(catId,memoId,reqId,btn,always){
  const u=()=>{ const on=always||$(catId).value==='기타'; $(reqId).classList.toggle('on',on); $(memoId).classList.toggle('need',on&&!$(memoId).value.trim()); };
  $(catId).addEventListener('change',u); $(memoId).addEventListener('input',u); u();
  if(btn) btn.addEventListener('click',e=>{ if((always||$(catId).value==='기타')&&!$(memoId).value.trim()){ e.stopImmediatePropagation(); toast(always?'메모를 입력해야 합니다':'기타를 고르면 메모를 입력해야 합니다'); $(memoId).focus(); } },true);
}

/* 청구월 선택지 — 항상 표시. 미결제 청구월 = 정기 결제 내역에서 실패만 있고 성공(정기 · 수기)이 없는 달 */
// 선택지 = 과금시작월(2024-06) ~ 이번 달 전체, 미결제 청구월은 맨 위 묶음
const BILL_START='2024-06';
const BM=(()=>{ const a=[]; let m=BILL_START; while(m<=NOW){ a.unshift(m); m=nextM(m); } return a; })();
const unpaid=()=>BM.filter(m=>HIST.some(h=>h[2]===m&&h[3]==='fail')&&!HIST.some(h=>h[2]===m&&h[3]==='ok')).sort();
const bmDefault=()=>NOW;   // 기본값 = 이번 달. 지난 미결제 달은 목록 위쪽에서 고름
const bmOpts=()=>{ const u=unpaid(), o=m=>`<option value="${m}" ${m===bmDefault()?'selected':''}>${m}${u.includes(m)?' (미결제)':''}</option>`;
  // 선택지 = 이번 달(기본) + 아직 메우지 못한 미결제 청구월만 — 이번 달에 청구되는 결제라 전체 기간은 두지 않음(11-25)
  return o(NOW)+(u.length?`<optgroup label="미결제 청구월">${u.filter(m=>m!==NOW).map(o).join('')}</optgroup>`:''); };
const bmHint=()=>`기본값은 이번 달(${NOW})`+(unpaid().length?` · 미결제 ${unpaid().join(' · ')}은 목록에서 고름`:'')+' · 두 달 치는 달마다 한 건씩 결제';

function bindAll(){

  document.querySelectorAll('.memoN').forEach(n=>{ const i=document.getElementById(n.dataset.for); if(!i) return; const u=()=>{ n.textContent=i.value.length+'/30자'; }; i.addEventListener('input',u); u(); });
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>go('sub'));
  document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));
  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{ S.cid=+b.dataset.cancel; go('cancel'); });
  document.querySelectorAll('[data-bank]').forEach(b=>b.onclick=()=>{ S.cid=+b.dataset.bank; go('bank'); });
  document.querySelectorAll('[data-payback]').forEach(b=>b.onclick=()=>{ S.cid=+b.dataset.payback; go('payback'); });
  if($('pbGo')) $('pbGo').onclick=()=>{ const h=HIST.find(x=>x[0]===S.cid); if(h) h[9]=$('pbDate').value.slice(5).replace('-','-')+' · 김운영'; go('sub'); };
  document.querySelectorAll('[data-vipc]').forEach(c=>c.onchange=()=>{ S.vip=c.checked?+c.dataset.vipc:0; render(); });   // 둘 중 하나만
  const r=$('svcRow'); if(r){ r.style.cursor='pointer'; r.onclick=()=>go('svc'); }
  document.querySelectorAll('.stSel').forEach(x=>x.onchange=()=>{ x.parentNode.querySelector('.demoPer').style.display=x.value==='데모'?'':'none'; });
  if($('schEdit')) $('schEdit').onclick=()=>{ S.sedit=1; render(); };
  if($('schCancel')) $('schCancel').onclick=()=>{ S.sedit=0; render(); };
  if($('dCat')){ const u=()=>{ const a=+String($('dAmt').value).replace(/\D/g,'')||0; $('dTot').textContent=fmt(55000-a)+'원'; };
    ['dCat','dMemo','dAmt'].forEach(id=>{ $(id).oninput=u; $(id).onchange=u; }); u(); }
  if($('cxCat')){ const h=view().find(x=>x[0]===S.cid)||HIST[0], max=h[4]-h[5];
    const u=()=>{ $('cxHint').textContent=hintOf(CANCEL_CAT,$('cxCat').value); };

  if($('mpCat')){ const u=()=>{ const c=$('mpCat').value, m=$('mpMemo').value.trim(), bm=$('mpBm').value,
        f=HIST.filter(h=>h[2]===bm&&h[3]==='fail'&&!paidBy(h)).pop();
      $('mpLink').innerHTML=f?`<b>${f[1].slice(0,10)} · ${fmt(f[4])}원 · ${esc(f[6])}</b>`
        :'<span class="hint">이 청구월은 미결제 건 없음 — 새 결제로 저장</span>';
      if(f && e0!==bm){ $('mpAmt').value=fmt(f[4]); e0=bm; }
      if($('mpHint')) $('mpHint').textContent=hintOf(PAY_CAT,c); };
    let e0=null; ['mpCat','mpBm','mpMemo'].forEach(id=>{ $(id).oninput=u; $(id).onchange=u; }); u(); }
}

const fMode=(o,k)=>(o.s[k]||{m:'c'}).m;
const fEff=(o,k)=>{ const x=o.s[k]; if(!x||x.m==='c') return F.common[k]; return x.m==='u'?null:x.v; };
const fLab=(o,k)=>{ const m=fMode(o,k),v=fEff(o,k); return m==='c'?`${v||'미정'} (공통)`:m==='u'?'미정':`${v} (직접 지정)`; };
const fInd=o=>FK.filter(k=>fMode(o,k)!=='c');
const fmd=d=>d?d.slice(5).replace('-','.'):'';
// 12월 청구 예정 — 데모 옵션은 그 기간 청구분 0원, 결합 할인은 서비스별 할인 그대로
const fAmt=(o,ym)=>{ if(o.st==='데모'&&o.demo&&o.demo[0]<=ym&&ym<=o.demo[1]) return 0; return o.p*o.q*(100-o.dc)/100; };

}

function fSchCell(o){ const d=fInd(o); if(!d.length) return '<span class="hint" style="margin:0">공통 일정</span>'; return d.map(k=>fMode(o,k)==='u'?`${k} <b>미정</b>`:`${k} <b style="color:#c2410c">${fmd(fEff(o,k))}</b>`).join(' · '); }

  }
  return `<div class="fr" id="fEditRow"><span class="fl">일정 수정</span><div style="border:1px solid #1fb6a6;border-radius:8px;padding:10px 12px;background:#f3fbfa">

function fChanges(){
  const out=[];
  if(F.scope==='common'){ FK.forEach(k=>{ const nv=F.cform[k]; if(nv===undefined||nv===(F.common[k]||'')) return;
      F.opts.filter(o=>fMode(o,k)==='c').forEach(o=>out.push({o:o.n,k,b:fLab(o,k),a:`${nv||'미정'} (공통)`}));
      out.push({common:1,k,ap:()=>{F.common[k]=nv||null;}}); }); }
  else F.opts.filter(o=>F.sel.has(o.n)).forEach(o=>FK.forEach(k=>{ const f=F.form[k]; if(!f||f.m==='keep'||(f.m==='d'&&!f.v)) return;
    const b=fLab(o,k), a=f.m==='c'?`${F.common[k]||'미정'} (공통)`:f.m==='u'?'미정':`${f.v} (직접 지정)`; if(a===b) return;
    out.push({o:o.n,k,b,a,ap:()=>{o.s[k]=f.m==='c'?{m:'c'}:f.m==='u'?{m:'u'}:{m:'d',v:f.v};}}); }));
  return out;
}
function fSave(){
  const ch=fChanges(); if(!ch.length){ toast('바뀐 항목이 없어요'); return; }
  // 공통 일정 변경 = 한 줄로 묶음(11-26) — 바뀐 공통 항목 · 따라간 옵션 · 직접 지정을 유지한 옵션
  if(F.scope==='common'){ const ks=[...new Set(ch.filter(c=>c.common).map(c=>c.k))];
    const fol=[...new Set(ch.filter(c=>!c.common).map(c=>c.o))], keep=F.opts.filter(o=>ks.some(k=>fMode(o,k)!=='c')).map(o=>o.n);
    F.log.unshift(['2026-11-26 10:30',F.who,'일정','일정 변경 · 공통 일정',ks.map(k=>`${k} ${F.common[k]||'미정'}`).join('<br>'),ks.map(k=>`${k} ${F.cform[k]||'미정'}`).join('<br>')+`<div class="hint" style="color:#5b6168">함께 바뀐 옵션 : ${fol.join(' · ')||'없음'}${keep.length?' · 직접 지정 유지 : '+keep.join(' · '):''}</div>`,ks.some(k=>k==='과금 시작일'||k==='해지일')?'2026-12':'',F.memo]);
    ch.forEach(c=>c.ap&&c.ap()); F.edit=0; F.form={}; F.cform={}; F.pg='list'; F.flt='전체'; render(); toast('저장했어요 — 서비스 변경 이력에 남았어요'); return; }
  const g={}; ch.filter(c=>!c.common).forEach(c=>(g[c.o]=g[c.o]||[]).push(c));
  Object.entries(g).reverse().forEach(([o,cs])=>F.log.unshift(['2026-11-26 10:30',F.who,'일정','일정 변경 · '+o,cs.map(c=>`${c.k} ${c.b}`).join('<br>'),cs.map(c=>`${c.k} ${c.a}`).join('<br>'),cs.some(c=>c.k==='과금 시작일'||c.k==='해지일')?'2026-12':'',F.memo]));
  ch.forEach(c=>c.ap&&c.ap()); F.edit=0; F.form={}; F.cform={}; F.pg='list'; F.flt='전체'; render(); toast('저장했어요 — 서비스 변경 이력에 남았어요');
}

function fPend(){ return F.opts.reduce((a,o)=>{ const d=F.dr[o.n]; const x=d?{...o,st:d.st,demo:d.demo}:o; return a+fAmt(x,'2026-12'); },0); }
function fOptSave(){
  const ch=[]; F.opts.forEach(o=>{ const d=F.dr[o.n]; if(!d) return; const sb=o.st+(o.st==='데모'?` (${o.demo[0]} ~ ${o.demo[1]})`:''), sa=d.st+(d.st==='데모'?` (${d.demo[0]} ~ ${d.demo[1]})`:'');
    if(sb!==sa) ch.push({o,d,sb,sa}); });
  if(!ch.length){ F.pg='list'; render(); return; }
  const before=Math.round(fTot('2026-12')*1.1);
  ch.forEach(c=>{ c.o.st=c.d.st; if(c.d.st==='데모') c.o.demo=[...c.d.demo]; });
  const after=Math.round(fTot('2026-12')*1.1);
  ch.reverse().forEach(c=>F.log.unshift(['2026-11-26 10:40',F.who,'옵션','상태 변경 · '+c.o.n,`상태 ${c.sb}`+(before!==after?`<br>월 청구액 ${fmt(before)}`:''),`상태 ${c.sa}`+(before!==after?`<br>월 청구액 ${fmt(after)}`:''),c.d.st==='데모'?c.d.demo[0]:'2026-12','']));

}
function fCalc(){
  const rows=F.opts.map(o=>{ const v=Math.round(o.p*o.q*1.1), dc=Math.round(o.p*o.q*o.dc/100*1.1), am=Math.round(fAmt(o,'2026-12')*1.1), demo=o.st==='데모'&&am===0;
    const why=o.free?'무료 — 함께 쓰는 서비스에만 청구':demo?`<span class="dmt">데모 적용 · 0원</span> ${o.demo[0]} ~ ${o.demo[1]} 청구분`:o.dc?'결합 할인 50%':'정가(가장 높은 서비스)';
    return `<tr${demo?' class="dmr"':''}><td>${o.n}</td><td class="num">${o.q}</td><td class="num">${o.free?0:fmt(v)}</td><td class="num">${demo?'−':dc?'<span class="red">−'+fmt(dc)+'</span>':0}</td><td class="num"><b>${fmt(am)}</b></td><td>${why}</td></tr>`; }).join('');
  const t=Math.round(fTot('2026-12')*1.1);
  return `<div class="dim" data-fclose></div><div class="mdl wide" id="fCalcMdl" style="width:760px"><div class="mh"><div><div class="hint" style="margin:0">통계 › 서비스 청구 통계 › 청구 예정 (2026-12) · 계산 내역</div><h3>새봄약국</h3></div><button class="x" data-fclose>×</button></div>
  <div class="mb"><b style="font-size:13px">청구 예정 · 2026-12</b>
   <table class="tbl" id="fCalcTbl"><thead><tr><th>서비스 옵션</th><th class="num">수량</th><th class="num">정가</th><th class="num">결합 · VIP 할인</th><th class="num">금액</th><th>계산식</th></tr></thead><tbody>${rows}
   <tr><td colspan="4"><b>서비스 요금</b></td><td class="num"><b>${fmt(t)}</b></td><td></td></tr>
   <tr style="background:#fff8f6"><td colspan="4">금액 할인</td><td class="num">0</td><td class="hint">약국 총액에서 차감</td></tr>
   <tr><td colspan="4"><b>결제 예정 금액</b></td><td class="num"><b>${fmt(t)}원</b></td><td class="hint">서비스 요금과 같음</td></tr></tbody></table>
   <div class="hint">데모 옵션은 데모 기간 청구분에서 그 옵션만 0원 · 함께 쓰는 유료 옵션은 기존 요금 그대로 · 데모가 끝난 뒤 자동 전환 없음(상태만 <q>데모 기간 종료</q>로 바뀌고 안내만 보여요 — 승인 전환은 담당자)</div></div></div>`;
}
function renderFlow(){
  side(); document.querySelectorAll('.demo button').forEach(b=>b.classList.remove('on'));
  $('content').innerHTML=fList()+(F.pg==='mod'?fModal():F.pg==='calc'?fCalc():'');
  const q=x=>document.querySelectorAll(x);
  q('[data-fmod]').forEach(b=>b.onclick=()=>{F.pg='mod';render();}); const r=$('fSvcRow'); if(r) r.onclick=()=>{F.pg='mod';render();};
  q('[data-fclose]').forEach(b=>b.onclick=()=>{F.pg='list';F.edit=0;F.dr={};render();});
  q('[data-fedit]').forEach(b=>b.onclick=()=>{F.edit=1;render();});
  q('[data-fcancel]').forEach(b=>b.onclick=()=>{F.edit=0;F.form={};F.cform={};render();});
  q('[data-fhist]').forEach(b=>b.onclick=()=>{F.hist=!F.hist;render();});
  q('[data-fflt]').forEach(b=>b.onclick=()=>{F.flt=b.dataset.fflt;render();});
  q('input[name=fsc]').forEach(x=>x.onchange=()=>{F.scope=x.value;render();});
  q('[data-fsel]').forEach(x=>x.onchange=()=>{x.checked?F.sel.add(x.dataset.fsel):F.sel.delete(x.dataset.fsel);render();});
  q('[data-fm]').forEach(x=>x.onchange=()=>{const k=x.dataset.fm;F.form[k]={m:x.value,v:(F.form[k]||{}).v};render();});
  q('[data-fv]').forEach(x=>x.onchange=()=>{F.form[x.dataset.fv].v=x.value;});
  q('[data-frev]').forEach(b=>b.onclick=()=>{F.form[b.dataset.frev]={m:'c'};render();});
  q('[data-fc]').forEach(x=>x.onchange=()=>{F.cform[x.dataset.fc]=x.value;});
  q('[data-fsave]').forEach(b=>b.onclick=()=>{ const m=$('fMemo'); if(m) F.memo=m.value; fSave(); });
  q('[data-fst]').forEach(x=>x.onchange=()=>{ const o=F.opts.find(y=>y.n===x.dataset.fst); F.dr[o.n]={st:x.value,demo:o.demo?[...o.demo]:['2026-12','2027-01']}; render(); });
  q('[data-fd0]').forEach(x=>x.onchange=()=>{F.dr[x.dataset.fd0].demo[0]=x.value;render();});
  q('[data-fd1]').forEach(x=>x.onchange=()=>{F.dr[x.dataset.fd1].demo[1]=x.value;render();});
  q('[data-foptsave]').forEach(b=>b.onclick=fOptSave);
  const w=$('fWho'); if(w) w.onchange=()=>{F.who=w.value;};
}
// 스토리보드 장면 — 흐름도 3번 클릭 순서
function fScene(n){
  fInit(); S.f=1;
  const posSave=()=>{ F.scope='opt'; F.sel=new Set(['굿팜 POS']); F.form={'설치 예정일':{m:'d',v:'2026-12-08'}}; F.memo='POS 장비 입고 지연'; fSave(); };
  if(n==='mod'){ F.pg='mod'; }
  if(n==='edit'){ F.pg='mod'; F.edit=1; F.scope='opt'; F.sel=new Set(['굿팜 POS']); F.form={'설치 예정일':{m:'d',v:'2026-12-08'}}; F.memo='POS 장비 입고 지연'; }
  if(n==='posSaved'){ posSave(); }
  if(n==='posHist'){ posSave(); F.pg='mod'; F.hist=1; }
  if(n==='common'){ posSave(); F.pg='mod'; F.edit=1; F.scope='common'; F.cform={'설치 예정일':'2026-12-10'}; }
  if(n==='commonSaved'){ posSave(); F.scope='common'; F.cform={'설치 예정일':'2026-12-10'}; F.memo='설치 일정 조정'; fSave(); F.pg='mod'; F.hist=1; }
  if(n==='demo'){ F.pg='mod'; F.dr={'스마트2D':{st:'데모',demo:['2026-12','2027-01']}}; }
  if(n==='demoSaved'){ F.dr={'스마트2D':{st:'데모',demo:['2026-12','2027-01']}}; fOptSave(); }
  if(n==='calc'){ F.dr={'스마트2D':{st:'데모',demo:['2026-12','2027-01']}}; fOptSave(); F.pg='calc'; }
  render();
}

function render(){ if(S.f) return renderFlow(); renderBase(); }
function renderBase(){
  side();
  document.querySelectorAll('.demo button').forEach(b=>b.classList.toggle('on',b.dataset.go===S.page));
  const base = svcList()+subPanel();
  const mdl = S.page==='svc'?svcModal():S.page==='payback'?paybackModal():S.page==='cancel'||S.page==='bank'?cancelModal():S.page==='manual'?manualModal():'';
  $('content').innerHTML = base + mdl;
  bindAll();
  if($('dCat')) memoReq('dCat','dMemo','dReq',document.querySelector('#svcMdl .btn.pri'));
  if($('fCat')){ const u=()=>{ $('fCatHint').textContent=hintOf(DISC_CAT,$('fCat').value); }; $('fCat').addEventListener('change',u); u(); memoReq('fCat','fMemo','fReq',document.querySelector('[data-foptsave]')); }   // 새 버전 수정 창 — 할인 사유 · 메모(기타면 필수)
  if($('cxCat')) memoReq('cxCat','cxMemo','cxReq',$('cxGo'),S.page==='bank');   // 수기 취소 처리는 메모 항상 필수
  if($('mpCat')) memoReq('mpCat','mpMemo','mpReq',document.querySelector('#mpMdl .btn.pri'));
}
function go(p){ S.f=0; if(p!=='svc') S.sedit=0; S.page=p; if(p==='cancel'&&!S.cid) S.cid=6; render(); }
S.cid=6;
const P0=new URLSearchParams(location.search).get('p'); if(['svc','sub','cancel','bank','manual','payback'].includes(P0)) S.page=P0;
// 다른 화면에서 #svcLog · #histPanel 로 열면 그 위치로(11-26)
setTimeout(()=>{ const h=location.hash&&document.getElementById(location.hash.slice(1)); if(h) h.scrollIntoView({block:'start'}); },60);
const FS=new URLSearchParams(location.search).get('f'); if(FS) fScene(FS); else render();
</script>
</body>
