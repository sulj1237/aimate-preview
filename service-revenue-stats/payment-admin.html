<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>약국 상세 · 결제 · 환불 화면 시안</title>
<!--
  약국 상세(약국관리 > 약국 관리 > 상세)의 결제 · 환불 입력 시안 — 서비스 청구 통계 스토리보드 SA-01-003 ~ 006에서 iframe으로 사용
  화면: svc 약국 서비스 수정(금액 할인 사유) / sub 정기 결제 내역(결제 취소 · 상태) / cancel 결제 취소 창 / manual 수기 결제 창
  약국 · 카드 정보는 예시값. 카테고리는 실데이터(결제 6개월 · 금액 할인 13곳 · A/S · 메모 환불 사례) 기준
-->
<style>
  :root{
    --teal:#1fb6a6; --teal-d:#159b8d; --teal-soft:#e6f7f4;
    --ink:#2b2f33; --muted:#8a9099; --line:#e3e6ea; --bg:#f4f5f7;
    --side:#33383d; --side-line:#454b52; --up:#d6453d; --down:#2f6fd6; --add:#7048e8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);font-size:13px;line-height:1.5}
  button,input,select{font-family:inherit}
  .wrap{display:flex;min-height:100vh}
  .side{width:188px;flex:none;background:var(--side);color:#cdd2d7}
  .side-logo{display:flex;align-items:center;gap:7px;padding:16px;border-bottom:1px solid var(--side-line)}
  .side-mark{width:18px;height:18px;border-radius:7px 7px 7px 2px;background:var(--teal);transform:rotate(8deg);position:relative}
  .side-mark::after{content:"";position:absolute;left:-4px;bottom:-3px;width:8px;height:8px;border-radius:50%;background:#f4de3f}
  .side-word{font-size:16px;font-weight:800;color:#fff}
  .side-grp{font-size:10.5px;color:#8e959c;padding:14px 16px 6px}
  .side-item{padding:8px 16px 8px 26px;font-size:12px;color:#aeb4ba}
  .side-item.on{background:var(--teal);color:#fff;font-weight:700}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
  .topbar{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:12px}
  .crumb{font-size:12px;color:var(--muted)} .crumb b{color:var(--ink)}
  .demo{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px dashed #c7cbd0;border-radius:6px;padding:4px 8px;font-size:11.5px;color:var(--muted)}
  .demo button{height:24px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:11.5px;padding:0 8px;cursor:pointer;color:#4b5158}
  .demo button.on{background:#4b5158;border-color:#4b5158;color:#fff}
  .content{padding:18px;display:flex;flex-direction:column;gap:14px;max-width:1240px;position:relative}
  .panel{background:#fff;border:1px solid var(--line);border-radius:8px}
  .ph{display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
  .ph h3{margin:0;font-size:14px} .ph .sub{font-size:11.5px;color:var(--muted)} .ph .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  .btn{height:32px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;color:#4b5158;cursor:pointer}
  .btn.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
  .btn.sm{height:26px;padding:0 10px;font-size:11.5px}
  .btn.line{border-color:#f0b9b5;color:var(--up)}
  .btn:disabled{color:#c3c9d0;border-color:var(--line);cursor:default}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{background:#f8f9fa;color:#5b6168;font-weight:700;font-size:12px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:9px 12px;border-bottom:1px solid #eff1f3;white-space:nowrap;vertical-align:top}
  .tbl .num{text-align:right;font-variant-numeric:tabular-nums}
  .tbl .ctr{text-align:center}
  .tbl tr.tot td{background:#f8f9fa;font-weight:800}
  .addb{display:inline-block;font-size:9.5px;font-weight:800;color:#fff;background:var(--add);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
  th .addb{margin-left:3px}
  .st{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px}
  .st.ok{background:#e6f6f3;color:#0f8a74} .st.fail{background:#fdecea;color:var(--up)}
  .st.cx{background:#eef0f3;color:#5b6168} .st.px{background:#fff3d6;color:#a86b00} .st.rq{background:#e8f0fd;color:var(--down)}
  .ctag{display:inline-block;border:1px solid #cfd4da;border-radius:4px;padding:0 5px;margin-right:5px;font-size:11px;line-height:17px;color:#3f454c;background:#fff;font-weight:500;white-space:nowrap}
  .rs{font-size:11px;color:#5b6168;margin-top:2px;white-space:normal;max-width:260px}
  .rs b{color:var(--ink)}
  .red{color:var(--up);font-weight:700}
  .kvg{display:grid;grid-template-columns:120px 1fr 120px 1fr;border-top:1px solid var(--line);margin:0 18px 16px}
  .kvg>div{padding:9px 12px;border-bottom:1px solid #eff1f3;font-size:12.5px}
  .kvg .k{background:#f8f9fa;color:#5b6168;font-weight:700;font-size:12px}
  .opt{font-size:11.5px;color:var(--muted);padding:0 18px 14px}
  /* 창 */
  .dim{position:fixed;inset:0;background:rgba(30,34,38,.45);z-index:20}
  .mdl{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:21;width:560px;background:#fff;border-radius:10px;box-shadow:0 18px 40px -12px rgba(0,0,0,.45)}
  .mdl.wide{width:720px}
  .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
  .mh h3{margin:0;font-size:15px} .mh .x{margin-left:auto;border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer}
  .mb{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
  .fr{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:start}
  .fl{font-size:12.5px;font-weight:700;color:#4b5158;padding-top:7px}
  .fi{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:12.5px;color:var(--ink);background:#fff;width:100%}
  .fi[disabled]{background:#f6f7f9;color:var(--muted)}
  .ro{padding-top:7px;font-size:12.5px}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
  .seg{display:flex;gap:6px}
  .seg label{display:flex;align-items:center;gap:5px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;cursor:pointer}
  .seg label.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-d);font-weight:700}
  .seg input{display:none}
  .pv{background:#f8f9fa;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12px}
  .pv .mlab{font-size:11px;color:var(--muted)}
  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sum div{background:#f8f9fa;border-radius:6px;padding:8px 10px;font-size:11.5px;color:var(--muted)}
  .sum b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
  .note{font-size:11.5px;color:#5b6168;background:#f3f7ff;border:1px solid #d7e3fb;border-radius:6px;padding:9px 12px;line-height:1.6}
  .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line)}
  code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#eef2f6;border-radius:4px;padding:0 4px}
  .req{display:none;font-size:9.5px;font-weight:800;color:#fff;background:var(--up);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
  .req.on{display:inline-block}
  .fi.need{border-color:var(--up);background:#fff7f6}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b2f33;color:#fff;padding:9px 16px;border-radius:6px;font-size:12.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .tbl tr.bmh td{background:#f6f7fb;border-top:1px solid var(--line);font-size:12.5px;padding:7px 10px}.bmn{color:#6b7280;font-size:11.5px;margin-left:4px}
  .tbl tr.bmi td:first-child{padding-left:22px}.bml{color:#9aa1a9;margin-right:4px}.wy{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:4px;background:#eef0f3;color:#4b5563;font-weight:600}
.dmck{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}#demoPer{display:inline-flex;align-items:center;gap:4px;margin-left:6px}#demoPer .fi{width:96px;height:28px;font-size:12px;padding:0 6px}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="topbar">
      <div class="crumb">약국관리 &gt; 약국 관리 &gt; <b>상세</b></div>
      <div class="demo">시안 화면
        <button data-go="svc">약국 서비스 수정</button>
        <button data-go="sub">정기 결제 내역</button>
        <button data-go="cancel">결제 취소</button>
        <button data-go="manual">수기 결제</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const fmt=n=>Number(n).toLocaleString('ko-KR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove('show'),1800); }

/* 카테고리 — 실데이터 기준으로 정함. 화면에는 안내 문구만 */
const DISC_CAT=[ // 금액 할인 사유 — 화면 안내 문구 (근거 데이터는 스토리보드 디스크립션)
  ['계약 할인','계약 · 제휴 조건으로 약속한 할인 (예: DRS 파머시 퍼스트 중복)'],
  ['보상 · 테스트','서비스 오류 보상 · 테스트로 할인할 때'],
  ['기타','위에 해당하지 않을 때 — 메모에 이유 입력']];
const PAY_CAT=[ // 수기 결제 사유
  ['재시도 결제','정기 결제가 실패한 달을 다시 결제할 때 (밀린 대금 포함)'],
  ['누락분 결제','이용 중인 서비스 금액이 정기 결제에서 빠졌을 때'],
  ['취소 후 재결제','결제 취소 뒤 받을 금액을 다시 결제할 때 (차액 · 일할 · 반값)'],
  ['요금제 변경','요금제를 바꾸면서 결제할 때'],
  ['개국','개국하면서 결제할 때'],
  ['서비스 외 결제','장비(PC · 바코드건) · 설치 · 개국 작업비 · 라벨지처럼 서비스 요금이 아닐 때 — 서비스 청구 통계에서 빼고 기타 판매로 집계'],
  ['기타','위에 해당하지 않을 때 — 메모에 이유 입력']];
const CANCEL_CAT=[ // 결제 취소 사유
  ['해지','서비스를 해지해 그 달 결제를 돌려줄 때'],
  ['폐업 · 양도','폐업 · 양도양수로 결제를 돌려줄 때'],
  ['과다 청구','해지 · 할인 · 서비스 변경이 정기 결제 금액에 반영되지 않아 더 결제됐을 때'],
  ['중복 결제','같은 청구월이 두 번 결제됐을 때'],
  ['카드 변경','다른 카드로 다시 결제하기 위해 취소할 때'],
  ['기타','위에 해당하지 않을 때 — 메모에 이유 입력']];
const opt=(a,v)=>a.map(([t])=>`<option value="${t}" ${t===v?'selected':''}>${t}</option>`).join('');
/* 사유 표시 — 고른 카테고리는 회색 테두리 태그, 직접 쓴 메모는 일반 글자. 저장 값은 '[카테고리] 메모' */
const rsn=s=>{ const m=/^\[([^\]]+)\]\s*(.*)$/.exec(s||''); return m?'<span class="ctag">'+esc(m[1])+'</span>'+esc(m[2]):esc(s||''); };
const hintOf=(a,v)=>(a.find(x=>x[0]===v)||a[0])[1];

/* 예시 약국 — 스마트 OCR 단독(49,500) · 10월 말 파머시 퍼스트 해지 */
const PH={name:'샘플약국', store:'2024047xxxx', card:'신한카드 · 뒤 4자리 ****', method:'수기 정기결제(레거시)'};
// 정기 결제 내역: [id, 과금일, 청구월, 결제상태, 결제액, 취소 금액, 실패 사유, 결제 이유, 취소 사유 · 메모]
const HIST=[
  [7,'2026-11-06 11:20','2026-11','ok',49500,0,'','[취소 후 재결제] 11월분 · 파머시 퍼스트 해지 반영',''],
  [6,'2026-11-05 10:02','2026-11','cx',71500,71500,'','굿팜결제','[과다 청구] 파머시 퍼스트 10월 해지 미반영'],
  [5,'2026-10-08 14:21','2026-10','ok',71500,0,'','[재시도 결제] 10월분 · 카드 한도 초과 후 결제',''],
  [4,'2026-10-05 10:02','2026-10','fail',71500,0,'기타오류(8326 : 사용 한도 초과)','굿팜결제',''],
  [3,'2026-09-05 10:03','2026-09','ok',71500,0,'','굿팜결제',''],
  [2,'2026-08-05 10:04','2026-08','cx',71500,71500,'','굿팜결제','[중복 결제] 같은 날 두 번 결제'],
  [1,'2026-08-05 10:02','2026-08','ok',71500,0,'','굿팜결제',''],
  [0,'2026-07-05 10:03','2026-07','fail',71500,0,'기타오류(8324 : 거래 정지 카드)','굿팜결제','']];
const ST={ok:['ok','성공'],fail:['fail','실패'],cx:['cx','취소 완료'],rq:['rq','취소 요청 중'],bank:['cx','계좌 환불'],cf:['fail','취소 실패']};

const S={page:'sub'};
function side(){ $('side').innerHTML='<div class="side-logo"><span class="side-mark"></span><span class="side-word">goodpharm</span></div><div class="side-grp">약국관리</div>'+
  ['약국 관리','신규 약국 관리','약국 A/S','약국 결제 관리','태블릿 관리'].map((x,i)=>'<div class="side-item'+(i===0?' on':'')+'">'+x+'</div>').join(''); }

/* 금액 할인 — 약국 단위 1건 + 적용 기간(청구월 기준). 기준 청구월 = 2026-11 */
const NOW='2026-11';
const D={amt:10000, cat:'계약 할인', memo:'DRS 파머시 퍼스트 중복', from:'2026-06', to:'', who:'김운영', at:'05-28'};   // who · at = 등록자 · 등록일 (저장한 관리자로 자동 기록)   // to '' = 계속
const HISTD=[['2025-03','2025-05',15000,'보상 · 테스트','스캐너 인식 오류 (대표님 승인)','이영업 · 2025-02-27']];
const mon=m=>m?(+m.slice(0,4))+'-'+m.slice(5):'';
const nextM=m=>{ let [y,mm]=m.split('-').map(Number); mm++; if(mm>12){mm=1;y++;} return y+'-'+String(mm).padStart(2,'0'); };
const dState=d=>d.from>NOW?['rq','적용 예정']:(d.to&&d.to<NOW)?['cx','종료']:(d.to===NOW)?['px','종료 예정']:['ok','적용 중'];
const period=d=>d.from+' ~ '+(d.to||'계속');
// 데모 — 1차(11-24). 옵션 하나씩 데모로 지정하고 데모 기간(시작월 ~ 종료월, 필수)을 고름. 기간 청구분만 그 옵션 0원.
// 끝나면 자동 전환 없음 → 담당자가 결제 카드 등록 · 데모 해제(승인)로 정기 결제 시작. 지정 · 해제 · 카드 등록은 시점 · 처리자를 이력에 남김. 지정 · 해제 권한 = 직원 관리에서 관리자 권한을 받은 직원
const DEMO={opt:'스마트2D', price:30000, from:'2026-11', to:'2026-12', who:'김운영', at:'2026-11-03'};
function demoText(d=DEMO){ const [c,t]=dState(d);
  return `데모 <b>${d.opt}</b> · ${period(d)} <span class="st ${c}">${t}</span> <span class="hint">지정 ${d.who} · ${d.at.slice(5)}</span>`+(d.to&&d.to<=NOW?` <span class="hint">→ 결제 카드 등록 · 데모 해제(승인)하면 ${nextM(d.to)} 청구분부터 ${d.opt} 정가 ${fmt(d.price*1.1)}원 정기 결제</span>`:''); }
// 서비스 변경 이력 — 데모 지정 · 해제, 결제 카드 등록, 금액 할인 등록을 시점 · 처리자와 함께 쌓음 (최신이 위)
const SVC_LOG=[['2026-11-03 10:12','김운영','데모 지정','스마트2D · 데모 기간 2026-11 ~ 2026-12'],['2026-05-28 15:40','김운영','금액 할인 등록','−11,000 [계약 할인] DRS 파머시 퍼스트 중복'],['2024-06-03 11:20','이영업','결제 카드 등록','신한카드 · 뒤 4자리 ****'],['2024-04-22 09:30','이영업','서비스 등록 · 승인','굿팜 솔루션 (NEW) · 스마트 OCR · 굿팜 POS']];
const svcLog=()=>`<div class="opt" id="svcLog"><b style="color:#1f2328">서비스 변경 이력</b><table class="tbl" style="margin-top:6px"><thead><tr><th>일시</th><th>처리자</th><th>내용</th><th>상세</th></tr></thead><tbody>${SVC_LOG.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td><td><b>${l[2]}</b></td><td>${esc(l[3])}</td></tr>`).join('')}</tbody></table></div>`;
function discText(d=D){

function memoReq(catId,memoId,reqId,btn){
  const u=()=>{ const on=$(catId).value==='기타'; $(reqId).classList.toggle('on',on); $(memoId).classList.toggle('need',on&&!$(memoId).value.trim()); };
  $(catId).addEventListener('change',u); $(memoId).addEventListener('input',u); u();
  if(btn) btn.addEventListener('click',e=>{ if($(catId).value==='기타'&&!$(memoId).value.trim()){ e.stopImmediatePropagation(); toast('기타를 고르면 메모를 입력해야 합니다'); $(memoId).focus(); } },true);
}

/* 청구월 선택지 — 항상 표시. 미결제 청구월 = 정기 결제 내역에서 실패만 있고 성공(정기 · 수기)이 없는 달 */
// 선택지 = 과금시작월(2024-06) ~ 이번 달 전체, 미결제 청구월은 맨 위 묶음
const BILL_START='2024-06';
const BM=(()=>{ const a=[]; let m=BILL_START; while(m<=NOW){ a.unshift(m); m=nextM(m); } return a; })();
const unpaid=()=>BM.filter(m=>HIST.some(h=>h[2]===m&&h[3]==='fail')&&!HIST.some(h=>h[2]===m&&h[3]==='ok')).sort();
const bmDefault=()=>NOW;   // 기본값 = 이번 달. 지난 미결제 달은 목록 위쪽에서 고름
const bmOpts=()=>{ const u=unpaid(), o=m=>`<option value="${m}" ${m===bmDefault()?'selected':''}>${m}${u.includes(m)?' (미결제)':''}</option>`;
  return (u.length?`<optgroup label="미결제 청구월">${u.map(o).join('')}</optgroup>`:'')+`<optgroup label="전체 (과금 시작 ${BILL_START} ~ 이번 달)">${BM.filter(m=>!u.includes(m)).map(o).join('')}</optgroup>`; };
const bmHint=()=>`기본값은 이번 달(${NOW})`+(unpaid().length?` · 미결제 ${unpaid().join(' · ')}은 목록에서 고름`:'')+' · 두 달 치는 달마다 한 건씩 결제';

    ['dCat','dMemo','dAmt'].forEach(id=>{ $(id).oninput=u; $(id).onchange=u; }); u(); }
  if($('cxCat')){ const h=view().find(x=>x[0]===S.cid)||HIST[0], max=h[4]-h[5];
    const u=()=>{ $('cxHint').textContent=hintOf(CANCEL_CAT,$('cxCat').value); };
    $('cxCat').onchange=u; u(); $('cxGo').onclick=()=>toast(S.page==='bank'?'시안 — 계좌 환불 기록은 저장되지 않습니다':'시안 — 페이앱 취소 요청은 진행되지 않습니다'); }
  if($('mpCat')){ const u=()=>{ const c=$('mpCat').value, m=$('mpMemo').value.trim(), bm=$('mpBm').value,
        f=HIST.filter(h=>h[2]===bm&&h[3]==='fail'&&!paidBy(h)).pop();
      $('mpLink').innerHTML=f?`<b>${f[1].slice(0,10)} · ${fmt(f[4])}원 · ${esc(f[6])}</b><div class="hint">결제되면 이 건은 이 실패 건과 수기 결제가 <b>같은 청구월 결제 이력</b>으로 묶여 보임</div>`
        :'<span class="hint">이 청구월은 미결제 건 없음 — 새 결제로 저장</span>';
      if(f && e0!==bm){ $('mpAmt').value=fmt(f[4]); e0=bm; }
      $('mpHint').textContent=hintOf(PAY_CAT,c); $('mpPvT').innerHTML='<span class="ctag">'+c+'</span>'+(+$('mpBm').value.slice(5))+'월분'+(m?' · '+esc(m):''); };
    let e0=null; ['mpCat','mpBm','mpMemo'].forEach(id=>{ $(id).oninput=u; $(id).onchange=u; }); u(); }
}
function render(){ renderBase(); }
function renderBase(){
  side();
  document.querySelectorAll('.demo button').forEach(b=>b.classList.toggle('on',b.dataset.go===S.page));
  const base = svcList()+subPanel();
  const mdl = S.page==='svc'?svcModal():S.page==='payback'?paybackModal():S.page==='cancel'||S.page==='bank'?cancelModal():S.page==='manual'?manualModal():'';
  $('content').innerHTML = base + mdl;
  bindAll();
  if($('dCat')) memoReq('dCat','dMemo','dReq',document.querySelector('#svcMdl .btn.pri'));
  if($('cxCat')) memoReq('cxCat','cxMemo','cxReq',$('cxGo'));
  if($('mpCat')) memoReq('mpCat','mpMemo','mpReq',document.querySelector('#mpMdl .btn.pri'));
}
function go(p){ S.page=p; if(p==='cancel'&&!S.cid) S.cid=6; render(); }
S.cid=6;
const P0=new URLSearchParams(location.search).get('p'); if(['svc','sub','cancel','bank','manual','payback'].includes(P0)) S.page=P0;
render();
</script>
