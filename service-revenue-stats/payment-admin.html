<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>약국 상세 · 약국 서비스 · 정기 결제 화면 시안</title>
<!--
  약국 상세(약국관리 > 약국 관리 > 상세)의 약국 서비스 · 정기 결제 입력 시안 — 서비스 청구 통계 스토리보드 SA-01-003 ~ 006에서 iframe으로 사용
  화면: svc 약국 서비스 수정(금액 할인 사유) / sub 정기 결제 내역(결제 취소 · 상태) / cancel 결제 취소 창 / manual 수기 결제 창
  약국 · 카드 정보는 예시값. 카테고리는 실데이터(결제 6개월 · 금액 할인 13곳 · A/S · 메모 환불 사례) 기준
-->
<style>
  :root{
    --teal:#1fb6a6; --teal-d:#159b8d; --teal-soft:#e6f7f4;
    --ink:#2b2f33; --muted:#8a9099; --line:#e3e6ea; --bg:#f4f5f7;
    --side:#33383d; --side-line:#454b52; --up:#d6453d; --down:#2f6fd6; --add:#7048e8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);font-size:13px;line-height:1.5}
  button,input,select{font-family:inherit}
  .wrap{display:flex;min-height:100vh}
  .side{width:188px;flex:none;background:var(--side);color:#cdd2d7}
  .side-logo{display:flex;align-items:center;gap:7px;padding:16px;border-bottom:1px solid var(--side-line)}
  .side-mark{width:18px;height:18px;border-radius:7px 7px 7px 2px;background:var(--teal);transform:rotate(8deg);position:relative}
  .side-mark::after{content:"";position:absolute;left:-4px;bottom:-3px;width:8px;height:8px;border-radius:50%;background:#f4de3f}
  .side-word{font-size:16px;font-weight:800;color:#fff}
  .side-grp{font-size:10.5px;color:#8e959c;padding:14px 16px 6px}
  .side-item{padding:8px 16px 8px 26px;font-size:12px;color:#aeb4ba}
  .side-item.on{background:var(--teal);color:#fff;font-weight:700}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
  .topbar{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:12px}
  .crumb{font-size:12px;color:var(--muted)} .crumb b{color:var(--ink)}
  .demo{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px dashed #c7cbd0;border-radius:6px;padding:4px 8px;font-size:11.5px;color:var(--muted)}
  .demo button{height:24px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:11.5px;padding:0 8px;cursor:pointer;color:#4b5158}
  .demo button.on{background:#4b5158;border-color:#4b5158;color:#fff}
  .content{padding:18px;display:flex;flex-direction:column;gap:14px;max-width:1240px;position:relative}
  .panel{background:#fff;border:1px solid var(--line);border-radius:8px}
  .ph{display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
  .ph h3{margin:0;font-size:14px} .ph .sub{font-size:11.5px;color:var(--muted)} .ph .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  .btn{height:32px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;color:#4b5158;cursor:pointer}
  .btn.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
  .btn.sm{height:26px;padding:0 10px;font-size:11.5px}
  .btn.line{border-color:#f0b9b5;color:var(--up)}
  .btn:disabled{color:#c3c9d0;border-color:var(--line);cursor:default}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{background:#f8f9fa;color:#5b6168;font-weight:700;font-size:12px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:9px 12px;border-bottom:1px solid #eff1f3;white-space:nowrap;vertical-align:top}
  .tbl .num{text-align:right;font-variant-numeric:tabular-nums}
  .tbl .ctr{text-align:center}
  .tbl tr.tot td{background:#f8f9fa;font-weight:800}
  .addb{display:inline-block;font-size:9.5px;font-weight:800;color:#fff;background:var(--add);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
  th .addb{margin-left:3px}
  .st{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px}
  .optc{display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:1px 9px;color:#1f2328;white-space:nowrap;margin-right:4px}   /* 옵션 = 칩 하나씩(A안, 11-26) */
  .optd{margin-right:4px;display:inline-flex;align-items:center;gap:5px;border:1px solid #bfe3da;background:#f3fbf8;border-radius:12px;padding:1px 4px 1px 9px;color:#1f2328;white-space:nowrap}.optd .st{margin:0}.optd .hint{color:#5b6670}   /* 데모 옵션 = 옵션명 · 데모 · 기간을 한 덩어리 칩으로(11-26) */
  .st.ok{background:#e6f6f3;color:#0f8a74} .st.fail{background:#fdecea;color:var(--up)}
  .st.cx{background:#eef0f3;color:#5b6168} .st.px{background:#fff3d6;color:#a86b00} .st.rq{background:#e8f0fd;color:var(--down)}
  .ctag{display:inline-block;border:1px solid #cfd4da;border-radius:4px;padding:0 5px;margin-right:5px;font-size:11px;line-height:17px;color:#3f454c;background:#fff;font-weight:500;white-space:nowrap}
  .rs{font-size:11px;color:#5b6168;margin-top:2px;white-space:normal;max-width:260px}
  .rs b{color:var(--ink)}
  .red{color:var(--up);font-weight:700}
  .kvg{display:grid;grid-template-columns:120px 1fr 120px 1fr;border-top:1px solid var(--line);margin:0 18px 16px}
  .kvg>div{padding:9px 12px;border-bottom:1px solid #eff1f3;font-size:12.5px}
  .kvg .k{background:#f8f9fa;color:#5b6168;font-weight:700;font-size:12px}
  .opt{font-size:11.5px;color:var(--muted);padding:0 18px 14px}
  /* 창 */
  .dim{position:fixed;inset:0;background:rgba(30,34,38,.45);z-index:20}
  .mdl{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:21;width:560px;background:#fff;border-radius:10px;box-shadow:0 18px 40px -12px rgba(0,0,0,.45)}
  .mdl.wide{width:1000px}
  .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
  .mh h3{margin:0;font-size:15px} .mh .x{margin-left:auto;border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer}
  .mb{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
  .fr{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:start}
  .fl{font-size:12.5px;font-weight:700;color:#4b5158;padding-top:7px}
  .fi{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:12.5px;color:var(--ink);background:#fff;width:100%}
  .fi[disabled]{background:#f6f7f9;color:var(--muted)}
  .ro{padding-top:7px;font-size:12.5px}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
  .seg{display:flex;gap:6px}
  .seg label{display:flex;align-items:center;gap:5px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;cursor:pointer}
  .seg label.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-d);font-weight:700}
  .seg input{display:none}
  .pv{background:#f8f9fa;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12px}
  .pv .mlab{font-size:11px;color:var(--muted)}
  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sum div{background:#f8f9fa;border-radius:6px;padding:8px 10px;font-size:11.5px;color:var(--muted)}
  .sum b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
  .note{font-size:11.5px;color:#5b6168;background:#f3f7ff;border:1px solid #d7e3fb;border-radius:6px;padding:9px 12px;line-height:1.6}
  .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line)}
  code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#eef2f6;border-radius:4px;padding:0 4px}
  .req{display:none;font-weight:800;color:var(--up);margin-left:2px}   /* 필수 = 라벨 옆 빨간 * (배지 X) */
  .req.on{display:inline-block}
  .fi.need{border-color:var(--up);background:#fff7f6}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b2f33;color:#fff;padding:9px 16px;border-radius:6px;font-size:12.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .tbl tr.bmh td{background:#f6f7fb;border-top:1px solid var(--line);font-size:12.5px;padding:7px 10px}.bmn{color:#6b7280;font-size:11.5px;margin-left:4px}
  .tbl tr.bmi td:first-child{padding-left:22px}.bml{color:#9aa1a9;margin-right:4px}.wy{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:4px;background:#eef0f3;color:#4b5563;font-weight:600}
.oc{border:1px solid var(--line);border-radius:8px;margin-bottom:10px}.oc .ohd{display:flex;align-items:center;gap:14px;padding:9px 12px;background:#f6f7f9;border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;font-size:12.5px}.oc .ohd b{font-size:13px}.oc .ohd .r{margin-left:auto;font-weight:700}.oc .obd{padding:10px 12px;display:grid;gap:10px}.oc .orw{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start}.oc .orw>span{font-size:12px;font-weight:700;color:#4b5158;padding-top:6px}.oc .fi{height:30px;font-size:12px;padding:0 8px}.oc .seg .fi.sm{width:100px;flex:none}.oc .seg select[data-k]{flex:none}.oc .dcw .fi.sm{width:100px;flex:none}.oc .hint{font-size:11.5px;color:#8a9099}
.sck{display:inline-block!important}.schh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px}.schh .btn{margin-left:auto}.ro4 b{display:block;font-size:12.5px;padding:5px 0}.chg{color:#d9480f!important;font-weight:700}#optTbl th,#optTbl td,.tbl.sch th,.tbl.sch td{font-size:11px;padding:6px 6px;white-space:nowrap}.tbl.sch td:last-child{white-space:normal}.tbl.sch{width:100%}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px}.dgrid label{display:block;font-size:11.5px;color:#5b6168;margin-bottom:3px}.dgrid .fi{height:30px;font-size:12px;padding:0 8px}.dgrid .w2{grid-column:span 2}
.dmck{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
/* 옵션 표 서비스 상태 칸 — 데모 기간은 상태 아래 줄로(표가 창 밖으로 넘치지 않게, 11-26) */.dmSeg{display:flex!important;flex-direction:column;align-items:flex-start;gap:4px}.dmSeg .demoPer{margin-left:0}.dmSeg .fi{height:26px!important;font-size:11px!important;padding:0 4px!important;width:84px!important}.dmSeg .demoPer .fi{width:80px!important}#optTbl td{vertical-align:top}.optWrap{overflow-x:auto}#demoPer,.demoPer{display:inline-flex;align-items:center;gap:4px;margin-left:6px}#demoPer .fi{width:96px;height:28px;font-size:12px;padding:0 6px}
.st.ex{background:#fff3d6;color:#a86b00}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="topbar">
      <div class="crumb">약국관리 &gt; 약국 관리 &gt; <b>상세</b></div>
      <div class="demo">시안 화면
        <button data-go="svc">약국 서비스 수정</button>
        <button data-go="sub">정기 결제 내역</button>
        <button data-go="cancel">결제 취소</button>
        <button data-go="manual">수기 결제</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const fmt=n=>Number(n).toLocaleString('ko-KR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove('show'),1800); }

/* 카테고리 — 실데이터 기준으로 정함. 화면에는 안내 문구만 */
const DISC_CAT=[ // 금액 할인 사유 — 화면 안내 문구 (근거 데이터는 스토리보드 디스크립션)
  ['계약 할인','계약 · 제휴 조건으로 약속한 할인 (예: DRS 파머시 퍼스트 중복)'],
  ['보상 · 테스트','서비스 오류 보상 · 테스트로 할인할 때'],
  ['기타','위에 해당하지 않을 때 — 메모에 이유 입력']];
const PAY_CAT=[ // 수기 결제 사유
  ['재시도 결제','정기 결제가 실패한 달을 다시 결제할 때 (밀린 대금 포함)'],
  ['누락분 결제','이용 중인 서비스 금액이 정기 결제에서 빠졌을 때'],
  ['취소 후 재결제','결제 취소 뒤 받을 금액을 다시 결제할 때 (차액 · 일할 · 반값)'],
  ['요금제 변경','요금제를 바꾸면서 결제할 때'],
  ['개국','개국하면서 결제할 때'],
  ['서비스 외 결제','장비(PC · 바코드건) · 설치 · 개국 작업비 · 라벨지처럼 서비스 요금이 아닐 때 — 서비스 청구 통계에서 빼고 기타 판매로 집계'],
  ['기타','위에 해당하지 않을 때 — 메모에 이유 입력']];
const CANCEL_CAT=[ // 결제 취소 사유
  ['해지','서비스를 해지해 그 달 결제를 돌려줄 때'],
  ['폐업 · 양도','폐업 · 양도양수로 결제를 돌려줄 때'],
  ['과다 청구','해지 · 할인 · 서비스 변경이 정기 결제 금액에 반영되지 않아 더 결제됐을 때'],
  ['중복 결제','같은 청구월이 두 번 결제됐을 때'],
  ['카드 변경','다른 카드로 다시 결제하기 위해 취소할 때'],
  ['기타','위에 해당하지 않을 때 — 메모에 이유 입력']];
const opt=(a,v)=>a.map(([t])=>`<option value="${t}" ${t===v?'selected':''}>${t}</option>`).join('');
/* 사유 표시 — 고른 카테고리는 회색 테두리 태그, 직접 쓴 메모는 일반 글자. 저장 값은 '[카테고리] 메모' */
const rsn=s=>{ const m=/^\[([^\]]+)\]\s*(.*)$/.exec(s||''); return m?'<span class="ctag">'+esc(m[1])+'</span>'+esc(m[2]):esc(s||''); };
const hintOf=(a,v)=>(a.find(x=>x[0]===v)||a[0])[1];

/* 예시 약국 — 스마트 OCR 단독(49,500) · 10월 말 파머시 퍼스트 해지 */
const PH={name:'샘플약국', store:'2024047xxxx', card:'신한카드 · 뒤 4자리 ****', method:'수기 정기결제(레거시)'};
// 정기 결제 내역: [id, 과금일, 청구월, 결제상태, 결제액, 취소 금액, 실패 사유, 결제 이유, 취소 사유 · 메모] (+ [9] 취소 등록자 · [10] 결제 등록자 · [11] 취소일시 — CXAT)
// 취소일시 — 한 줄에 결제와 취소를 같이 보여 주므로 취소 금액 칸 아래에 취소일(수기 취소는 입금일)을 따로 표시
const CXAT={6:'2026-11-06 11:15',2:'2026-08-05 14:30'};
const cxAt=h=>h[11]||CXAT[h[0]]||'2026-11-06 11:15';
const CXLB={cx:' ',rq:'요청',cf:'요청',bank:'취소금 입금'};   // 취소 완료는 날짜만
const HIST=[
  [7,'2026-11-06 11:20','2026-11','ok',49500,0,'','[취소 후 재결제] 11월분 · 파머시 퍼스트 해지 반영',''],
  [6,'2026-11-05 10:02','2026-11','cx',71500,71500,'','11월 서비스 이용료','[과다 청구] 파머시 퍼스트 10월 해지 미반영'],
  [5,'2026-10-08 14:21','2026-10','ok',71500,0,'','[재시도 결제] 10월분 · 카드 한도 초과 후 결제',''],
  [4,'2026-10-05 10:02','2026-10','fail',71500,0,'기타오류(8326 : 사용 한도 초과)','10월 서비스 이용료',''],
  [3,'2026-09-05 10:03','2026-09','ok',71500,0,'','9월 서비스 이용료',''],
  [2,'2026-08-05 10:04','2026-08','cx',71500,71500,'','8월 서비스 이용료','[중복 결제] 같은 날 두 번 결제'],
  [1,'2026-08-05 10:02','2026-08','ok',71500,0,'','8월 서비스 이용료',''],
  [0,'2026-07-05 10:03','2026-07','fail',71500,0,'기타오류(8324 : 거래 정지 카드)','7월 서비스 이용료','']];
const ST={ok:['ok','성공'],fail:['fail','실패'],cx:['cx','취소 완료'],rq:['rq','취소 요청 중'],bank:['cx','취소 완료'],cf:['fail','취소 실패']};

const S={page:'sub'};
function side(){ $('side').innerHTML='<div class="side-logo"><span class="side-mark"></span><span class="side-word">goodpharm</span></div><div class="side-grp">약국관리</div>'+
  ['약국 관리','신규 약국 관리','약국 A/S','약국 결제 관리','태블릿 관리'].map((x,i)=>'<div class="side-item'+(i===0?' on':'')+'">'+x+'</div>').join(''); }

/* 금액 할인 — 약국 단위 1건 + 적용 기간(청구월 기준). 기준 청구월 = 2026-11 */
const NOW='2026-11';

    <div class="fr" id="dCatRow"><span class="fl">할인 사유</span><div><select class="fi" id="dCat">${opt(DISC_CAT,'계약 할인')}</select></div></div>
    <div class="fr" id="dMemoRow"><span class="fl">메모<span class="req" id="dReq">*</span></span><div><input class="fi" id="dMemo" value="DRS 파머시 퍼스트 중복" placeholder="기타 사유를 입력하세요"></div></div>
    <div class="fr" id="dWhoRow"><span class="fl">등록자</span><div><select class="fi" id="dWho" style="width:220px">${STAFF.map(n=>`<option ${n==='김운영'?'selected':''}>${n}</option>`).join('')}</select></div></div>
    <div class="fr" id="dTotRow"><span class="fl">총 과금액</span><div class="ro"><b id="dTot"></b></div></div>
  </div>
  <div class="mf"><button class="btn" data-close>취소</button><button class="btn pri" data-toast="시안 — 저장되지 않습니다">저장</button></div></div>`;
}

/* ② 결제 취소 창 */
function cancelModal(){
  const h=view().find(x=>x[0]===S.cid)||HIST[0], left=h[4]-h[5];
  const bk=S.page==='bank'; // 수기 취소 처리(11-26 1차) — 페이앱에서 취소할 수 없는 결제를 약국 계좌로 입금한 뒤 기록 → 취소 완료(수기 취소)
  return `<div class="dim"></div><div class="mdl" id="cxMdl"><div class="mh"><h3>${bk?'수기 취소 처리':'결제 취소'}</h3><button class="x" data-close>×</button></div>
  <div class="mb">
    <div class="sum" id="cxSum"><div>과금일<b>${h[1].slice(0,10)}</b></div><div>청구월<b>${h[2]}</b></div><div>결제액<b>${fmt(h[4])}원</b></div></div>
    <div class="fr" id="cxAmtRow"><span class="fl">취소 금액</span><div class="ro"><b class="red">${fmt(left)}원</b> (결제액 전액)<div class="hint">${bk?'페이앱에서 취소할 수 없는 결제 — 약국 계좌로 직접 입금한 금액':'결제 건 단위 전체 취소 — 일부만 돌려줄 때는 전액 취소 후 받을 금액을 수기 결제'}</div></div></div>${bk?`<div class="fr" id="bkDateRow"><span class="fl">입금일</span><div><input class="fi" id="bkDate" type="date" value="2026-11-17" style="width:150px"><div class="hint">약국 계좌로 입금한 날 — 매출은 이 날의 달에서 뺌</div></div></div>`:''}
    <div class="fr" id="cxCatRow"><span class="fl">취소 사유</span><div><select class="fi" id="cxCat">${opt(CANCEL_CAT,'과다 청구')}</select><div class="hint" id="cxHint"></div></div></div>
    <div class="fr" id="cxMemoRow"><span class="fl">메모<span class="req" id="cxReq">*</span></span><div><input class="fi" id="cxMemo" value="${bk?'취소 불가 건으로 인한 취소금 입금':'파머시 퍼스트 10월 해지 미반영'}" placeholder="${bk?'예: 취소 불가 건으로 인한 취소금 입금 — 약국 계좌로 송금':'기타 사유를 입력하세요'}"></div></div>
    <div class="fr" id="cxWhoRow"><span class="fl">등록자</span><div class="ro">김운영 <span class="hint">(로그인한 관리자 · 자동 기록)</span></div></div>
    ${bk?`<div class="note" id="cxNote">약국 계좌로 입금한 뒤 저장하면 결제 건이 <b>취소 완료</b>(수기 취소)로 바뀌고 취소 금액 · 사유 · 메모 · 입금일이 보여요.<br>· 매출 통계는 <b>입금일의 달</b>에서, 서비스 청구 통계는 원래 청구월 결제 완료에서 뺍니다.</div>`:`<div class="note" id="cxNote">결제 취소를 누르면 페이앱으로 취소를 요청하고, 페이앱 응답에 따라 나뉩니다.<br>· 정산 전(보통 결제 후 영업일 3~5일 이내) → 바로 <b>취소 완료</b><br>· 정산 후 → <b>취소 요청 중</b> — 페이앱이 알려 준 반환금을 운영팀이 수기 입금하면 카드 취소 후 취소 완료<br>· 다시 받을 금액이 있으면 취소 후 <b>수기 결제</b>(사유 <b>취소 후 재결제</b>) — 예: 71,500 취소 → 49,500 재결제</div>`}
  </div>
  <div class="mf"><button class="btn" data-close>닫기</button><button class="btn pri" id="cxGo">${bk?'수기 취소 처리':'결제 취소'}</button></div></div>`;
}

/* 반환금 입금 기록 — 11-24 삭제(페이앱 취소 완료 알림으로 자동 반영, 매출은 알림 받은 달에서 뺌). 화면 진입 없음, 코드만 남음 */
// 반환금 입금 기록 — 11-24 삭제(입금 후 페이앱 취소 완료 알림으로 자동 반영). 시안 코드만 남김
function paybackModal(){
  const h=view().find(x=>x[0]===S.cid)||HIST[0];
  return `<div class="dim"></div><div class="mdl" id="pbMdl"><div class="mh"><h3>반환금 입금 기록</h3><button class="x" data-close>×</button></div>
  <div class="mb">
    <div class="sum" id="pbSum"><div>과금일<b>${h[1].slice(0,10)}</b></div><div>청구월<b>${h[2]}</b></div><div>반환금<b class="red">${fmt(h[5]||h[4])}원</b></div></div>
    <div class="fr"><span class="fl">입금 계좌</span><div class="ro">OO은행 ***-****-**** (페이앱이 알려 준 계좌)</div></div>
    <div class="fr" id="pbDateRow"><span class="fl">입금일</span><div><input class="fi" id="pbDate" type="date" value="2026-11-24"></div></div>
    <div class="fr"><span class="fl">처리자</span><div class="ro">김운영 (로그인한 관리자 · 자동)</div></div>
    <div class="fr"><span class="fl">메모</span><div><input class="fi" id="pbMemo" placeholder="선택 입력"></div></div>
    <div class="note" id="pbNote">반환금을 입금한 뒤 기록을 남기면 결제 건에 <b>반환금 입금 일자 · 처리자</b>가 보여요.<br>· 매출 통계는 <b>반환금을 입금한 달</b>에서 뺍니다. 서비스 청구 통계는 원래 청구월 결제 완료에서 뺍니다.<br>· 페이앱이 입금을 확인하고 카드 취소 결과를 보내면 <b>취소 완료</b>로 바뀝니다.</div>
  </div>
  <div class="mf"><button class="btn" data-close>닫기</button><button class="btn pri" id="pbGo">기록 저장</button></div></div>`;
}

/* 사유 기타 → 메모 필수: 라벨에 필수 표시, 비어 있으면 저장 · 결제 · 취소 막음 */
function memoReq(catId,memoId,reqId,btn,always){
  const u=()=>{ const on=always||$(catId).value==='기타'; $(reqId).classList.toggle('on',on); $(memoId).classList.toggle('need',on&&!$(memoId).value.trim()); };
  $(catId).addEventListener('change',u); $(memoId).addEventListener('input',u); u();
  if(btn) btn.addEventListener('click',e=>{ if((always||$(catId).value==='기타')&&!$(memoId).value.trim()){ e.stopImmediatePropagation(); toast(always?'메모를 입력해야 합니다':'기타를 고르면 메모를 입력해야 합니다'); $(memoId).focus(); } },true);
}

/* 청구월 선택지 — 항상 표시. 미결제 청구월 = 정기 결제 내역에서 실패만 있고 성공(정기 · 수기)이 없는 달 */
// 선택지 = 과금시작월(2024-06) ~ 이번 달 전체, 미결제 청구월은 맨 위 묶음
const BILL_START='2024-06';
const BM=(()=>{ const a=[]; let m=BILL_START; while(m<=NOW){ a.unshift(m); m=nextM(m); } return a; })();
const unpaid=()=>BM.filter(m=>HIST.some(h=>h[2]===m&&h[3]==='fail')&&!HIST.some(h=>h[2]===m&&h[3]==='ok')).sort();
const bmDefault=()=>NOW;   // 기본값 = 이번 달. 지난 미결제 달은 목록 위쪽에서 고름
const bmOpts=()=>{ const u=unpaid(), o=m=>`<option value="${m}" ${m===bmDefault()?'selected':''}>${m}${u.includes(m)?' (미결제)':''}</option>`;
  // 선택지 = 이번 달(기본) + 아직 메우지 못한 미결제 청구월만 — 이번 달에 청구되는 결제라 전체 기간은 두지 않음(11-25)
  return o(NOW)+(u.length?`<optgroup label="미결제 청구월">${u.filter(m=>m!==NOW).map(o).join('')}</optgroup>`:''); };
const bmHint=()=>`기본값은 이번 달(${NOW})`+(unpaid().length?` · 미결제 ${unpaid().join(' · ')}은 목록에서 고름`:'')+' · 두 달 치는 달마다 한 건씩 결제';

/* ③ 수기 결제 창 */
function manualModal(){
  return `<div class="dim"></div><div class="mdl" id="mpMdl"><div class="mh"><h3>수기 결제</h3><button class="x" data-close>×</button></div>
  <div class="mb">
    <div class="fr"><span class="fl">결제 카드</span><div class="ro">${PH.card}</div></div>
    <div class="fr" id="mpBmRow"><span class="fl">청구월</span><div><select class="fi" id="mpBm">${bmOpts()}</select></div></div>
    <div class="fr" id="mpLinkRow"><span class="fl">결제 실패 월</span><div class="ro" id="mpLink"></div></div>
    <div class="fr" id="mpCatRow"><span class="fl">결제 사유</span><div><select class="fi" id="mpCat">${opt(PAY_CAT,'재시도 결제')}</select></div></div>
    <div class="fr" id="mpAmtRow"><span class="fl">금액</span><div><input class="fi" id="mpAmt" value="71,500"></div></div>
    <div class="fr" id="mpMemoRow"><span class="fl">메모<span class="req" id="mpReq">*</span></span><div><input class="fi" id="mpMemo" value="카드 변경 후 결제" placeholder="기타 사유를 입력하세요"></div></div>
    <div class="fr" id="mpWhoRow"><span class="fl">등록자</span><div class="ro">김운영 <span class="hint">(로그인한 관리자 · 자동 기록)</span></div></div>
  </div>
  <div class="mf"><button class="btn" data-close>취소</button><button class="btn pri" data-toast="시안 — 실제 결제는 진행되지 않습니다">결제</button></div></div>`;
}

function bindAll(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>go('sub'));
  document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));
  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{ S.cid=+b.dataset.cancel; go('cancel'); });
  document.querySelectorAll('[data-bank]').forEach(b=>b.onclick=()=>{ S.cid=+b.dataset.bank; go('bank'); });
  document.querySelectorAll('[data-payback]').forEach(b=>b.onclick=()=>{ S.cid=+b.dataset.payback; go('payback'); });
  if($('pbGo')) $('pbGo').onclick=()=>{ const h=HIST.find(x=>x[0]===S.cid); if(h) h[9]=$('pbDate').value.slice(5).replace('-','-')+' · 김운영'; go('sub'); };
  const r=$('svcRow'); if(r){ r.style.cursor='pointer'; r.onclick=()=>go('svc'); }
  document.querySelectorAll('.stSel').forEach(x=>x.onchange=()=>{ x.parentNode.querySelector('.demoPer').style.display=x.value==='데모'?'':'none'; });
  if($('schEdit')) $('schEdit').onclick=()=>{ S.sedit=1; render(); };
  if($('schCancel')) $('schCancel').onclick=()=>{ S.sedit=0; render(); };
  if($('dCat')){ const u=()=>{ const a=+String($('dAmt').value).replace(/\D/g,'')||0; $('dTot').textContent=fmt(55000-a)+'원'; };
    ['dCat','dMemo','dAmt'].forEach(id=>{ $(id).oninput=u; $(id).onchange=u; }); u(); }
  if($('cxCat')){ const h=view().find(x=>x[0]===S.cid)||HIST[0], max=h[4]-h[5];
    const u=()=>{ $('cxHint').textContent=hintOf(CANCEL_CAT,$('cxCat').value); };
    $('cxCat').onchange=u; u(); $('cxGo').onclick=()=>toast(S.page==='bank'?'시안 — 수기 취소 처리는 저장되지 않습니다':'시안 — 페이앱 취소 요청은 진행되지 않습니다'); }
  if($('mpCat')){ const u=()=>{ const c=$('mpCat').value, m=$('mpMemo').value.trim(), bm=$('mpBm').value,
        f=HIST.filter(h=>h[2]===bm&&h[3]==='fail'&&!paidBy(h)).pop();
      $('mpLink').innerHTML=f?`<b>${f[1].slice(0,10)} · ${fmt(f[4])}원 · ${esc(f[6])}</b>`
        :'<span class="hint">이 청구월은 미결제 건 없음 — 새 결제로 저장</span>';
      if(f && e0!==bm){ $('mpAmt').value=fmt(f[4]); e0=bm; }
      if($('mpHint')) $('mpHint').textContent=hintOf(PAY_CAT,c); };
    let e0=null; ['mpCat','mpBm','mpMemo'].forEach(id=>{ $(id).oninput=u; $(id).onchange=u; }); u(); }
}
function render(){ renderBase(); }
function renderBase(){
  side();
  document.querySelectorAll('.demo button').forEach(b=>b.classList.toggle('on',b.dataset.go===S.page));
  const base = svcList()+subPanel();
  const mdl = S.page==='svc'?svcModal():S.page==='payback'?paybackModal():S.page==='cancel'||S.page==='bank'?cancelModal():S.page==='manual'?manualModal():'';
  $('content').innerHTML = base + mdl;
  bindAll();
  if($('dCat')) memoReq('dCat','dMemo','dReq',document.querySelector('#svcMdl .btn.pri'));
  if($('cxCat')) memoReq('cxCat','cxMemo','cxReq',$('cxGo'),S.page==='bank');   // 수기 취소 처리는 메모 항상 필수
  if($('mpCat')) memoReq('mpCat','mpMemo','mpReq',document.querySelector('#mpMdl .btn.pri'));
}
function go(p){ if(p!=='svc') S.sedit=0; S.page=p; if(p==='cancel'&&!S.cid) S.cid=6; render(); }
S.cid=6;
const P0=new URLSearchParams(location.search).get('p'); if(['svc','sub','cancel','bank','manual','payback'].includes(P0)) S.page=P0;
render();
</script>
</body>
</html>
