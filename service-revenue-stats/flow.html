<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 · 등록 흐름도</title>
<!-- 결제 · 등록 흐름도 (11-26 개편): 업무 선택 → 그 업무 흐름도 하나. 흐름도는 라이브러리 없이 박스 + 화살표, 위 → 아래, 갈라질 때만 옆으로(조건은 갈래 맨 위).
     업무마다 시작 화면 / 운영자가 할 일 / 결과 확인 화면 → 흐름도 → 참고(날짜 · 예외 정책) → 관련 화면(스토리보드 링크). 주소 #svc 등으로 업무 바로 열기 -->
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--sub:#5b6474;--mute:#8a93a3;--line:#d9dde4;--teal:#159b8d;
 --reg:#2a78d6;--regb:#eaf2fc;--pay:#e0701f;--payb:#fdf1e7;--stat:#1b9a6c;--statb:#e7f6f0;--warn:#c43d3d;--warnb:#fdecec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 16px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 16px}
.tabs a{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700;font-size:13.5px}
.tabs a small{display:block;font-weight:500;color:var(--mute);font-size:11.5px;margin-top:2px}
.tabs a.on{border-color:var(--teal);background:#effaf8;color:#0f6f65}
.tabs a .rv{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--teal);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0;overflow:hidden}
.panel h2{font-size:17px;margin:0 0 4px}
.ds{color:var(--sub);margin:0 0 14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 16px}
.sum div{border-radius:8px;padding:10px 12px;font-size:12.5px}
.sum b{display:block;font-size:11.5px;margin-bottom:3px}
.sum .s1{background:var(--regb)}.sum .s1 b{color:#1b5fae}
.sum .s2{background:var(--payb)}.sum .s2 b{color:#b5560f}
.sum .s3{background:var(--statb)}.sum .s3 b{color:#137652}
.sum a,.rel a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--mute)}
.chart{display:flex;justify-content:center;max-width:100%;min-width:0;padding:8px 0 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.flowv{width:100%;max-width:820px;margin:0 auto;padding:14px 0;display:flex;flex-direction:column;align-items:center}
.bx{width:220px;max-width:100%;text-align:center;font-weight:700;font-size:13.5px;border:1.5px solid;border-radius:8px;padding:10px 8px;background:#fff}
.bx.r{border-color:#2a78d6;background:#eaf2fc;color:#1b4f8f}.bx.p{border-color:#e0701f;background:#fdf1e7;color:#8f4410}.bx.s{border-color:#1b9a6c;background:#e7f6f0;color:#0f5e42}.bx.w{border-color:#c43d3d;background:#fdecec;color:#9a2b2b}
.dn{color:#8a93a3;font-size:18px;line-height:1;margin:5px 0}.dn.sm{font-size:14px;margin:3px 0}
.brs{display:grid;gap:12px;width:100%;border-top:2px solid #c9ced6;padding-top:10px}
.lane{display:flex;flex-direction:column;align-items:center;min-width:0}
.lane .bx{width:100%;max-width:200px}
.cond{font-size:12px;font-weight:700;border-radius:12px;padding:2px 10px;background:#eef0f3;color:#4b5563;text-align:center}
.cond.ok{background:#e7f6f0;color:#137652}.cond.no{background:#fdecec;color:#c43d3d}
.lane .brs{border-top-style:dashed}
.imw{overflow-x:auto}.im{width:100%;border-collapse:collapse;font-size:12.5px}.im th{background:#f7f8fa;color:#5b6474;text-align:left;font-weight:700;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.im td{padding:8px 10px;border-bottom:1px solid #eef0f2;vertical-align:top;color:var(--ink)}.im td b{font-size:12.5px}.im .ids{font-size:11px;margin-top:2px}.im .ids a{color:#0f6f65}.im td.same{color:#8a93a3}
.shotrow td{border-bottom:1px solid #eef0f2;padding-top:0}.im tr:has(+.shotrow) td{border-bottom:0}.shot{margin:0 0 10px}.shot figcaption{font-size:11.5px;font-weight:700;color:#5b6474;margin:0 0 4px}.shot a{display:inline-block;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}.shot a:hover{border-color:var(--teal)}.shot img{display:block;max-width:100%;height:auto}
.im td:first-child{width:190px}
@media (max-width:720px){.brs{grid-template-columns:1fr!important}.lane{border-left:3px solid #e3e6ea;padding-left:10px;align-items:stretch}.lane .bx{max-width:none}.cond{align-self:flex-start}.lane .dn{align-self:center}}
.lgd{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--sub);margin:0 0 6px}
.lgd i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
h3{font-size:13px;margin:14px 0 6px}
.notes{margin:0;padding-left:18px;color:var(--sub)}
.notes li{margin:3px 0}.notes b{color:var(--ink)}
.case{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.case div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--sub)}
.case div b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px;margin:0;padding:0;list-style:none}
.rel li{font-size:12.5px}.rel code{font:600 12px ui-monospace,Menlo,monospace;color:#0f6f65;margin-right:6px}
.direct{font-size:12px;color:var(--sub);margin:-8px 0 14px}.direct a{color:var(--teal);font-weight:700}
@media (max-width:720px){.panel{padding:14px}.tabs{grid-template-columns:1fr 1fr}.sum,.case{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>결제 · 등록 흐름도</h1>
<p class="lead">내 업무를 고르면 어디서 시작하고, 어떤 조건에서 갈라지고, 어디서 결과를 확인하는지 보여 줘요. 화면 번호를 누르면 스토리보드의 해당 화면이 열려요.</p>
<nav class="tabs" id="tabs"></nav>
<p class="direct">이번 리뷰 대상 바로가기 : <a href="#svc">③ 서비스 등록 · 수정</a></p>
<section class="panel" id="flow"></section>
</div>

// 흐름도 — 라이브러리 없이 박스 + 화살표. 위 → 아래, 갈라질 때만 옆으로 나란히(조건은 갈래 맨 위 글자)
function box(b){ return '<div class="bx '+b[0]+'">'+b[1]+'</div>'; }
function col(list){ return list.map(function(b,i){ return (i?'<div class="dn">↓</div>':'')+(b.br?branch(b):box(b)); }).join(''); }
function branch(b){ return '<div class="brs" style="grid-template-columns:repeat('+b.br.length+',minmax(0,1fr))">'+b.br.map(function(x){ return '<div class="lane"><div class="cond '+x[1]+'">'+x[0]+'</div><div class="dn sm">↓</div>'+col(x[2])+'</div>'; }).join('')+'</div>'; }
function show(k){
 var w=W.filter(function(x){return x.k===k;})[0]||W[2];
 document.getElementById('tabs').innerHTML=W.map(function(x){ return '<a href="#'+x.k+'" class="'+(x.k===w.k?'on':'')+'">'+x.t+(x.rv?'<span class="rv">리뷰</span>':'')+'<small>'+x.s+'</small></a>'; }).join('');
 var el=document.getElementById('flow');
 el.innerHTML='<h2>'+w.t+'</h2><p class="ds">'+w.ds+'</p>'+
  '<div class="sum"><div class="s1"><b>시작 화면</b>'+w.a[0]+' · '+lk(w.a[1])+'</div><div class="s2"><b>운영자가 할 일</b>'+w.b+'</div><div class="s3"><b>결과 확인 화면</b>'+w.c[0]+' · '+lk(w.c[1])+'</div></div>'+
  '<div class="lgd"><span><i style="background:#eaf2fc;border:1px solid #2a78d6"></i>등록 · 입력</span><span><i style="background:#fdf1e7;border:1px solid #e0701f"></i>결제 · 정산</span><span><i style="background:#e7f6f0;border:1px solid #1b9a6c"></i>확인</span><span><i style="background:#fdecec;border:1px solid #c43d3d"></i>조치 필요</span></div>'+
  '<div class="chart" id="chart"><div class="flowv">'+col(w.f)+'</div></div>'+
  (w.cs?'<h3>두 갈래 예시 — 이렇게 저장하면</h3><div class="case">'+w.cs.map(function(c){return '<div><b>'+c[0]+'</b>'+c[1]+'</div>';}).join('')+'</div>':'')+
  (w.im?'<h3>바뀌는 화면 <span style="font-weight:500;color:#8a93a3;font-size:12px">— 예시 화면을 누르면 크게 보여요</span></h3><div class="imw"><table class="im"><thead><tr><th>화면</th>'+w.im.c.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>'+w.im.r.map(function(r,ri){ return '<tr><td><b>'+r[1]+'</b><div class="ids">'+r[0].split(' · ').map(lk).join(' · ')+'</div></td>'+r.slice(2).map(function(x,ci){ return '<td'+(x.indexOf('그대로')===0?' class="same"':'')+'>'+x+'</td>'; }).join('')+'</tr>'+(function(){ var f=r.slice(2).map(function(x,ci){ return shot(w.k+'|'+ri+'|'+ci, w.im.c.length>1?w.im.c[ci]:''); }).join(''); return f?'<tr class="shotrow"><td></td><td colspan="'+w.im.c.length+'">'+f+'</td></tr>':''; })(); }).join('')+'</tbody></table></div>':'')+
  '<h3>참고</h3><ul class="notes">'+w.n.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'+
  '<h3>관련 화면</h3><ul class="rel">'+w.r.map(function(x){return '<li><code>'+lk(x[0])+'</code>'+x[1]+'</li>';}).join('')+'</ul>';
}
