<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 · 등록 흐름도</title>
<!-- 결제 · 등록 흐름도: 슈퍼어드민 메뉴(약국관리 · 통계) 기준. 화면 번호를 누르면 스토리보드 해당 화면으로 이동 -->
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--sub:#5b6474;--mute:#8a93a3;--line:#d9dde4;
 --reg:#2a78d6;--regb:#eaf2fc;--pay:#e0701f;--payb:#fdf1e7;--stat:#1b9a6c;--statb:#e7f6f0;--warn:#c43d3d;--warnb:#fdecec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 18px}
.lg{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 14px;color:var(--sub);font-size:12px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 18px}
.panel h2{font-size:15px;margin:0 0 4px}
.panel .ds{color:var(--sub);margin:0 0 14px;font-size:12px}
.scroll{overflow-x:auto}
/* 전체 흐름 */
#ov{position:relative;display:grid;grid-template-columns:repeat(3,300px);column-gap:110px;min-width:1120px;padding:6px 4px}
#ov svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.col{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.ch{font-weight:700;font-size:13px;padding:6px 10px;border-radius:6px;text-align:center}
.n{border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff}
.n b{display:block;font-size:13px}
.n .m{font-size:11px;color:var(--mute);margin:1px 0 3px}
.n .t{font-size:12px;color:var(--sub)}
.n a{font-size:11px;color:var(--sub);text-decoration:none;border-bottom:1px dotted var(--mute)}
.n a:hover{color:var(--ink)}
.reg{border-color:var(--reg)} .reg b{color:#1b5fae}
.pay{border-color:var(--pay)} .pay b{color:#b5560f}
.stat{border-color:var(--stat)} .stat b{color:#137652}
.ch.reg{background:var(--regb);color:#1b5fae} .ch.pay{background:var(--payb);color:#b5560f} .ch.stat{background:var(--statb);color:#137652}
.el{font-size:11px;fill:var(--sub)}
/* 상세 흐름 */
.fl{display:flex;align-items:flex-start;flex-wrap:nowrap;gap:0;min-width:max-content;padding:4px 2px}
.st{width:160px;flex:none}
.ar{flex:none;width:26px;align-self:flex-start;margin-top:26px;text-align:center;color:var(--mute);font-size:16px}
.br{display:flex;flex-direction:column;gap:10px;flex:none}
.bw{display:flex;align-items:flex-start}
.bl{flex:none;font-size:11px;font-weight:600;color:var(--sub);background:#eef0f3;border-radius:10px;padding:2px 8px;margin:28px 6px 0 0;white-space:nowrap}
.bl.no{background:var(--warnb);color:var(--warn)}
.bl.ok{background:var(--statb);color:#137652}
.back{margin-top:10px;font-size:12px;color:var(--sub);border-top:1px dashed var(--line);padding-top:8px}
.back b{color:var(--ink)}
.tag{display:inline-block;font-size:10px;font-weight:600;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.tag.ask{background:#fff4d6;color:#8a6200}
</style>
</head>
<body>
<div class="wrap">
<h1>결제 · 등록 흐름도</h1>
<p class="lead">슈퍼어드민 메뉴 기준으로, 운영자가 등록한 내용이 결제 · 정산을 거쳐 확인 화면까지 어떻게 이어지는지 정리했어요. 화면 번호를 누르면 스토리보드의 해당 화면이 열려요.</p>
<div class="lg">
 <span><i style="background:var(--reg)"></i>등록 · 업로드 (운영자가 입력)</span>
 <span><i style="background:var(--pay)"></i>결제 · 정산 (돈이 오가는 단계)</span>
 <span><i style="background:var(--stat)"></i>확인 화면</span>
 <span><svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="#8a93a3" stroke-width="1.5" stroke-dasharray="4 3"/></svg>조치하러 돌아가는 길</span>
</div>

<section class="panel">
 <h2>전체 흐름</h2>
 <p class="ds">왼쪽에서 입력한 내용이 가운데에서 결제 · 정산되고, 오른쪽 확인 화면에 모여요.</p>
 <div class="scroll"><div id="ov"></div></div>
</section>

<div id="detail"></div>
</div>

<script>
var SB='storyboard.html#';
function L(t){ return t.replace(/SA-\d\d-\d\d\d/g,function(m){ return '<a href="'+SB+m+'" target="_blank">'+m+'</a>'; }); }

/* 전체 흐름 노드: [id, 종류, 제목, 메뉴, 설명, 화면] */
var COLS=[
 ['reg','① 등록 · 업로드',[

  ['r3','reg','VAN 정산 파일 업로드','약국관리 › VAN 정산 관리 · 매월','TID별 정산 단가 · 승인 건수 · 정산액','SA-02-003'],
  ['r4','reg','광동 약정 약국 목록 업로드','통계 › 광동 VIP 정산 · 매월','광동이 보낸 약정 약국 목록(엑셀)','SA-03-002']
 ]],

  ['s2','stat','약국 결제 관리','약국관리 › 약국 결제 관리','미결제 약국을 기간 1개월 · 조회 실패로 열어 조치','SA-01-002'],

ov.innerHTML='<svg id="ovs"></svg>'+COLS.map(function(c){

 }).join('')+'</div>';
}).join('');

function draw(){
 var s=document.getElementById('ovs'), o=ov.getBoundingClientRect(), h='';
 h+='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a93a3"/></marker></defs>';
 var labels=[];
 EDGES.forEach(function(e){
  var a=document.getElementById(e[0]).getBoundingClientRect(), b=document.getElementById(e[1]).getBoundingClientRect();
  var ax,ay,bx,by,c1x,c1y,c2x,c2y;
  var sameCol=Math.abs(a.left-b.left)<10;
  if(sameCol){
   // 같은 열: 위 → 아래는 아래쪽 가운데에서, 점선(되돌아감)은 오른쪽 바깥으로 돌아감
   if(e[3]){ ax=a.right-o.left; ay=a.top+a.height/2-o.top; bx=b.right-o.left; by=b.top+b.height/2-o.top; c1x=ax+46;c1y=ay;c2x=bx+46;c2y=by; }
   else { ax=a.left+a.width/2-o.left; ay=a.bottom-o.top; bx=b.left+b.width/2-o.left; by=b.top-o.top; c1x=ax;c1y=ay+8;c2x=bx;c2y=by-8; }
  } else if(a.left<b.left){
   ax=a.right-o.left; ay=a.top+a.height/2-o.top; bx=b.left-o.left; by=b.top+b.height/2-o.top;
   var d=(bx-ax)*0.5; c1x=ax+d;c1y=ay;c2x=bx-d;c2y=by;
  } else {
   ax=a.left-o.left; ay=a.top+a.height/2-o.top; bx=b.right-o.left; by=b.top+b.height/2-o.top;
   var d2=(ax-bx)*0.5; c1x=ax-d2;c1y=ay;c2x=bx+d2;c2y=by;
  }
  var col=e[3]?'#8a93a3':'#a9b0bc';
  h+='<path d="M'+ax+' '+ay+' C'+c1x+' '+c1y+' '+c2x+' '+c2y+' '+bx+' '+by+'" fill="none" stroke="'+col+'" stroke-width="1.5" '+(e[3]?'stroke-dasharray="4 3"':'')+' marker-end="url(#ah)"/>';
  if(e[2]){
   var t=0.5, mx=Math.pow(1-t,3)*ax+3*Math.pow(1-t,2)*t*c1x+3*(1-t)*t*t*c2x+t*t*t*bx, my=Math.pow(1-t,3)*ay+3*Math.pow(1-t,2)*t*c1y+3*(1-t)*t*t*c2y+t*t*t*by;
   labels.push([mx,my,e[2]]);
  }
 });
 // 글자끼리 겹치면 아래로 밀기
 labels.sort(function(p,q){return p[1]-q[1];});
 labels.forEach(function(l,i){ for(var j=0;j<i;j++){ var k=labels[j]; if(Math.abs(k[0]-l[0])<80 && Math.abs(k[1]-l[1])<16) l[1]=k[1]+16; } });

 });

window.addEventListener('resize',draw); window.addEventListener('load',draw); draw();

var D=[
 {t:'1. 정기 결제 → 미결제 → 수기 결제',d:'매달 5일 정기 결제가 실패하면 미결제로 남고, 운영자가 수기 결제로 그 청구월분을 받아요. 같은 청구월의 결제는 한 묶음으로 보여요.',f:[

  ['pay','청구월 결제 예정 금액','약국 × 청구월','옵션 총액 − 금액 할인',''],
  ['pay','5일 정기 결제','페이앱 카드','',''],
  {br:[
   ['성공','ok',['stat','결제 완료','서비스 청구 통계','결제 완료 탭에 그 청구월분으로 집계','SA-01-001']],
   ['실패','no',['stat','미결제 탭','서비스 청구 통계','오래 밀린 순','SA-01-109'],
                ['stat','약국 결제 관리','[약국 결제 관리 ›]','기간 1개월 · 조회 실패로 열림','SA-01-002'],
                ['pay','수기 결제','약국 상세 › 정기 결제','청구월 · 결제 사유 저장','SA-01-006'],
                ['stat','결제 완료로 바뀜','약국 상세 · 통계','정기 실패 └ 수기 성공을 같은 청구월 결제 이력으로 묶음','SA-01-004']]
  ]}
 ],back:'<b>반영</b> : 수기 결제로 받은 금액은 저장한 청구월의 결제 완료로 들어가고, 미결제 탭에서 빠져요.'},
 {t:'2. 결제 취소 · 환불',d:'정기 결제 내역에서 전액 취소하고, 정산 시점에 따라 처리 방법이 나뉘어요. 다시 받을 금액이 있으면 수기 결제로 이어져요.',f:[
  ['pay','정기 결제 내역','약국 상세 › 정기 결제','[결제 취소]','SA-01-004'],
  ['pay','결제 취소 창','전액 취소','취소 사유 선택','SA-01-005'],
  {br:[
   ['정산 전','ok',['pay','바로 취소 완료','','카드 승인 취소','SA-01-141']],
   ['정산 후','',['pay','취소 요청 중','','반환금 안내','SA-01-142'],['reg','반환금 입금 기록','','입금일 · 금액 저장','SA-01-146'],['pay','카드 취소 대기','','','SA-01-147']],

  ['stat','약국별 청구','서비스 청구 통계','계산 내역 창에서 옵션 · 할인 확인','SA-01-106'],
  {br:[
   ['같음','ok',['stat','정상 청구','','','']],
