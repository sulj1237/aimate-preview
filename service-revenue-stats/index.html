<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>슈퍼어드민 · 서비스 청구 통계</title>
<style>
  :root{
    --teal:#1fb6a6; --teal-d:#159b8d; --teal-soft:#e6f7f4;
    --ink:#2b2f33; --muted:#8a9099; --line:#e3e6ea; --bg:#f4f5f7;
    --side:#33383d; --side-line:#454b52;
    --up:#d6453d; --down:#2f6fd6; --warn:#e8a317; --warn-soft:#fff6e0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    color:var(--ink);background:var(--bg);font-size:13px;line-height:1.5}
  button{font-family:inherit}
  .wrap{display:flex;min-height:100vh}

  /* 사이드바 (맥락용) */
  .side{width:188px;flex:none;background:var(--side);color:#cdd2d7}
  .side-logo{display:flex;align-items:center;gap:7px;padding:16px;border-bottom:1px solid var(--side-line)}
  .side-mark{width:18px;height:18px;border-radius:7px 7px 7px 2px;background:var(--teal);transform:rotate(8deg);position:relative}
  .side-mark::after{content:"";position:absolute;left:-4px;bottom:-3px;width:8px;height:8px;border-radius:50%;background:#f4de3f}
  .side-word{font-size:16px;font-weight:800;color:#fff}
  .side-grp{font-size:10.5px;color:#8e959c;padding:14px 16px 6px;letter-spacing:.02em}
  .side-item{padding:8px 16px 8px 26px;font-size:12px;color:#aeb4ba}
  .side-item.on{background:var(--teal);color:#fff;font-weight:700}
  .side-item .new{font-size:9.5px;background:#f4de3f;color:#33383d;border-radius:3px;padding:0 4px;margin-left:4px;font-weight:800}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:12px}
  .crumb{font-size:12px;color:var(--muted)}
  .crumb b{color:var(--ink)}
  .crumb a{color:var(--muted);cursor:pointer;text-decoration:none}
  .crumb a:hover{color:var(--teal-d)}
  .tbr{margin-left:auto;display:flex;align-items:center;gap:8px}
  .demo{display:flex;align-items:center;gap:6px;border:1px dashed #c7cbd0;border-radius:6px;padding:4px 8px;font-size:11.5px;color:var(--muted)}
  .demo button{height:24px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:11.5px;padding:0 8px;cursor:pointer;color:#4b5158}
  .demo button.on{background:#4b5158;border-color:#4b5158;color:#fff}
  .content{padding:18px;display:flex;flex-direction:column;gap:14px;max-width:1240px}

  .panel{background:#fff;border:1px solid var(--line);border-radius:8px}
  .ph{display:flex;align-items:center;gap:10px;padding:14px 18px 0}
  .ph h3{margin:0;font-size:14px}
  .ph .sub{font-size:11.5px;color:var(--muted)}
  .ph .right{margin-left:auto;display:flex;gap:6px;align-items:center}

  /* 조회 조건 */
  .filter{padding:14px 18px;display:flex;flex-direction:column;gap:8px}
  .frow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .fitem{display:flex;align-items:center;gap:8px}
  .flabel{font-weight:700;color:#4b5158;font-size:12.5px}
  .sel{height:32px;border:1px solid var(--line);border-radius:6px;padding:0 26px 0 10px;font-size:12.5px;color:var(--ink);background:#fff;outline:none;appearance:none;-webkit-appearance:none;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,#9aa0a6 50%),linear-gradient(135deg,#9aa0a6 50%,transparent 50%);
    background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .sel:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,182,166,.15)}
  .btn{height:32px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;color:#4b5158;cursor:pointer}
  .btn:hover{border-color:#c9cdd2}
  .btn.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
  .btn.sm{height:26px;padding:0 10px;font-size:11.5px}
  .info{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .info .i{display:inline-flex;width:14px;height:14px;border-radius:50%;border:1px solid #b9bec4;font-size:9px;align-items:center;justify-content:center;color:#8a9099;font-weight:700}
  .badge{font-size:10.5px;border-radius:4px;padding:0 6px;font-weight:700}
  .badge.tmp{background:#eef0f3;color:#6b7178}

  /* 요약 대시보드 */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .dhd{font-size:14px;font-weight:800;margin:0 0 -4px 2px}
  .kunp{position:relative;cursor:pointer}.kunp:hover{border-color:#0AB4AD}
  .kunp .go{color:var(--teal-d);font-weight:700;margin-left:6px}

  /* 약국 결제 관리 (이동 화면 — 실제 슈퍼어드민 화면 구성) */
  .pay-h{margin:4px 0 0;font-size:19px}
  .pay-f{padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px}
  .pay-f .frow{gap:8px;flex-wrap:nowrap;white-space:nowrap}
  .pay-f .flabel{width:56px;font-weight:600}
  .pay-f .gap{width:12px}
  .din{height:32px;border:1px solid var(--line);border-radius:4px;padding:0 10px;font-size:12px;display:inline-flex;align-items:center;min-width:96px;background:#fff}
  .qbtn{height:32px;min-width:42px;padding:0 8px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:12px;color:#4b5158;cursor:pointer}
  .qbtn.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
  .rad{display:inline-flex;align-items:center;gap:4px;font-size:12px;margin-right:8px}
  .rad i{width:13px;height:13px;border:1px solid #c3c8cd;border-radius:50%;display:inline-block;position:relative}
  .rad.on i{border-color:var(--teal)} .rad.on i::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--teal)}
  .chk{width:13px;height:13px;border:1px solid #c3c8cd;border-radius:2px;display:inline-block}
  .pay-f .acts{display:flex;justify-content:center;gap:16px;border-top:1px solid var(--line);padding-top:14px}
  .pay-f .acts .btn{width:112px}
  .pay-top{display:flex;align-items:center;gap:8px}
  .pay-top .cnt{color:var(--teal-d)}
  .pay-top .r{margin-left:auto;display:flex;gap:6px}
  .tbl.pay th,.tbl.pay td{text-align:center}
  .tbl.pay .fail{color:var(--up);font-weight:700}
  .apv{height:26px;padding:0 12px;border:0;border-radius:4px;background:#eef0f2;color:#b5bbc1;font-size:11.5px}
  .back{color:var(--teal-d);cursor:pointer;font-weight:700;margin-left:10px}
  .kpi{padding:16px 18px}
  .kpi .k{font-size:12px;color:var(--muted);font-weight:700}
  .kpi .v{font-size:24px;font-weight:800;margin:4px 0 2px;letter-spacing:-.01em}
  .kpi .v small{font-size:13px;font-weight:700;margin-left:2px}
  .kpi .d{font-size:12px}
  .kpi .def{font-size:11px;color:var(--muted);margin-top:6px}
  .tagf,.tagp{display:inline-block;font-size:10px;font-weight:700;border-radius:3px;padding:0 4px;margin-left:4px;line-height:16px;vertical-align:1px}
  .tagf{background:#eef0f2;color:#5b6168} .tagp{background:var(--warn-soft);color:#a86f00}
  .pend{font-size:11.5px;color:#a86f00}
  .mnote{background:var(--warn-soft);border:1px solid #f1dca6;border-radius:8px;padding:10px 14px;font-size:12px;color:#6b5414;display:flex;flex-direction:column;gap:4px}
  .mnote .per{color:#8a7432;font-size:11.5px}
  .tbl td.memo{font-size:10.5px;font-weight:600;line-height:1.5;color:#c2570c;white-space:normal;min-width:190px;max-width:250px;letter-spacing:-.2px;vertical-align:top}
  .tbl td.memo .dx{color:#5b4bb7}.tbl td.memo .mt{color:#1f2328}.tbl td.memo .pmb{display:inline-block;padding:0 4px;margin:2px 4px 1px 0;border-radius:3px;background:#eef0f3;color:#6b7178}.tbl td.memo .pmb.pmc{background:#e6f6f3;color:#0f8a74}
  .tbl tr.ph-row td.memo{font-weight:600}
  .pnote{font-size:11.5px;color:var(--muted);margin:-4px 0 6px;padding-left:2px}
  .kpinote{font-size:11.5px;color:var(--muted);margin-top:-6px;padding-left:2px}
  .upc{color:var(--up)} .downc{color:var(--down)} .flat{color:var(--muted)}

  /* 표 */
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{background:#f8f9fa;color:#5b6168;font-weight:700;font-size:12px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:9px 12px;border-bottom:1px solid #eff1f3;white-space:nowrap}
  .tbl .num{text-align:right;font-variant-numeric:tabular-nums}
  .tbl tbody tr.click{cursor:pointer}
  .tbl tbody tr.click:hover{background:#f6fbfa}
  .tbl tr.total td{background:#f8f9fa;font-weight:800;border-top:1px solid var(--line)}
  .tbl .svc{font-weight:700}
  .tbl .svc .go{color:#b9bec4;margin-left:4px;font-weight:400}
  .share{display:flex;align-items:center;gap:8px}
  .share .bar{height:8px;background:var(--teal);border-radius:2px}
  .share .pct{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .tbl.svct td,.tbl.svct th{padding-left:10px;padding-right:10px}.tbl.svct .share{width:120px}
  .dc .db{display:inline-block;padding:0 5px;margin-bottom:1px;border-radius:3px;background:#fdeee3;color:#b4480a;font-weight:700}
  .dq{font-size:10.5px;font-weight:600;color:#c2570c;white-space:nowrap;margin-top:3px}
  .dc.dx{color:#5b4bb7}.dc .xb{display:inline-block;padding:0 4px;margin-right:4px;border-radius:3px;background:#ece9fb;color:#4c3aa8;font-weight:700}
  .dc{font-size:10.5px;letter-spacing:-.2px;font-weight:600;color:#c2570c;margin:3px 0 0 auto;white-space:nowrap;line-height:1.45;text-align:right}
  .why{font-size:11px;color:var(--muted);margin-top:1px}
  .tbl tr.ph-row td{background:#fafbfc;font-weight:700;border-top:1px solid var(--line)}
  .tbl tr.sv-row td:first-child{padding-left:26px;color:var(--muted)}
  .tbl tr.ph-row{cursor:pointer}.tbl tr.ph-row:hover td{background:#F1F3F5}
  .tbl tr.ph-row.one{cursor:default}.tbl tr.ph-row.one:hover td{background:#fafbfc}
  .tbl tr.ph-row .tg{display:inline-block;width:14px;color:var(--muted);font-size:10px}
  .tbl tr.ph-row td.svcn{font-weight:500;color:var(--muted);max-width:280px;overflow:hidden;text-overflow:ellipsis}
  .pctl{margin-left:auto;display:flex;gap:6px;align-items:center}
  .sel.sm{height:28px;font-size:12px}
  .sel.sm.on{border-color:var(--teal);color:var(--teal-d);font-weight:700}
  .qty{color:var(--muted);font-weight:600;font-size:11.5px;margin-left:4px}
  .foot{font-size:11.5px;color:var(--muted);padding:10px 18px 14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .tblwrap{padding:10px 0 0;overflow-x:auto}

  .tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:4px;border-radius:50%;border:1px solid #b9bec4;color:#7b8188;font-size:9.5px;font-weight:700;cursor:help;vertical-align:1px}
  .tip:hover::after{content:attr(data-tip);position:absolute;right:0;bottom:20px;z-index:30;width:250px;white-space:normal;text-align:left;background:#2b2f33;color:#fff;font-size:11.5px;font-weight:400;line-height:1.5;padding:8px 10px;border-radius:6px}
  /* 표 머리글 도움말 — 표 영역(가로 스크롤) 위로 나가면 잘려서 아래로 표시 */
  .tbl th .tip:hover::after{bottom:auto;top:20px;font-weight:400;color:#fff}
  .empty{padding:36px 18px;text-align:center;color:var(--muted);font-size:12.5px}

  /* 상세 */
  .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:12px 18px 0}
  .psum{display:flex;gap:18px;align-items:center;padding:12px 18px 2px;font-size:12.5px;color:#5E646C}
  .pcf{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 10px;border-radius:12px;background:#E7FBFA;color:#08837E;font-weight:700}
  .pcf button{border:0;background:none;color:#08837E;font-size:14px;cursor:pointer;padding:0 4px}
  .brow{display:flex;align-items:stretch;gap:8px;padding:14px 18px 16px}
  .bcell{flex:1;min-width:0;text-align:left;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 12px;font:inherit}
  button.bcell{cursor:pointer}button.bcell:hover{border-color:#0AB4AD}
  .bcell.on{border:2px solid #0AB4AD;padding:9px 11px;background:#F2FBFA}
  .bcell.end{background:#F7F9FA}
  .bk{font-size:11.5px;color:var(--muted);font-weight:600}
  .bv{font-size:16px;font-weight:800;color:#212529;margin-top:4px}
  .bs{font-size:11.5px;color:#5E646C;margin-top:2px}
  .bar2{align-self:center;color:var(--muted);font-weight:700}
  .psum b{font-size:14px;font-weight:800;color:#212529;margin:0 2px 0 4px}
  .schip{height:28px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 12px;font-size:12px;color:#4b5158;cursor:pointer}
  .schip b{margin-left:3px}
  .schip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .link{color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:#c9cdd2;text-underline-offset:2px}
  .link:hover{color:var(--teal-d)}
  .msel{position:relative}
  .tright{margin-left:auto;display:flex;gap:6px;align-items:center}
  .srch{height:28px;width:170px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:12px;outline:none}
  .srch:focus{border-color:var(--teal)}
  .tbl th.sort{cursor:pointer;user-select:none}
  .tbl th.sort .ar{margin-left:3px;font-size:10px;color:#b9bec4}
  .tbl th.sort.on,.tbl th.sort.on .ar{color:var(--teal-d)}
  .msel .btn.on{border-color:var(--teal);color:var(--teal-d);font-weight:700}
  .mpanel{position:absolute;right:0;top:36px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.08);padding:8px 0;width:240px;max-height:340px;overflow:auto}
  .mpanel label{display:flex;align-items:center;gap:8px;padding:5px 14px;font-size:12.5px;cursor:pointer}
  .mpanel label:hover{background:#f6f7f8}
  .mpanel .mfoot{border-top:1px solid var(--line);margin-top:6px;padding:8px 14px 2px;display:flex;justify-content:flex-end}
  .pager{display:flex;gap:4px;justify-content:center;padding:12px}
  .pager button{min-width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:5px;font-size:12px;cursor:pointer}
  .pager button.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}

  /* 청구 확인 — 원인 분류 · 메모 (서비스 · 결제 수정은 원래 화면) */
  .chk-ln{margin-top:5px;padding-top:5px;border-top:1px dashed #e3e6ea;color:#1f2328;font-weight:500;white-space:normal}
  .ckb{display:inline-block;padding:0 5px;margin-right:4px;border-radius:3px;background:#fff1d6;color:#a86f00;font-weight:700}
  .ckb.ok{background:#e6f6f3;color:#0f8a74}
  .ckm{color:#4b5158}.ckw{color:var(--muted);font-weight:500}
  .lnk{display:inline-block;margin:3px 8px 0 0;border:0;background:none;padding:0;color:var(--teal-d);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .mdl-bg{position:fixed;inset:0;background:rgba(33,37,41,.45);z-index:50;display:flex;align-items:center;justify-content:center}
  .mdl{width:460px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);overflow:auto;background:#fff;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
  .mdl h4{margin:0;font-size:15px}.mdl .sub{font-size:12px;color:var(--muted)}
  .mdl label.fl{font-size:12px;font-weight:700;color:#4b5158;display:block;margin-bottom:4px}
  .mdl select,.mdl textarea{width:100%;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12.5px;padding:7px 9px;outline:none}
  .mdl textarea{height:72px;resize:vertical}
  .mdl .auto{background:#f8f9fa;border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.6}
  .mdl .auto .xb{display:inline-block;padding:0 4px;margin-right:4px;border-radius:3px;background:#ece9fb;color:#4c3aa8;font-weight:700;font-size:11px}
  .mdl .go{display:flex;gap:14px;font-size:12px}
  .mdl .log{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;line-height:1.6}
  .mdl .acts{display:flex;justify-content:flex-end;gap:8px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b2f33;color:#fff;padding:9px 16px;border-radius:6px;font-size:12.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  /* 케이스별 표기 안내 */
  .gd h2{font-size:17px;margin:4px 0 4px}.gd .lead{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .gd .panel{margin-bottom:14px}.gd .ph{padding:12px 14px 4px}.gd .ph p{margin:4px 0 0;font-size:12px;color:var(--muted)}
  .gd .tbl td{white-space:normal;vertical-align:top;line-height:1.5}.gd .tbl td.k{font-weight:700;white-space:nowrap}
  .gd .ex{font-size:10.5px;font-weight:600;line-height:1.5;color:#c2570c;letter-spacing:-.2px;min-width:220px;max-width:300px}
  .gd .ex .mt{color:#1f2328}.gd .ex .dx{color:#5b4bb7}.gd .ex .amt{font-size:12.5px;color:#1f2328;font-weight:500}
  .gd .ex .db{display:inline-block;padding:0 5px;margin-bottom:1px;border-radius:3px;background:#fdeee3;color:#b4480a;font-weight:700}
  .gd .ex .xb{display:inline-block;padding:0 4px;margin-right:4px;border-radius:3px;background:#ece9fb;color:#4c3aa8;font-weight:700}
  .gd .ex .pmb{display:inline-block;padding:0 4px;margin:2px 4px 1px 0;border-radius:3px;background:#eef0f3;color:#6b7178}.gd .ex .pmb.pmc{background:#e6f6f3;color:#0f8a74}
  .gd .ex .ckb{display:inline-block;padding:0 5px;margin-right:4px;border-radius:3px;background:#fff1d6;color:#a86f00;font-weight:700}
  .gd .ex .lnk{color:var(--teal-d);font-weight:700;text-decoration:underline;margin-right:8px}
  .gd .na{color:var(--muted);font-weight:500}
  .gd .tbl{table-layout:fixed}.gd .tbl td.k{width:150px;white-space:normal}.gd .tbl td.ex,.gd .tbl th:last-child{width:290px}.gd .tbl .num{width:70px}.gd .ex br+*{}
  .gd .tbl thead th:first-child{width:150px}.gd .ex .dc,.gd .ex{white-space:normal;word-break:keep-all}.gd .ex .dc{text-align:left;margin:2px 0 0;white-space:normal}
  .demo button.gdb{margin-left:8px;border-color:var(--teal);color:var(--teal-d);font-weight:700}

  /* 설명 · 확인 사항 패널 (프로토타입 옆) — 답변은 구글 시트에 저장 */
  .rvBtn{height:30px;border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:6px;font-size:12px;font-weight:700;padding:0 12px;cursor:pointer}
  @media (min-width:1600px){ body.rv-open .wrap{margin-right:540px} }
  .topbar .crumb,.topbar button,.demo{white-space:nowrap}
  .rv{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);box-shadow:-6px 0 18px rgba(0,0,0,.08);background:#fbfbfc;border-left:1px solid var(--line);overflow:auto;z-index:50;display:none;font-size:12.5px;color:var(--ink)}
  body.rv-open .rv{display:block}
  .rv{font-size:13px;line-height:1.65}

<body>
<div class="wrap">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="tbr"><div class="demo">데모 시나리오
        <button data-sc="cmp" class="on">전월 비교</button>
        <button data-sc="first">첫 달 (전월 없음)</button>
        <button class="gdb" id="gdBtn">케이스별 표기 안내</button>

    </div>

<div class="toast" id="toast"></div>

<script>
/* ───────── 데이터 ─────────
   실데이터 구조 그대로: 굿팜 서비스 요금표(결합 할인) · 약국 관리 옵션명 · 약국 결제 관리 결제 행
   (약국 × 청구월 1건 = 그 약국 서비스 합계, 매월 5일 정기 결제, 실패 · 재시도 · 밀린 결제 일괄, 중간 가입분 결제)
   약국명 · 대표자명 · 사업자 번호만 가상 값 */
const fmt = n => (n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('ko-KR');
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const VAT = v => Math.round(v*1.1);

// 서비스(통합 서비스명) — 약국 관리 기준
const SERVICES = [
  {code:'KIOSK', name:'키오스크'}, {code:'SMART_OCR', name:'스마트 OCR'}, {code:'PHARMACY_FIRST', name:'파머시 퍼스트'},
  {code:'SMART2D', name:'스마트2D'}, {code:'MOBILE_OCR', name:'모바일 OCR'}, {code:'FULL_PACKAGE', name:'풀패키지'},
  {code:'ESL', name:'ESL'}, {code:'EDB', name:'EDB 연동'},
  {code:'POS', name:'굿팜 POS'}, {code:'MBF', name:'모바일 바코드프리'},
  {code:'OFF', name:'서비스에 없는 청구'}, {code:'DISC', name:'청구 할인'}, {code:'UNALLOC', name:'서비스 미지정'} ];   // 실제 청구액이 계약 합계보다 많은 금액 (계약 확인 필요)
const SVC_NAME = Object.fromEntries(SERVICES.map(s=>[s.code,s.name]));

// 요금표 (VAT 별도) — 서비스 비용 · 장비임대료. 결합 할인은 서비스 비용에만, 가장 높은 가격(임대료 포함) 1개 정상가 · 나머지 50%
const FEE = {KIOSK:[30000,15000], SMART_OCR:[30000,15000], PHARMACY_FIRST:[40000,0], SMART2D:[30000,0], MOBILE_OCR:[15000,0]};
const FEE_ORDER = ['KIOSK','SMART_OCR','PHARMACY_FIRST','SMART2D','MOBILE_OCR'];
const FIXED = {FULL_PACKAGE:100000, ESL:180000, EDB:20000, SMART2D_KD:45000};   // 정액 · 할인 불가 · 제휴가

// 약국 × 월 이용 서비스 → 서비스별 청구 금액(VAT 포함) · 요금 기준 · 옵션명
function bill(sub){
  const out = {};
  const comb = sub.filter(i=>i.c in FEE && !i.kd && !(i.c==='MOBILE_OCR' && sub.some(j=>j.c==='SMART_OCR')));
  const top = comb.slice().sort((a,b)=>(FEE[b.c][0]+FEE[b.c][1])-(FEE[a.c][0]+FEE[a.c][1]) || FEE_ORDER.indexOf(a.c)-FEE_ORDER.indexOf(b.c))[0];
  sub.forEach(i=>{ const q=i.q||1; let amt, t='정상가', opt, why='';
    if(i.c==='POS'){ amt=0; t='무료'; opt='굿팜 POS'; why='<b class="db">굿팜 POS 무료</b><br>결제 없음 · 함께 쓰는 서비스에만 청구'; }
    else if(i.c==='FULL_PACKAGE'){ amt=FIXED.FULL_PACKAGE; t='정액'; opt='풀패키지 ('+(i.v||'키오스크')+')'; }
    else if(i.c==='ESL' || i.c==='EDB'){ amt=FIXED[i.c]; t='할인 불가'; opt=i.c==='EDB'?'EDB 연동비':'ESL'; }
    else if(i.kd){ amt=FIXED.SMART2D_KD; t='제휴가'; opt='스마트2D (광동)'; }
    else if(i.c==='MOBILE_OCR' && sub.some(j=>j.c==='SMART_OCR')){ amt=0; t='스마트 OCR 기본 제공'; opt='모바일 OCR'; why='<b class="db">스마트 OCR 기본 제공</b><br>모바일 OCR 15,000 → 0원'; }
    else { const [svc,eq]=FEE[i.c], solo=comb.length<=1, isTop=i===top;
      amt = (solo||isTop ? svc : svc/2) + eq + (q-1)*(svc/2+eq);
      t = solo||isTop ? (q>1?'정상가 + 결합할인 50%':'정상가') : '결합할인 50%';
      opt = SVC_NAME[i.c];
      // 할인 표기 — 배지(무엇과 결합해 몇 % 할인) + 요금표 계산식(VAT 별도) + VAT 금액을 더한 포함가
      const w = n => n.toLocaleString('ko-KR'), L = [], badge = t => '<b class="db">'+t+'</b>';
      if(!(solo||isTop)){
        L.push(badge(SVC_NAME[top.c]+' 결합할인 50%'));
        L.push('서비스 비용 '+w(svc)+' × 50% = '+w(svc/2)+(q>1?' × '+q+'대':''));
      } else if(q>1){
        L.push(badge((q>2?'2대째부터':'2대째')+' 결합할인 50%'));
        L.push('1대째 정상가 '+w(svc)+' · '+(q>2?'2 ~ '+q+'대째':'2대째')+' '+w(svc)+' × 50% = '+w(svc/2)+(q>2?' × '+(q-1)+'대':''));
      }
      if(L.length){ if(eq) L.push('+ 장비임대료 '+w(eq)+(q>1?' × '+q+'대':'')+' (할인 없음) = '+w(amt));
        L.push('+ VAT '+w(VAT(amt)-amt)+' = '+w(VAT(amt))+'원 (VAT 포함가)'); }
      why = L.join('<br>'); }
    out[i.c] = {amt:VAT(amt), t, opt, q, why}; });
  return out;
}
const billTotal = b => Object.values(b).reduce((a,x)=>a+x.amt,0);
// 요금표와 다르게 청구되는 약국 — 실제 청구액을 옵션에 나누고, 금액 아래에 왜 다른지 노트
// 원인 분류 — 결제 금액과 계약이 다르거나 기타 할인이 있는 약국 (실데이터 52곳 정리 기준). 비고 배지 = [대분류] 소분류
const CAUSE = {'1-1':['서비스 누락','EDB 연동비'], '1-2':['서비스 누락','이용 서비스'], '1-3':['서비스 누락','해지 후 결제'], '1-4':['서비스 누락','솔루션 외 서비스'],
  '2':['할인 오입력','할인 0원 · 정가 결제'], '3':['서비스 미갱신','서비스 · 금액 변경'],
  '4-1':['기타 할인','POS 무상'], '4-2':['기타 할인','중복 가입 · 제휴처'], '4-3':['기타 할인','오류 보상 · 테스트'], '5':['기타 할인','사유 없음'],
  '6':['과다 청구 의심','회수 · 무료 서비스 청구']};
const CAUSE_KEYS = ['1-1','1-2','1-3','1-4','2','3','4-1','4-2','4-3','5','6'];   // 표시 순서 (숫자 키는 객체 순서가 바뀌어 별도 지정)
const CAUSE_GRP = [...new Set(CAUSE_KEYS.map(k=>CAUSE[k][0]))];
const CB = k => '<b class="xb">'+CAUSE[k][0]+'</b>'+CAUSE[k][1]+'<br>';
// 기타 할인 사유 → 원인 분류
const discCause = (c, why) => c==='POS' ? '4-1' : /온비타|drs|중복|파머시/i.test(why) ? '4-2' : /pos/i.test(why) ? '4-1' : /오류|테스트/.test(why) ? '4-3' : '5';
const LIST = i => i.c==='POS' ? 0 : i.c==='FULL_PACKAGE' ? FIXED.FULL_PACKAGE : i.c==='ESL'||i.c==='EDB' ? FIXED[i.c] : i.kd ? FIXED.SMART2D_KD : (FEE[i.c][0]+FEE[i.c][1])*(i.q||1);
function billX(p, bm){
  const x=p.x, sub=p.sub[bm], canon=bill(sub), out={}, w=fmt, B=t=>'<b class="xb">'+t+'</b>';
  const ct = x.ct.slice(), note = sub.map(()=>[]), cat = sub.map(()=>[]);
  // 계약 기타 할인 — 사유에 적힌 옵션에만 (옵션을 특정하지 않으면 청구 할인 행)
  let discEtc=0, discWhy='';
  (x.disc||[]).forEach(([c,d,why])=>{ const n=sub.findIndex(i=>i.c===c); if(n<0){ discEtc+=d; discWhy=why; return; }
    const take=Math.min(d,ct[n]); ct[n]-=take; discEtc+=d-take; const k=discCause(c,why); cat[n].push(k); note[n].push(CB(k)+'기타 할인 사유 `'+why+'` −'+w(VAT(take))+'원'); });
  const noCt = x.k==='list', base = sub.map((i,n)=>VAT(noCt ? LIST(i) : ct[n]));
  // 굿팜 POS — 계약 당시 유료 약국만 결제
  const pi = sub.findIndex(i=>i.c==='POS'), posPaid = pi>=0 && base[pi]>0 && x.billed>=base.reduce((a,v)=>a+v,0)-VAT(discEtc);
  if(pi>=0 && !posPaid) base[pi]=0;
  const amt = base.slice(); let diff = x.billed-base.reduce((a,v)=>a+v,0);
  const sumCt = x.billed-diff, rs = x.reason||'';
  // 계약보다 많이 결제 — 결제 이유 · 할인 0원 계약으로 어느 서비스인지 확인
  if(diff>0){
    const edb = /EDB/.test(rs) && !sub.some(i=>i.c==='EDB') ? 22000 : 0;
    const free = sub.map((i,n)=>n).filter(n=>x.ct[n]===0 && LIST(sub[n])>0);
    let hit = free.find(n=>VAT(LIST(sub[n]))+edb===diff);
    if(hit===undefined && edb===diff) hit=-1;
    if(hit!==undefined){
      if(hit>=0){ amt[hit]=VAT(LIST(sub[hit])); cat[hit].push('2'); note[hit].push(CB('2')+'등록 금액은 할인으로 0원 · 실제 결제 정가 '+w(amt[hit])+'원'); }
      if(edb) out.EDB={amt:edb, t:'edb', opt:'EDB 연동비', q:1, x:1, cat:['1-1'], why:CB('1-1')+'EDB 연동비가 약국 서비스에 없음 · 결제 이유 `'+rs+'`'};
      diff=0; }
    else if(diff===16500 && /바코드프리/.test(rs)){ out.MBF={amt:diff, t:'mbf', opt:'모바일 바코드프리', q:1, x:1, cat:['1-4'], why:CB('1-4')+'모바일 바코드프리 · 결제 이유 `'+rs+'`'}; diff=0; }
  }
  // 실제 결제 = 계약 옵션 일부의 요금표 금액 → 나머지 옵션은 청구 안 됨
  if(diff<0 && !x.disc){
    const cand = sub.map((_,n)=>n).filter(n=>canon[sub[n].c].amt>0 && base[n]>0); const hits=[];
    for(let m=1;m<(1<<cand.length)-1;m++){ const on=new Set(cand.filter((_,k)=>m>>k&1)), pick=sub.filter((_,n)=>on.has(n)||!cand.includes(n)), bb=bill(pick);
      if(billTotal(bb)===x.billed) hits.push({on, bb}); }
    if(hits.length===1){ const {on,bb}=hits[0], names=sub.filter((i,n)=>on.has(n)).map(i=>SVC_NAME[i.c]).join(' + ');
      sub.forEach((i,n)=>{ out[i.c] = on.has(n)||!cand.includes(n) ? {...bb[i.c], x:0}
        : {amt:0, t:'miss', opt:canon[i.c].opt, q:canon[i.c].q, x:1, cat:['3'], why:CB('3')+'약국 서비스에 있지만 청구되지 않음<br>실제 결제 '+w(x.billed)+'원 = '+names+' 요금표 금액'+(rs?'<br>결제 이유 `'+rs+'`':'')}; });
      return out; } }
  sub.forEach((i,n)=>{ const c=canon[i.c], L=note[n];
    if(x.k==='term') { cat[n].push('1-3'); L.push(CB('1-3')+'서비스 해지 상태인데 결제 중'); }
    else if(noCt){ cat[n].push('2'); L.push(CB('2')+'등록 금액 없음 (0원) · 요금표 정가 '+w(base[n])+'원으로 표시'); }
    else if(i.c==='POS' && posPaid){ L.push(B('굿팜 POS 유료 이용')+'가입 당시 유료 약국'); L.push('POS '+w(ct[n])+' + VAT '+w(amt[n]-ct[n])+' = '+w(amt[n])+'원'); }
    else if(i.c==='POS'){ if(!L.length) L.push(...c.why.split('<br>')); }
    else if(!L.length && amt[n]!==c.amt){ L.push(B('등록 금액')+'요금표와 다른 등록 금액'); L.push('요금표 '+w(c.amt)+'원 → 등록 '+w(amt[n])+'원'); }
    out[i.c] = {amt:amt[n], t:x.k, opt:c.opt, q:c.q, why:L.length?L.join('<br>'):c.why, x:L.length?1:0, cat:cat[n]}; });
  const memo = x.memo ? '<br>'+x.memo : '';
  // 계약보다 많이 결제 — 비고에 무료 · 회수 = 과다 청구 의심, 0원 계약 옵션이 있으면 할인 오입력, 그 외 계약 미갱신
  const offK = /무료|회수/.test(x.memo||'') ? '6' : x.ct.some(v=>v===0) ? '2' : '3';
  if(diff>0) out.OFF = {amt:diff, t:'off', opt:'서비스에 없는 청구', q:1, x:1, cat:[offK],
    why:CB(offK)+'서비스 합계 '+w(sumCt)+'원 → 실제 결제 '+w(x.billed)+'원<br>서비스에 없는 금액 +'+w(diff)+'원'+(x.memo?'':' (쓰는 서비스가 약국 서비스에 빠졌을 수 있음)')+memo+(rs?'<br>결제 이유 `'+rs+'`':'')};
  const discK = discWhy ? discCause('',discWhy) : '3';
  if(diff<0) out.DISC = {amt:diff, t:'disc', opt:'청구 할인', q:1, x:1, cat:[discK],
    why:CB(discK)+(discWhy?'기타 할인 사유 `'+discWhy+'` −'+w(-diff)+'원':'서비스 합계 '+w(sumCt)+'원 → 실제 결제 '+w(x.billed)+'원<br>할인 −'+w(-diff)+'원 (구독료 · 등록 할인)')+memo+(rs?'<br>결제 이유 `'+rs+'`':'')};

}

function momCell(c,p){

function kpiDelta(c,p,unit){

// 페이지 이동 — 처음 · 이전 · 앞뒤 2쪽 · 다음 · 끝
function pager(n){
  const c=S.cpage, from=Math.max(1,Math.min(c-2,n-4)), to=Math.min(n,from+4), b=(p,t,on)=>`<button class="${on?'on':''}" data-cpg="${p}">${t}</button>`;
  let h=c>1?b(1,'«')+b(c-1,'‹'):'';
  for(let i=from;i<=to;i++) h+=b(i,i,i===c);
  return h+(c<n?b(c+1,'›')+b(n,'»'):'');
}

// 목록 조건이 바뀌면 1페이지 · 접기 상태 처음으로
function resetList(){ S.cpage=1; S.expAll=null; S.tog=new Set(); }
function bindMain(){
  const $=id=>document.getElementById(id);
  const fm=$('fMonth'); if(fm) fm.onchange=e=>{ S.month=e.target.value; S.cf='all'; S.q=''; S.opts=new Set(); S.cause='all'; S.sort=null; resetList(); render(); };
  const ob=$('optBtn'); if(ob) ob.onclick=e=>{ e.stopPropagation(); S.optOpen=!S.optOpen; render(); };
  document.querySelectorAll('[data-opt]').forEach(c=>c.onchange=()=>{ c.checked?S.opts.add(c.dataset.opt):S.opts.delete(c.dataset.opt); resetList(); render(); });
  const oc=$('optClear'); if(oc) oc.onclick=()=>{ S.opts=new Set(); resetList(); render(); };
  document.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{ const k=b.dataset.cf; S.cf=S.cf===k?'all':k; resetList(); render(); });
  document.querySelectorAll('[data-cpg]').forEach(b=>b.onclick=()=>{ S.cpage=+b.dataset.cpg; S.expAll=null; S.tog=new Set(); render(); });
  document.querySelectorAll('tr[data-ph]').forEach(tr=>tr.onclick=e=>{ if(e.target.closest('.link,.lnk')) return; const n=tr.dataset.ph; S.tog.has(n)?S.tog.delete(n):S.tog.add(n); render(); });
  const ea=$('expAll'); if(ea) ea.onclick=()=>{ S.expAll=ea.textContent==='모두 펼치기'; S.tog=new Set(); render(); };
  const cs=$('cause'); if(cs) cs.onchange=e=>{ S.cause=e.target.value; resetList(); render(); };
  const pp=$('pp'); if(pp) pp.onchange=e=>{ S.pp=+e.target.value; resetList(); render(); };
  // 정렬 — 같은 열을 누를 때마다 내림차순 → 오름차순 → 기본(증감 크기 큰 순)
  document.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{ const k=th.dataset.sort;
    if(S.sort!==k){ S.sort=k; S.dir='desc'; } else if(S.dir==='desc') S.dir='asc'; else S.sort=null;
    S.cpage=1; render(); });
  // 약국명 검색 — 입력하는 즉시 반영(한글 조합 중에는 조합이 끝난 뒤)
  const qi=$('q'); if(qi){ const apply=()=>{ S.q=qi.value; resetList(); render(); const n=$('q'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
    qi.addEventListener('input',e=>{ if(!e.isComposing) apply(); }); qi.addEventListener('compositionend',apply); }
  // 미결제 탭 — 약국 결제 관리로 이동(기간 1개월 · 결제 여부 조회 실패)
  const pg=$('payGo'); if(pg) pg.onclick=goPay;
  // 총 청구 · 결제 완료 · 미결제 탭
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; S.cf='all'; S.sort=null; resetList(); render(); });
}

  ['기타 할인','오류 보상 · 테스트',2,'','22,500'],['기타 할인','사유 없음',2,'','25,000'],['과다 청구 의심','회수 · 무료 서비스 청구',1,'+27,500',''],['차이 없음','등록 서비스 그대로 결제',3,'0','']];
function rvCard(it){
  const cur=RV.data&&RV.data.items[it.id]||{}, kind=it.id[0], has=cur.reply||cur.answer;
  return `<div class="card ${cur.reply==='확정'||cur.reply==='답변 완료'?'done':''}" id="rv-${it.id}">
    <div class="ch"><span class="no">${kind==='C'?'확정 '+it.id.slice(1):'질문 '+it.id.slice(1)}</span><span class="st ${has?'ok':''}">${has?esc(cur.reply||'의견 있음'):'답변 전'}</span><span class="own">담당 · ${it.own}</span></div>
    <div class="q">${esc(it.q)}</div><div class="bg">${esc(it.bg)}</div>${it.more?RV_MORE[it.more]:''}
    ${has?`<div class="cur"><b>${esc(cur.reply||'의견')}</b>${cur.answer?' · '+esc(cur.answer).replace(/\n/g,'<br>'):''}${cur.at?'<br><span class="mut">'+esc(cur.at)+' 저장</span>':''}</div>`:''}
    <div class="frm" data-id="${it.id}">
      <select><option value="">회신 선택</option>${RV_REPLY[kind].map(o=>`<option ${cur.reply===o?'selected':''}>${o}</option>`).join('')}</select>
      <textarea placeholder="답변 · 의견">${esc(cur.answer||'')}</textarea>
      <button ${RV_API?'':'disabled'}>저장</button></div></div>`; }
function renderRv(){
  const el=document.getElementById('rv'); if(!el) return;
  const log=(RV.data&&RV.data.log||[]).slice(-10).reverse();
  const done=RV_ITEMS.filter(i=>{ const c=RV.data&&RV.data.items[i.id]; return c&&(c.reply||c.answer); }).length;
  el.innerHTML=`<div class="rvh"><div class="rvt"><h2>설명 · 확인 사항</h2><span class="prog">답변 ${done} / ${RV_ITEMS.length}</span><button class="x" id="rvX" aria-label="닫기">✕</button></div>
    <div class="nav">${[['rvs1','바뀐 내용'],['rvs2','확인 방법'],['rvs3','실데이터'],['rvs4','확정 요청 6'],['rvs5','질문 10']].map(([k,t])=>`<a data-go="${k}">${t}</a>`).join('')}</div></div>
  ${RV_API?'':'<div class="warn">답변 저장 주소를 연결하기 전입니다. 지금은 읽기만 할 수 있습니다.</div>'}${RV.err?'<div class="warn">'+esc(RV.err)+'</div>':''}
  <div class="sec" id="rvs1"><h3>바뀐 내용</h3>
    <div class="key"><b>① 약국별 청구를 총 청구 / 결제 완료 / 미결제로 나눠 봅니다</b>총 청구 = 결제 완료 + 미결제(청구월 기준). 결제 완료 목록은 전월 대비(신규 · 중단 · 금액 변동)로 걸러 보고, 미결제 목록에서는 약국 결제 관리로 바로 이동합니다.</div>
    <div class="key"><b>② 기타 할인 · 금액이 다른 약국을 원인별로 분류합니다</b>비고에 [대분류] 소분류 배지와 원인 분류 필터를 붙였습니다. 원인 분류 · 메모는 화면에서 고칠 수 있고, 바꾼 달부터 적용하는 안입니다.</div>
    <p class="mut">그 밖에: 요약 대시보드 삭제 · 서비스별 청구 현황 열 정리 · 화면 용어 '계약' → '서비스'</p></div>
  <div class="sec" id="rvs2"><h3>확인 방법</h3>
    <ol><li>왼쪽 약국별 청구에서 결제 완료 · 미결제 목록과 <b>원인 분류</b> 필터를 눌러 봅니다. 30건씩 보기 첫 페이지에 케이스마다 대표 약국이 모두 나옵니다.</li>
    <li>상단 <button class="lnk" id="rvGuide">케이스별 표기 안내</button>에서 상태별로 화면에 어떻게 보이는지 확인합니다.</li>
    <li>실제 약국별 분류는 <a class="lnk" href="${RV_CAT}" target="_blank" rel="noopener">원인 분류 시트</a>에서 확인합니다. 화면의 약국명은 예시입니다.</li></ol></div>
  <div class="sec" id="rvs3"><h3>실데이터 점검 결과 <small>2026-10-16 청구 설정</small></h3>
    <p>결제 금액이 등록 서비스와 다르거나 기타 할인이 있는 약국 <b>52곳</b> · 등록보다 매월 <b>973,500원</b> 더 결제 · 기타 할인 매월 247,500원</p>
    <table><tr><th>대분류</th><th>소분류</th><th>곳</th><th>차이(월)</th><th>기타 할인</th></tr>
    ${RV_STAT.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="n">${r[2]}</td><td class="n">${r[3]}</td><td class="n">${r[4]}</td></tr>`).join('')}</table></div>
  <div class="sec" id="rvs4"><h3>확정 요청 <small>프로토타입에 반영한 안 · 회신을 고르고 저장</small></h3>${RV_ITEMS.filter(i=>i.id[0]==='C').map(rvCard).join('')}</div>
  <div class="sec" id="rvs5"><h3>질문 <small>답변을 적고 저장</small></h3>${RV_ITEMS.filter(i=>i.id[0]==='Q').map(rvCard).join('')}</div>
  <div class="sec"><h3>최근 답변</h3>${log.length?'<ul>'+log.map(l=>`<li>${esc(l.at)} · ${esc(l.id)} · ${esc(l.reply)} ${esc(l.answer).slice(0,60)}</li>`).join('')+'</ul>':'<p class="mut">아직 저장된 답변이 없습니다.</p>'}
    <p class="mut">모든 답변은 <a class="lnk" href="${RV_SHEET}" target="_blank" rel="noopener">구글 시트</a>에도 쌓입니다.</p></div>`;
  el.querySelector('#rvX').onclick=()=>toggleRv(false);
  el.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>el.querySelector('#'+a.dataset.go).scrollIntoView({behavior:'smooth'}));
  el.querySelector('#rvGuide').onclick=()=>goGuide();
  el.querySelectorAll('.frm').forEach(f=>{ const [sel,ta,btn]=[f.querySelector('select'),f.querySelector('textarea'),f.querySelector('button')];
    btn.onclick=async()=>{
      if(!sel.value && !ta.value.trim()){ toast('회신이나 답변을 적어 주세요'); return; }
      btn.disabled=true; btn.textContent='저장 중…';
      try{ const r=await fetch(RV_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({id:f.dataset.id,reply:sel.value,answer:ta.value.trim()})});
        const j=await r.json(); if(!j.ok) throw new Error(j.error||'저장 실패'); RV.data=j; RV.err=''; renderRv(); toast('저장했습니다'); }
      catch(e){ btn.disabled=false; btn.textContent='저장'; toast('저장하지 못했습니다 — '+e.message); } }; }); }
async function loadRv(){ if(!RV_API) return renderRv();
  try{ const j=await (await fetch(RV_API)).json(); if(j.ok){ RV.data=j; RV.err=''; } }catch(e){ RV.err='답변을 불러오지 못했습니다. 잠시 후 다시 열어 주세요.'; }
  renderRv(); }
function toggleRv(on){ RV.open=on==null?!RV.open:on; document.body.classList.toggle('rv-open',RV.open); if(RV.open) loadRv(); }
document.getElementById('rvBtn').onclick=()=>toggleRv();
if(/[?&]review=1/.test(location.search)) toggleRv(true);

/* ───────── 공통 ───────── */
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove('show'),1800); }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-toast]'); if(t){ e.stopPropagation(); toast(t.dataset.toast); }
  const ck=e.target.closest('[data-chk]'); if(ck){ e.stopPropagation(); openChk(ck.dataset.chk); }
  const pg=e.target.closest('[data-paygo]'); if(pg){ e.stopPropagation(); document.querySelectorAll('.mdl-bg').forEach(x=>x.remove()); goPay(); } }, true);
document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{ S.sc=b.dataset.sc; if(S.sc==='first') S.month='2026-10'; document.querySelectorAll('[data-sc]').forEach(x=>x.classList.toggle('on',x===b)); S.cf='all'; render(); });
// 옵션 목록 밖을 누르면 닫기
document.addEventListener('click',e=>{
  if(S.optOpen && !e.target.closest('.msel')){ S.optOpen=false; render(); }});
const SIDE = {
  stats:['통계',['서비스 청구 통계<span class="new">NEW</span>','굿팜플러스','굿팜솔루션NEW','모바일약국','모바일약국 월별 결제','모바일 바코드프리','AI MATE','업무 이용 통계','광고 성과 집계 통계']],
  pay:['약국관리',['약국 관리','신규 약국 관리','약국 A/S','약국 결제 관리','태블릿 관리'],3] };
function render(){
  const pay=S.page==='pay', gd=S.page==='guide', sd=SIDE[gd?'stats':S.page];
  document.getElementById('side').innerHTML='<div class="side-logo"><span class="side-mark"></span><span class="side-word">goodpharm</span></div><div class="side-grp">'+sd[0]+'</div>'+
    sd[1].map((x,i)=>'<div class="side-item'+(i===(sd[2]||0)?' on':'')+'">'+x+'</div>').join('');
  document.querySelector('.demo').style.display=pay||gd?'none':'';
  document.getElementById('crumb').innerHTML=pay?'약국관리 &gt; <b>약국 결제 관리</b><a class="back" id="back">‹ 서비스 청구 통계</a>'
    : gd?'통계 &gt; 서비스 청구 통계 &gt; <b>케이스별 표기 안내</b><a class="back" id="back">‹ 서비스 청구 통계</a>':'통계 &gt; <b>서비스 청구 통계</b>';
  if(pay||gd){ (pay?renderPay:renderGuide)(); document.getElementById('back').onclick=()=>history.back(); } else renderMain();
}
render();
</script>
