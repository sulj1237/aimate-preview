  <div class="basis" id="kBasis"><b>전월분 입금</b> ${fmt(prevPaid)}원 · 미입금 ${prevUn}곳 &nbsp; <b>굿팜 확인 필요</b> ${kdOnly().length}곳 · 청구 제외 ${qt('청구했다면 '+fmt(kdOnly().length*KD_FEE)+'원 — 굿팜 VIP 설정 필요 '+kdOnly().filter(o=>o.reg).length+'곳 · 굿팜 미등록 '+kdOnly().filter(o=>!o.reg).length+'곳. 광동 파일 값은 이 목록에만 두고 굿팜 약국 데이터로 만들지 않아요.')}</div></div>`;
}
const KDB=o=>!o.admin?(o.reg?'<span class="ms chk" style="margin-left:6px">굿팜 VIP 설정 필요</span>':'<span class="ms chk" style="margin-left:6px">굿팜 미등록</span>'):!o.inKd?'<span class="ms no" style="margin-left:6px">광동 추가 필요</span>':'';
function kdList(){
  let a=KD.slice(); if(S.tab==='miss') a=kdMiss(); else if(S.tab==='only') a=kdOnly(); else if(S.tab==='new') a=kdNew();
  if(S.q) a=a.filter(o=>o.n.includes(S.q));
  const ord=o=>!o.admin?1:!o.inKd?0:2; a.sort((x,y)=>ord(x)-ord(y) || y.st.localeCompare(x.st));
  return `<div class="panel" id="kList"><div class="ph"><h3>VIP처 목록</h3>${qt("광동 VIP 목록과 다른 약국은 약국명 옆 배지로 표시")}
    <div class="right" id="kBtns"><button class="btn" id="kTpl">파일 양식 다운로드</button><button class="btn pri" id="kUp">광동 VIP 목록 업로드</button></div></div>
  <div class="tools"><div class="ptabs">
    <button class="ptab ${S.tab==='all'?'on':''}" data-tab="all">전체<b>${KD.length}</b></button>
    <button class="ptab ${S.tab==='miss'?'on':''}" data-tab="miss">광동 추가 필요<b>${kdMiss().length}</b></button>
    <button class="ptab ${S.tab==='only'?'on':''}" data-tab="only">굿팜 확인 필요<b>${kdOnly().length}</b></button>
    <button class="ptab ${S.tab==='new'?'on':''}" data-tab="new">금월 신규<b>${kdNew().length}</b></button></div>
    ${S.tab==='miss'?'<button class="btn sm" id="kReq">청구 요청 목록 다운로드</button>':''}
    <input class="q" id="q" placeholder="약국명 검색" value="${esc(S.q)}"></div>
  <div class="tblwrap"><table class="tbl" id="kTbl"><thead><tr><th>약국명</th><th>사업자번호</th><th>VIP 지원 서비스</th><th>VIP 시작월</th><th class="num">청구 금액</th><th class="ctr">청구</th><th class="ctr">전월분 입금</th></tr></thead><tbody>
  ${a.map(o=>`<tr class="${o.admin&&o.inKd?'':'unm'}"><td>${esc(o.n)}${o.st==='2026-11'?'<span class="tg vip">신규</span>':''}${KDB(o)}<div class="sub2">${o.admin?o.r+' · '+o.sid:o.reg?o.r+' · '+o.sid+' · 광동 VIP 미설정 <a href="#" class="kdgo">약국 상세 ›</a>':'굿팜에 없는 약국 — 광동 파일 값만'}</div></td><td>${o.biz}</td><td>${o.svc}</td><td>${o.st}</td>
    <td class="num">${o.admin?fmt(KD_FEE):'<span class="sub2">— (청구 시 '+fmt(KD_FEE)+')</span>'}</td>
    <td class="ctr">${!o.admin?'<b style="color:#c2410c">청구 제외 · 확인 필요</b>':o.inKd?'청구 완료':'<b style="color:var(--up)">미청구</b>'}</td>
    <td class="ctr">${o.paid===true?'입금 완료':o.paid===false?'<b style="color:var(--up)">미입금</b>':'<span class="sub2">—</span>'}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}

/* ── 약국관리 > VAN 정산 관리 ── */
function mgmtHead(){
  return `<div class="panel" id="mSum"><div class="ph"><h3>VAN 정산 관리</h3>${qt("매달 VAN 정산 파일을 올려 반영해요. 사업자번호로 굿팜 약국에 자동 연결해요.")}
    <div class="right">${monthSel('mMonth')}</div></div>
  <div class="cards" style="grid-template-columns:repeat(3,1fr)">
    <div class="kc" id="mTot"><div class="l">반영 금액</div><div class="v">${fmt(VAN_ALL)}</div><div class="s">파일 총액 ${fmt(VAN_FILE)}${vanNg().length?` · <b style="color:var(--up)">약국 알 수 없음 ${vanNg().length}곳 ${fmt(sumV(vanNg()))}</b>`:''}</div></div>
    <div class="kc" id="mOk"><div class="l">약국 · 단말기</div><div class="v">${fmt(vanOk().length)}곳</div><div class="s">TID ${FILE.rows}대 · 승인 ${fmt(D.reduce((s,o)=>s+o.tids.reduce((a,t)=>a+t.c,0),0))}건</div></div>
    <div class="kc" id="mFile"><div class="l">반영 파일</div><div class="v" style="font-size:14px">${FILE.name}</div><div class="s">반영 2026-11-10 16:02 · 김운영</div></div>
  </div></div>`;
}
// 정산 단가 — TID(단말기)마다 다름(대리점 10 · 15 · 18원, 제휴사 5원 등). 한 약국에 단가가 다른 TID가 여럿이면 함께 표시
const rateOf=o=>{ const u=[...new Set(o.tids.map(t=>t.u))].sort((a,b)=>a-b); return u.length>1?`<span title="TID마다 단가가 달라요 — ▸ 눌러 TID별 확인">${u.join(' · ')}원</span>`:u[0]+'원'; };
function rateSum(){ const g={}; D.forEach(o=>o.tids.forEach(t=>{ const k=t.g+'|'+t.u; const x=g[k]=g[k]||{g:t.g,u:t.u,n:0,c:0,m:0,df:0}; x.n++; x.c+=t.c; x.m+=t.m; if(t.s!==t.c*t.u) x.df++; }));
  const R=Object.values(g).sort((a,b)=>a.g.localeCompare(b.g)||b.u-a.u), tm=R.reduce((s,x)=>s+x.m,0);
  return `<div class="tblwrap" id="rateSum" style="margin:0 18px 10px"><table class="tbl"><thead><tr><th>구분</th><th class="num">정산단가</th><th class="num">TID</th><th class="num">승인건수</th><th class="num">정산금액</th><th class="num">비중</th><th class="num">건수 × 단가와 다른 TID</th></tr></thead><tbody>
  ${R.map(x=>`<tr><td>${x.g}</td><td class="num"><b>${x.u}원</b></td><td class="num">${fmt(x.n)}</td><td class="num">${fmt(x.c)}</td><td class="num">${fmt(x.m)}</td><td class="num">${(x.m/tm*100).toFixed(1)}%</td><td class="num">${x.df?fmt(x.df):'<span class="sub2">0</span>'}</td></tr>`).join('')}
  </tbody></table></div>`; }
function mgmtList(){
  let a=D.slice();
  if(S.q) a=a.filter(o=>o.n.includes(S.q)||o.b.replace(/\D/g,'').includes(S.q.replace(/\D/g,'')));
  a.sort((x,y)=>(x.st==='ok')-(y.st==='ok')||y.vam-x.vam);   // 약국 알 수 없음 먼저
  const fr=o=>{
    const op=S.open.has(o.b);
    let h=`<tr><td><button class="tog" data-tog="${o.b}">${op?'▾':'▸'}</button>${esc(o.n)}</td>
      <td>${o.b}</td><td>${o.st==='ok'?`${esc(o.n)}<div class="sub2">${o.r} · ${o.sid}</div>`:'<span class="tbu">약국 알 수 없음</span><span class="qi" data-tip="정산 파일의 사업자번호와 맞는 굿팜 약국이 없어 어느 약국인지 알 수 없어요. 금액은 이미 받은 돈이라 총매출 · VAN 합계에는 들어가요. 약국 관리에서 사업자번호를 고친 뒤 같은 파일을 다시 올리면 약국에 연결돼요.">?</span><div class="sub2">일치하는 약국 없음 · 반영 금액에서 제외</div>'}</td>
      <td class="num">${o.tids.length}</td><td class="num">${rateOf(o)}</td><td class="num">${fmt(o.tids.reduce((s,t)=>s+t.c,0))}</td><td class="num">${fmt(o.vam)}</td></tr>`;
    if(op) h+=o.tids.map(t=>{ const exp=t.c*t.u, df=t.s-exp;
      return `<tr class="tid"><td style="padding-left:30px">TID ${t.t} <span class="tg">${t.g}</span></td><td colspan="2" class="sub2">승인금액 ${fmt(t.a)} · 정산액 ${fmt(t.s)} + 부가세 ${fmt(t.v)}${df?` <span class="dfx" title="정산액이 승인건수 × 단가(${fmt(exp)})와 달라요 — 취소 건 차감 등, 파일 값 그대로 반영">건수 × 단가와 ${df>0?'+':''}${fmt(df)}</span>`:''}</td><td></td><td class="num"><b>${t.u}원</b></td><td class="num">${fmt(t.c)}</td><td class="num">${fmt(t.m)}</td></tr>`; }).join('');
    return h; };
  return `<div class="panel" id="mList"><div class="ph"><h3>정산 내역</h3>${qt("파일 한 행 = 약국 × TID(단말기) → 사업자번호로 약국 단위 합산. 금액은 정산금액(VAT 포함)")}
    <div class="right" id="upBtns"><button class="btn" id="tplBtn">파일 양식 다운로드</button><button class="btn pri" id="upBtn">정산 파일 업로드</button></div></div>
  ${S.page==='upload'||S.page==='err'?`<div class="pv" id="upRes" style="margin:0 18px 10px;line-height:1.7;background:#e6f6f3;border-color:#bfe7df">
    <b>${FILE.name}</b> 반영 완료 · 집계 월 <b>2026-11</b> <a href="#" id="chgMonth" style="font-size:11.5px">변경</a> · 반영 금액 <b>${fmt(VAN_ALL)}원</b> · 약국 ${fmt(vanOk().length)}곳${vanNg().length?` · <b style="color:var(--up)">약국 알 수 없음 ${vanNg().length}곳 ${fmt(sumV(vanNg()))}원</b>`:' 모두 연결'}</div>`:''}
  <div class="ph" style="padding-top:0;border:0"><h3 style="font-size:13px">정산 단가별 합계</h3>${qt('같은 약국이라도 TID(단말기)마다 정산 단가가 달라요(대리점 10 · 15 · 18원, 제휴사 5원 등). 정산 파일의 TID별 단가 · 정산액을 그대로 저장하고 단가별로 합쳐 봐요. 정산액이 승인건수 × 단가와 다른 TID(취소 건 차감 등)는 파일 값 그대로 반영하고 수만 표시')}</div>
  ${rateSum()}
  <div class="tools"><span class="sub2">전체 ${fmt(D.length)}곳</span>
    <input class="q" id="q" placeholder="가맹점명 · 사업자번호 검색" value="${esc(S.q)}"></div>
  <div class="tblwrap"><table class="tbl" id="vTbl"><thead><tr><th>가맹점명 (파일)</th><th>사업자번호</th><th>굿팜 약국</th><th class="num">TID</th><th class="num">정산단가</th><th class="num">승인건수</th><th class="num">정산금액</th></tr></thead>
  <tbody>${a.map(fr).join('')}<tr class="tot" id="allRow"><td colspan="6">반영 금액 (연결된 행 합계)</td><td class="num">${fmt(sumV(a.filter(o=>o.st==='ok')))}</td></tr>${a.some(o=>o.st!=='ok')?`<tr id="ngRow"><td colspan="6" style="color:var(--up)">약국 알 수 없음 ${a.filter(o=>o.st!=='ok').length}건 — 약국 관리의 사업자번호를 고친 뒤 같은 파일을 다시 올리면 반영(이전 파일은 대체됨)</td><td class="num" style="color:var(--up)">${fmt(sumV(a.filter(o=>o.st!=='ok')))}</td></tr>`:''}</tbody></table></div></div>`;
}
function hist(){
  return `<div class="panel" id="histPanel"><div class="ph"><h3>업로드 이력</h3>${qt("같은 월 파일을 다시 올리면 이전 파일은 대체됨으로 남아요")}</div>
  <div class="tblwrap"><table class="tbl" id="hTbl"><thead><tr><th>집계 월</th><th>파일명</th><th>업로드 일시</th><th>확정자</th><th>확정 일시</th><th class="num">행 수</th><th class="num">반영 금액</th><th class="ctr">상태</th></tr></thead><tbody>
  ${HIST.map(h=>`<tr><td>${h[0]}</td><td>${esc(h[1])}</td><td>${h[2]}</td><td>${h[3]}</td><td>${h[4]}</td><td class="num">${fmt(h[5])}</td><td class="num">${fmt(h[6])}</td><td class="ctr"><span class="ms ${h[7]==='on'?'ok':''}" style="${h[7]==='on'?'':'background:#eef0f3;color:#5b6168'}">${h[7]==='on'?'반영 중':'대체됨'}</span></td></tr>`).join('')}
  </tbody></table></div></div>`;
}

function errModal(){
  return `<div class="dim"></div><div class="mdl" id="errMdl"><div class="mh"><h3>연결된 행은 반영했어요 · 연결 안 된 행 ${ERR.length}건</h3><button class="x" data-close>✕</button></div><div class="mb">
  <div class="warn" id="errMsg">굿팜 약국과 연결된 행은 반영했어요. 아래 <b>${ERR.length}건</b>은 <b>약국 알 수 없음</b>로 남겨 반영 금액에서 뺐어요. 약국 관리의 사업자번호를 고친 뒤 같은 파일을 다시 올리면 남은 행까지 반영돼요(이전 파일은 대체됨).</div>
  <table class="tbl" id="errTbl"><thead><tr><th>가맹점명</th><th>사업자번호</th><th class="num">TID</th><th class="num">정산금액</th><th>사유</th></tr></thead><tbody>
  ${ERR.map(e=>`<tr><td>${esc(e.n)}</td><td>${e.b}</td><td class="num">${e.tids}</td><td class="num">${fmt(e.vam)}</td><td style="color:var(--up);font-weight:700">${e.why}</td></tr>`).join('')}
  </tbody></table>
  <div class="hint" id="errHint">사유는 <b>일치하는 약국 없음</b>(사업자번호가 굿팜 약국에 없음) · <b>같은 사업자번호 약국 여러 곳</b>(한 사업자번호에 약국이 2곳 이상) 두 가지예요. 테스트 계정은 대조에서 빼요.</div>
  </div><div class="mf"><button class="btn pri" data-close>확인</button></div></div>`;
}

function render(){
  side();
  document.querySelectorAll('.demo button').forEach(b=>b.classList.toggle('on',b.dataset.go===S.page));
  const base = area()==='kd' ? kdHead()+kdList() : area()==='dash' ? dashHead()+`<div style="display:flex;gap:14px">${S.tv?trend():dashTrend()}${dashShare()}</div>`+statList() : mgmtHead()+mgmtList()+hist();
  const mdl = S.page==='err'?errModal():'';
  $('content').innerHTML = base + mdl;
  bind();
}
function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});
  document.querySelectorAll('[data-ss]').forEach(h=>h.onclick=()=>{ const k=h.dataset.ss; if(S.ss!==k){ S.ss=k; S.sd='desc'; } else if(S.sd==='desc') S.sd='asc'; else { S.ss=null; S.sd=null; } render(); });
  document.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const k=b.dataset.tog; S.open.has(k)?S.open.delete(k):S.open.add(k); render();});
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>go('mgmt'));
  const qv=$('qv'); if(qv) qv.onkeydown=e=>{ if(e.key==='Enter'){ S.q=qv.value; render(); } };
  if($('qGo')) $('qGo').onclick=()=>{ S.q=$('qv').value; render(); };
  if($('qReset')) $('qReset').onclick=()=>{ S.q=''; S.qk='name'; S.flt={cls:new Set(),equip:'',funnel:'',prog:'',ocr:''}; render(); };
  if($('qk')) $('qk').onchange=e=>{ S.qk=e.target.value; render(); };
  document.querySelectorAll('[data-cls]').forEach(c=>c.onchange=()=>{ c.checked?S.flt.cls.add(c.dataset.cls):S.flt.cls.delete(c.dataset.cls); render(); });
  document.querySelectorAll('select.fsel[data-f]').forEach(c=>c.onchange=()=>{ S.flt[c.dataset.f]=c.value; render(); });
  const q=$('q'); if(q) q.oninput=()=>{S.q=q.value; const p=q.selectionStart; render(); const n=$('q'); n.focus(); n.setSelectionRange(p,p);};
  document.querySelectorAll('[data-item]').forEach(r=>r.onclick=()=>{ const k=r.dataset.item; if(k==='VAN') go('mgmt'); else if(k==='광동') go('kd'); else if(k==='기타'){ S.ss='etc'; S.sd='desc'; render(); const lp=$('listPanel'); if(lp) lp.scrollIntoView({behavior:'smooth'}); } else toast('시안 — 서비스 청구 통계 · 약국별 청구를 '+r.dataset.nm+'(으)로 걸러 이동'); });
  if($('kTpl')) $('kTpl').onclick=()=>toast('시안 — 광동 VIP 목록 양식(.xlsx) 다운로드');
  if($('kUp')) $('kUp').onclick=()=>toast('시안 — 파일 선택 후 바로 대조');
  if($('kReq')) $('kReq').onclick=()=>toast('시안 — 빠진 처 청구 요청 목록(.xlsx) 다운로드');
  document.querySelectorAll('.arpuSel').forEach(s=>s.onchange=()=>{ S.arpu=s.value; render(); });
  if($('sgSel')) $('sgSel').onchange=e=>{ S.sg=e.target.value; render(); };
  if($('toMgmt')) $('toMgmt').onclick=e=>{e.preventDefault(); go('mgmt');};
  if($('toMgmt2')) $('toMgmt2').onclick=e=>{e.preventDefault(); go('mgmt');};
  document.querySelectorAll('.kdgo').forEach(a=>a.onclick=e=>{e.preventDefault(); toast('시안 — 약국 상세에서 약국 분류 광동 VIP 체크');});
  if($('tvT')) $('tvT').onclick=()=>{ S.tv=!S.tv; render(); };
  if($('dUnpaid')) $('dUnpaid').onclick=()=>{ location.href='index.html?unpaid=1'; };
  document.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{ S.per=+b.dataset.per; render(); });
  if($('upBtn')) $('upBtn').onclick=()=>{toast('시안 — 파일 선택 후 연결된 행 바로 반영'); go(ERR.length?'err':'upload');};
  if($('tplBtn')) $('tplBtn').onclick=()=>toast('시안 — 정산 파일 양식(.xlsx) 다운로드');
  if($('chgMonth')) $('chgMonth').onclick=e=>{e.preventDefault(); toast('시안 — 집계 월 선택 후 다시 반영');};
}
function go(p){ if(p==='stats') p='dash'; if(area()!==(['dash','stats','kd'].includes(p)?p:'mgmt')){S.tab='all';S.q='';} S.from=S.page; S.page=p; render(); }
document.querySelectorAll('.demo button').forEach(b=>b.onclick=()=>go(b.dataset.go));
const P0=new URLSearchParams(location.search).get('p'); if(['dash','stats','kd','mgmt','upload','err'].includes(P0)) S.page=P0==='stats'?'dash':P0;
render();
</script>
</body>
</html>
