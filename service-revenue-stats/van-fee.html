<title>경영 요약 · 약국 수익 통계 · VAN 정산 관리 시안</title>
<!--

  금액 · 단말기 구성은 2026-11 정산 파일 기준, 약국명 · 사업자번호 · 스토어 ID · TID는 가상값

<style>
  :root{
    --teal:#1fb6a6; --teal-d:#159b8d; --teal-soft:#e6f7f4;
    --ink:#2b2f33; --muted:#8a9099; --line:#e3e6ea; --bg:#f4f5f7;
    --side:#33383d; --side-line:#454b52; --up:#d6453d; --down:#2f6fd6; --add:#7048e8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);font-size:13px;line-height:1.5}
  button,input,select{font-family:inherit}
  .wrap{display:flex;min-height:100vh}
  .side{width:188px;flex:none;background:var(--side);color:#cdd2d7}
  .side-logo{display:flex;align-items:center;gap:7px;padding:16px;border-bottom:1px solid var(--side-line)}
  .side-mark{width:18px;height:18px;border-radius:7px 7px 7px 2px;background:var(--teal);transform:rotate(8deg);position:relative}
  .side-mark::after{content:"";position:absolute;left:-4px;bottom:-3px;width:8px;height:8px;border-radius:50%;background:#f4de3f}
  .side-word{font-size:16px;font-weight:800;color:#fff}
  .side-grp{font-size:10.5px;color:#8e959c;padding:14px 16px 6px}
  .side-item{padding:8px 16px 8px 26px;font-size:12px;color:#aeb4ba}
  .side-item.on{background:var(--teal);color:#fff;font-weight:700}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
  .topbar{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:12px}
  .crumb{font-size:12px;color:var(--muted)} .crumb b{color:var(--ink)}
  .demo{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px dashed #c7cbd0;border-radius:6px;padding:4px 8px;font-size:11.5px;color:var(--muted)}
  .demo button{height:24px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:11.5px;padding:0 8px;cursor:pointer;color:#4b5158}
  .demo button.on{background:#4b5158;border-color:#4b5158;color:#fff}
  .content{padding:18px;display:flex;flex-direction:column;gap:14px;max-width:1240px;position:relative}
  .panel{background:#fff;border:1px solid var(--line);border-radius:8px}
  .ph{display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
  .ph h3{margin:0;font-size:14px} .ph .sub{font-size:11.5px;color:var(--muted)} .ph .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  .btn{height:32px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;color:#4b5158;cursor:pointer}
  .btn.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
  .btn.sm{height:26px;padding:0 10px;font-size:11.5px}
  .btn.line{border-color:#f0b9b5;color:var(--up)}
  .btn:disabled{color:#c3c9d0;border-color:var(--line);cursor:default}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{background:#f8f9fa;color:#5b6168;font-weight:700;font-size:12px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:9px 12px;border-bottom:1px solid #eff1f3;white-space:nowrap;vertical-align:top}
  .tbl .num{text-align:right;font-variant-numeric:tabular-nums}
  .tbl .ctr{text-align:center}
  .tbl tr.tot td{background:#f8f9fa;font-weight:800}
  .addb{display:inline-block;font-size:9.5px;font-weight:800;color:#fff;background:var(--add);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
  th .addb{margin-left:3px}
  .st{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px}
  .st.ok{background:#e6f6f3;color:#0f8a74} .st.fail{background:#fdecea;color:var(--up)}
  .st.cx{background:#eef0f3;color:#5b6168} .st.px{background:#fff3d6;color:#a86b00} .st.rq{background:#e8f0fd;color:var(--down)}
  .rs{font-size:11px;color:#5b6168;margin-top:2px;white-space:normal;max-width:260px}
  .rs b{color:var(--ink)}
  .red{color:var(--up);font-weight:700}
  .kvg{display:grid;grid-template-columns:120px 1fr 120px 1fr;border-top:1px solid var(--line);margin:0 18px 16px}
  .kvg>div{padding:9px 12px;border-bottom:1px solid #eff1f3;font-size:12.5px}
  .kvg .k{background:#f8f9fa;color:#5b6168;font-weight:700;font-size:12px}
  .opt{font-size:11.5px;color:var(--muted);padding:0 18px 14px}
  /* 창 */
  .dim{position:fixed;inset:0;background:rgba(30,34,38,.45);z-index:20}
  .mdl{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:21;width:560px;background:#fff;border-radius:10px;box-shadow:0 18px 40px -12px rgba(0,0,0,.45)}
  .mdl.wide{width:720px}
  .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
  .mh h3{margin:0;font-size:15px} .mh .x{margin-left:auto;border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer}
  .mb{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
  .fr{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:start}
  .fl{font-size:12.5px;font-weight:700;color:#4b5158;padding-top:7px}
  .fi{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:12.5px;color:var(--ink);background:#fff;width:100%}
  .fi[disabled]{background:#f6f7f9;color:var(--muted)}
  .ro{padding-top:7px;font-size:12.5px}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
  .seg{display:flex;gap:6px}
  .seg label{display:flex;align-items:center;gap:5px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;cursor:pointer}
  .seg label.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-d);font-weight:700}
  .seg input{display:none}
  .pv{background:#f8f9fa;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12px}
  .pv .mlab{font-size:11px;color:var(--muted)}
  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sum div{background:#f8f9fa;border-radius:6px;padding:8px 10px;font-size:11.5px;color:var(--muted)}
  .sum b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
  .note{font-size:11.5px;color:#5b6168;background:#f3f7ff;border:1px solid #d7e3fb;border-radius:6px;padding:9px 12px;line-height:1.6}
  .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line)}
  code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#eef2f6;border-radius:4px;padding:0 4px}
  .req{display:none;font-size:9.5px;font-weight:800;color:#fff;background:var(--up);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
  .req.on{display:inline-block}
  .fi.need{border-color:var(--up);background:#fff7f6}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b2f33;color:#fff;padding:9px 16px;border-radius:6px;font-size:12.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}

  /* VAN 정산 추가 스타일 */
  .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:0 18px 14px}
  .kc{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff}

  tr.unm td{background:#fff9ec}
  tr.tot td{background:#f8f9fa;font-weight:800}

  .steps{display:flex;gap:0;margin:0 0 4px}
  .steps span{flex:1;text-align:center;font-size:11px;color:var(--muted);padding:6px 0;border-bottom:3px solid var(--line)}

  .sum4 div{background:#f8f9fa;border-radius:6px;padding:8px 10px;font-size:11.5px;color:var(--muted)}

  .cand{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:12.5px;cursor:pointer}
  .cand.on{border-color:var(--teal);background:var(--teal-soft)}
  .cand input{margin:0}
  .cand .m{color:var(--muted);font-size:11.5px}
</style>
</head>

    <button class="ptab ${S.tab==='etc'?'on':''}" data-tab="etc">기타 판매 있음<b>${vanOk().filter(o=>o.etc).length}</b></button></div>
    <input class="q" id="q" placeholder="약국명 검색" value="${esc(S.q)}"></div>
  <div class="tblwrap"><table class="tbl" id="sTbl"><thead><tr><th>약국명</th><th class="num">이용료</th><th class="num">VAN Fee</th><th class="num">기타 판매</th><th class="num">총수익</th><th class="num">VAN 비중</th><th></th></tr></thead>
  <tbody>${a.map(row).join('')||'<tr><td colspan="7" class="ctr sub2">조회된 약국이 없습니다.</td></tr>'}</tbody></table></div></div>`;
}

/* ── 통계 > 광동 VIP 정산 ── 광동 VIP처는 지원 서비스 금액을 약국이 아니라 광동에 청구해 받음. 수치 · 약국은 예시값 */
const KD_FEE=49500;
const KD=(()=>{ const pre=['온','봄','늘','숲','빛','솔','별','들','샘','길','해','달','꽃','결','담','윤','다온','하늘','바른','참','새','큰','푸른','고운','미소','행복','우리','건강','열린','중앙','제일','한빛','세움','나눔','새봄','늘봄','소망','은하','청솔'], suf=['','온','길','샘','빛','숲','들','봄','누리','마루'];
  const rg=['서울 성동구','서울 강남구','서울 송파구','경기 수원시','경기 성남시','경기 고양시','인천 남동구','부산 해운대구','대구 수성구','대전 서구','광주 북구'];
  const sv=['키오스크','스마트 OCR','스마트2D'], out=[], used=new Set(); let s=7;
  const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<88;i++){ let n; do{ n=pre[Math.floor(rnd()*pre.length)]+suf[Math.floor(rnd()*suf.length)]+'약국'; }while(used.has(n)); used.add(n);
    const st= i<3 ? '2026-11' : ['2025-03','2025-06','2025-09','2026-01','2026-04','2026-07','2026-09','2026-10'][i%8];
    const inKd = !(i===0||i===1||i===17||i===41);   // 빠진 처 4곳 (신규 2곳 포함)
    out.push({n, sid:String(20000+Math.floor(rnd()*70000)), r:rg[i%rg.length], biz:`${300+Math.floor(rnd()*500)}-${10+Math.floor(rnd()*80)}-${String(Math.floor(rnd()*99999)).padStart(5,'0')}`, svc:sv[i%3], st, inKd, admin:true,
      paid: st==='2026-11'||!inKd ? null : (i===29 ? false : true)}); }
  [['한결약국','2026-08'],['새솔약국','2026-05']].forEach(([n,st])=>out.push({n, sid:'—', r:'', biz:`${300+Math.floor(rnd()*500)}-${10+Math.floor(rnd()*80)}-${String(Math.floor(rnd()*99999)).padStart(5,'0')}`, svc:'키오스크', st, inKd:true, admin:false, paid:null}));
  return out; })();
const kdAdm=()=>KD.filter(o=>o.admin), kdMiss=()=>KD.filter(o=>o.admin&&!o.inKd), kdOnly=()=>KD.filter(o=>!o.admin), kdNew=()=>KD.filter(o=>o.admin&&o.st==='2026-11');
function kdHead(){
  const tot=kdAdm().length*KD_FEE, miss=kdMiss().length*KD_FEE, prevPaid=KD.filter(o=>o.admin&&o.paid===true).length*KD_FEE, prevUn=KD.filter(o=>o.admin&&o.paid===false).length;
  return `<div class="panel" id="kSum"><div class="ph"><h3>광동 VIP 정산</h3><span class="sub">광동 VIP처는 지원 서비스 금액을 약국 대신 광동에 청구해 받아요 · 어드민 VIP처와 광동 목록을 대조</span><div class="right">${monthSel('kMonth')}</div></div>
  <div class="cards">
    <div class="kc" id="kNew"><div class="l">금월 신규 VIP처</div><div class="v">${kdNew().length}곳</div><div class="s">이번 달 VIP 지원 시작 · 전체 VIP처 ${kdAdm().length}곳</div></div>
    <div class="kc" id="kMiss"><div class="l">빠진 처</div><div class="v" style="color:var(--up)">${kdMiss().length}곳</div><div class="s">어드민 VIP처인데 광동 목록에 없음 → 청구 요청</div></div>
    <div class="kc" id="kBill"><div class="l">총 청구 금액</div><div class="v">${fmt(tot)}</div><div class="s">VIP처 ${kdAdm().length}곳 × ${fmt(KD_FEE)} (45,000 + VAT)</div></div>
    <div class="kc" id="kDone"><div class="l">청구 완료 금액</div><div class="v">${fmt(tot-miss)}</div><div class="s">광동 목록과 일치한 ${kdAdm().length-kdMiss().length}곳</div></div>
    <div class="kc" id="kUn"><div class="l">미청구 금액</div><div class="v" style="color:var(--up)">${fmt(miss)}</div><div class="s">빠진 처 ${kdMiss().length}곳</div></div>
  </div>
  <div class="basis" id="kBasis"><b>입금</b> · 전월분 광동 입금 <b>${fmt(prevPaid)}원</b> · 미입금 ${prevUn}곳 ${fmt(prevUn*KD_FEE)}원 &nbsp; <b>광동 목록에만 있는 처</b> · ${kdOnly().length}곳 — 어드민에 VIP로 등록되지 않음(해지 반영 여부 확인)
    <br>광동 VIP 지원 금액은 약국별 수익 · 객단가에 넣지 않고 여기서 따로 관리해요. 매출에 넣을 때는 광동이 입금한 월 기준.</div></div>`;
}
const KDST=o=>!o.admin?['chk','광동에만 있음']:o.inKd?['ok','일치']:['no','빠진 처'];
function kdList(){
  let a=KD.slice(); if(S.tab==='miss') a=kdMiss(); else if(S.tab==='only') a=kdOnly(); else if(S.tab==='new') a=kdNew();
  if(S.q) a=a.filter(o=>o.n.includes(S.q));
  const ORD={no:0,chk:1,ok:2}; a.sort((x,y)=>ORD[KDST(x)[0]]-ORD[KDST(y)[0]] || y.st.localeCompare(x.st));
  return `<div class="panel" id="kList"><div class="ph"><h3>VIP처 대조</h3><span class="sub">어드민 VIP처 ↔ 광동 VIP 목록</span>
    <div class="right" id="kBtns"><button class="btn" id="kTpl">파일 양식 다운로드</button><button class="btn pri" id="kUp">광동 VIP 목록 업로드</button></div></div>
  <div class="tools"><div class="ptabs">
    <button class="ptab ${S.tab==='all'?'on':''}" data-tab="all">전체<b>${KD.length}</b></button>
    <button class="ptab ${S.tab==='miss'?'on':''}" data-tab="miss">빠진 처<b>${kdMiss().length}</b></button>
    <button class="ptab ${S.tab==='only'?'on':''}" data-tab="only">광동에만 있음<b>${kdOnly().length}</b></button>
    <button class="ptab ${S.tab==='new'?'on':''}" data-tab="new">금월 신규<b>${kdNew().length}</b></button></div>
    ${S.tab==='miss'?'<button class="btn sm" id="kReq">청구 요청 목록 다운로드</button>':''}
    <input class="q" id="q" placeholder="약국명 검색" value="${esc(S.q)}"></div>
  <div class="tblwrap"><table class="tbl" id="kTbl"><thead><tr><th>약국명</th><th>사업자번호</th><th>VIP 지원 서비스</th><th>VIP 시작월</th><th class="num">청구 금액</th><th class="ctr">대조</th><th class="ctr">청구</th><th class="ctr">전월분 입금</th></tr></thead><tbody>
  ${a.map(o=>{ const s=KDST(o); return `<tr class="${s[0]==='ok'?'':'unm'}"><td>${esc(o.n)}${o.st==='2026-11'?'<span class="tg vip">신규</span>':''}<div class="sub2">${o.admin?o.r+' · '+o.sid:'어드민 VIP 아님'}</div></td><td>${o.biz}</td><td>${o.svc}</td><td>${o.st}</td>
    <td class="num">${o.admin?fmt(KD_FEE):'—'}</td><td class="ctr"><span class="ms ${s[0]}">${s[1]}</span></td>
    <td class="ctr">${!o.admin?'<span class="sub2">—</span>':o.inKd?'청구 완료':'<b style="color:var(--up)">미청구</b>'}</td>
    <td class="ctr">${o.paid===true?'입금 완료':o.paid===false?'<b style="color:var(--up)">미입금</b>':'<span class="sub2">—</span>'}</td></tr>`; }).join('')}
  </tbody></table></div></div>`;
}

/* ── 약국관리 > VAN 정산 관리 ── */
function mgmtHead(){
  return `<div class="panel" id="mSum"><div class="ph"><h3>VAN 정산 관리</h3><span class="sub">매달 VAN 정산 파일을 올려 반영해요 · 사업자번호로 굿팜 약국에 자동 연결</span>
    <div class="right">${monthSel('mMonth')}</div></div>
  <div class="cards" style="grid-template-columns:repeat(3,1fr)">
    <div class="kc" id="mTot"><div class="l">정산 총액</div><div class="v">${fmt(VAN_ALL)}</div><div class="s">정산금액(VAT 포함)</div></div>
    <div class="kc" id="mOk"><div class="l">약국 · 단말기</div><div class="v">${fmt(D.length)}곳</div><div class="s">TID ${FILE.rows}대 · 승인 ${fmt(D.reduce((s,o)=>s+o.tids.reduce((a,t)=>a+t.c,0),0))}건</div></div>
    <div class="kc" id="mFile"><div class="l">반영 파일</div><div class="v" style="font-size:14px">${FILE.name}</div><div class="s">반영 2026-11-10 16:02 · 김운영</div></div>
  </div></div>`;
}
function mgmtList(){
  let a=D.slice();
  if(S.q) a=a.filter(o=>o.n.includes(S.q)||o.b.replace(/\D/g,'').includes(S.q.replace(/\D/g,'')));
  a.sort((x,y)=>y.vam-x.vam);
  const fr=o=>{
    const op=S.open.has(o.b);
    let h=`<tr><td><button class="tog" data-tog="${o.b}">${op?'▾':'▸'}</button>${esc(o.n)}</td>
      <td>${o.b}</td><td>${esc(o.n)}<div class="sub2">${o.r} · ${o.sid}</div></td>
      <td class="num">${o.tids.length}</td><td class="num">${fmt(o.tids.reduce((s,t)=>s+t.c,0))}</td><td class="num">${fmt(o.vam)}</td></tr>`;
    if(op) h+=o.tids.map(t=>`<tr class="tid"><td style="padding-left:30px">TID ${t.t} <span class="tg">${t.g}</span></td><td></td><td class="num">단가 ${t.u}원 · 승인 ${fmt(t.a)}</td><td></td><td class="num">${fmt(t.c)}</td><td class="num">${fmt(t.m)}</td></tr>`).join('');
    return h; };
  return `<div class="panel" id="mList"><div class="ph"><h3>정산 내역</h3><span class="sub">파일 한 행 = 약국 × TID(단말기) → 사업자번호로 약국 단위 합산</span>
    <div class="right" id="upBtns"><button class="btn" id="tplBtn">파일 양식 다운로드</button><button class="btn pri" id="upBtn">정산 파일 업로드</button></div></div>
  ${S.page==='upload'?`<div class="pv" id="upRes" style="margin:0 18px 10px;line-height:1.7;background:#e6f6f3;border-color:#bfe7df">
    <b>${FILE.name}</b> 반영 완료 · 집계 월 <b>2026-11</b> <a href="#" id="chgMonth" style="font-size:11.5px">변경</a> · 정산 총액 <b>${fmt(VAN_ALL)}원</b> · 약국 ${fmt(D.length)}곳 모두 연결</div>`:''}
  <div class="tools"><span class="sub2">전체 ${fmt(D.length)}곳</span>
    <input class="q" id="q" placeholder="가맹점명 · 사업자번호 검색" value="${esc(S.q)}"></div>
  <div class="tblwrap"><table class="tbl" id="vTbl"><thead><tr><th>가맹점명 (파일)</th><th>사업자번호</th><th>굿팜 약국</th><th class="num">TID</th><th class="num">승인건수</th><th class="num">정산금액</th></tr></thead>
  <tbody>${a.map(fr).join('')}<tr class="tot" id="allRow"><td colspan="5">합계 (정산 파일 총액과 같음)</td><td class="num">${fmt(sumV(a))}</td></tr></tbody></table></div></div>`;
}
function hist(){
  return `<div class="panel" id="histPanel"><div class="ph"><h3>업로드 이력</h3><span class="sub">같은 월 파일을 다시 확정하면 이전 파일은 대체됨으로 남아요</span></div>
  <div class="tblwrap"><table class="tbl" id="hTbl"><thead><tr><th>집계 월</th><th>파일명</th><th>업로드 일시</th><th>확정자</th><th>확정 일시</th><th class="num">행 수</th><th class="num">반영 금액</th><th class="ctr">상태</th></tr></thead><tbody>
  ${HIST.map(h=>`<tr><td>${h[0]}</td><td>${esc(h[1])}</td><td>${h[2]}</td><td>${h[3]}</td><td>${h[4]}</td><td class="num">${fmt(h[5])}</td><td class="num">${fmt(h[6])}</td><td class="ctr"><span class="ms ${h[7]==='on'?'ok':''}" style="${h[7]==='on'?'':'background:#eef0f3;color:#5b6168'}">${h[7]==='on'?'반영 중':'대체됨'}</span></td></tr>`).join('')}
  </tbody></table></div></div>`;
}

function errModal(){
  return `<div class="dim"></div><div class="mdl" id="errMdl"><div class="mh"><h3>정산 파일을 반영하지 못했어요</h3><button class="x" data-close>✕</button></div><div class="mb">
  <div class="warn" id="errMsg">굿팜 약국과 연결되지 않는 행이 <b>${ERR.length}건</b> 있어요. 약국 관리의 사업자번호나 정산 파일을 확인한 뒤 다시 올려 주세요.</div>
  <table class="tbl" id="errTbl"><thead><tr><th>가맹점명</th><th>사업자번호</th><th class="num">TID</th><th class="num">정산금액</th><th>사유</th></tr></thead><tbody>
  ${ERR.map(e=>`<tr><td>${esc(e.n)}</td><td>${e.b}</td><td class="num">${e.tids}</td><td class="num">${fmt(e.vam)}</td><td style="color:var(--up);font-weight:700">${e.why}</td></tr>`).join('')}
  </tbody></table>
  <div class="hint" id="errHint">사유는 <b>일치하는 약국 없음</b>(사업자번호가 굿팜 약국에 없음) · <b>같은 사업자번호 약국 여러 곳</b>(한 사업자번호에 약국이 2곳 이상) 두 가지예요. 테스트 계정은 대조에서 빼요.</div>
  </div><div class="mf"><button class="btn pri" data-close>확인</button></div></div>`;
}

function render(){
  side();
  document.querySelectorAll('.demo button').forEach(b=>b.classList.toggle('on',b.dataset.go===S.page));
  const base = area()==='kd' ? kdHead()+kdList() : area()==='dash' ? dashHead()+`<div style="display:flex;gap:14px">${dashTrend()}${dashShare()}</div>`+dashSvc() : area()==='stats' ? statHead()+trend()+statList() : mgmtHead()+mgmtList()+hist();
  const mdl = S.page==='err'?errModal():'';
  $('content').innerHTML = base + mdl;
  bind();
}
function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});
  document.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const k=b.dataset.tog; S.open.has(k)?S.open.delete(k):S.open.add(k); render();});
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>go('mgmt'));
  const q=$('q'); if(q) q.oninput=()=>{S.q=q.value; const p=q.selectionStart; render(); const n=$('q'); n.focus(); n.setSelectionRange(p,p);};
  document.querySelectorAll('[data-item]').forEach(r=>r.onclick=()=>{ const k=r.dataset.item; if(k==='VAN') go('mgmt'); else if(k==='광동') go('kd'); else if(k==='기타'){ go('stats'); S.tab='etc'; render(); } else toast('시안 — 서비스 청구 통계 · 약국별 청구를 '+r.dataset.nm+'(으)로 걸러 이동'); });
  if($('kTpl')) $('kTpl').onclick=()=>toast('시안 — 광동 VIP 목록 양식(.xlsx) 다운로드');
  if($('kUp')) $('kUp').onclick=()=>toast('시안 — 파일 선택 후 바로 대조');
  if($('kReq')) $('kReq').onclick=()=>toast('시안 — 빠진 처 청구 요청 목록(.xlsx) 다운로드');
  document.querySelectorAll('.arpuSel').forEach(s=>s.onchange=()=>{ S.arpu=s.value; render(); });
  if($('toMgmt')) $('toMgmt').onclick=e=>{e.preventDefault(); go('mgmt');};
  if($('upBtn')) $('upBtn').onclick=()=>{toast('시안 — 파일 선택 후 바로 반영'); go('upload');};
  if($('tplBtn')) $('tplBtn').onclick=()=>toast('시안 — 정산 파일 양식(.xlsx) 다운로드');
  if($('chgMonth')) $('chgMonth').onclick=e=>{e.preventDefault(); toast('시안 — 집계 월 선택 후 다시 반영');};
}
function go(p){ if(area()!==(['dash','stats','kd'].includes(p)?p:'mgmt')){S.tab='all';S.q='';} S.from=S.page; S.page=p; render(); }
document.querySelectorAll('.demo button').forEach(b=>b.onclick=()=>go(b.dataset.go));
const P0=new URLSearchParams(location.search).get('p'); if(['dash','stats','kd','mgmt','upload','err'].includes(P0)) S.page=P0;
render();
</script>
</body>
</html>
