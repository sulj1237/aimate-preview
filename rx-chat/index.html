<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>굿팜 처방 Guided AI Chat</title>
<style>
:root{--line:#e5e7eb;--muted:#6b7280;--bg:#f6f7f9;--new:#2563eb;--chg:#b45309;--out:#b91c1c;--con:#047857}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:#111}
.wrap{display:flex;gap:20px;padding:20px;align-items:flex-start;flex-wrap:wrap}
.panel{width:260px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:20px}
.panel h1{font-size:15px;margin:0 0 4px}
.panel p{font-size:12px;color:var(--muted);margin:0 0 14px}
.panel h2{font-size:12px;color:var(--muted);margin:16px 0 6px;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:8px 0;border:0;background:#fff;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:#111;color:#fff}
select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.legend{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.7}
.stage{flex:1;min-width:340px}
.phone{width:390px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;min-height:640px}
.desktop{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;max-width:720px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#fafafa}
.hd{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.hd b{font-size:17px}.hd span{color:var(--muted);font-size:13px}
h3.sec{font-size:13px;color:var(--muted);margin:22px 0 8px;font-weight:600}
.chg-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f1f2f4;align-items:baseline;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;color:#fff;white-space:nowrap}
.t-NEW{background:var(--new)}.t-CHANGED{background:var(--chg)}.t-OUT{background:var(--out)}.t-CONTINUE{background:var(--con)}
.nm{font-weight:600}.det{color:var(--muted);font-size:12.5px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.card .k{font-size:11px;color:var(--muted);margin-top:9px}
.card .v{margin-top:2px}
.q{font-style:normal;background:#f3f4f6;border-radius:8px;padding:8px 10px;margin-top:4px}
details{margin-top:10px;font-size:12.5px;color:var(--muted)}
summary{cursor:pointer}
.btn{width:100%;padding:11px;border:1px solid #111;background:#111;color:#fff;border-radius:10px;font:inherit;cursor:pointer;margin-top:12px}
.btn.ghost{background:#fff;color:#111}
.fq{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;cursor:pointer;font-size:13px}
.fq:hover{background:#fafafa}
.fq .ans{color:var(--muted);font-size:12.5px;margin-top:6px}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px;font-size:12px;color:#92400e;margin-bottom:14px}
.empty{color:var(--muted);padding:14px 0}
.linkrow{display:flex;gap:8px;margin-top:12px}
.linkrow button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;cursor:pointer}
.stepbar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.stepbar button{padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px;cursor:pointer}
.stepbar button.on{background:#111;color:#fff;border-color:#111}
.kv{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.kv div{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
.kv div span:first-child{color:var(--muted)}
.msg{display:flex;margin:8px 0}
.msg.me{justify-content:flex-end}
.bub{max-width:80%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.55}
.msg.bot .bub{background:#f3f4f6;border-top-left-radius:4px}
.msg.me .bub{background:#111;color:#fff;border-top-right-radius:4px}
.src{font-size:11px;color:var(--muted);margin-top:6px}
.pill{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.chip{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;margin:4px 4px 0 0;font-size:12.5px;cursor:pointer}
.chip:hover{background:#f3f4f6}
.ansbox{background:#f9fafb;border-radius:8px;padding:9px 11px;margin-top:8px;font-size:12.5px}
.dur{border:1px solid #fecaca;background:#fef2f2;border-radius:10px;padding:12px;margin-bottom:10px}
.dur b{color:#b91c1c}
.pathbtn{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--line);background:#fff;border-radius:12px;margin-top:10px;font:inherit;cursor:pointer}
.pathbtn b{display:block;margin-bottom:3px}
.pathbtn span{color:var(--muted);font-size:12.5px}
.cmp{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
.cmp th,.cmp td{padding:5px 6px;border-bottom:1px solid #f1f2f4;text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--muted);font-weight:400}
.cmp td.dif{font-weight:700;color:var(--chg)}
.map{position:relative;height:260px;border-radius:12px;margin-top:10px;overflow:hidden;
 background:linear-gradient(#e9eef3 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,#e9eef3 1px,#f7f9fb 1px) 0 0/28px 28px}
.me{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#2563eb;box-shadow:0 0 0 6px rgba(37,99,235,.18)}
.mk{position:absolute;transform:translate(-50%,-100%);cursor:pointer;font-size:11px;border-radius:999px;padding:3px 8px;white-space:nowrap;border:2px solid transparent}
.mk.on{background:#047857;color:#fff}
.mk.off{background:#9ca3af;color:#fff}
.mk.sel{transform:translate(-50%,-100%) scale(1.25);border-color:#111}
.sheet{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.badge{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;margin-top:4px}
.badge.on{background:#d1fae5;color:#065f46}.badge.off{background:#f3f4f6;color:#4b5563}
.tabbar{display:flex;border-top:1px solid var(--line);margin-top:18px;padding-top:8px}
.tabbar button{flex:1;border:0;background:none;font:inherit;font-size:12px;cursor:pointer;color:var(--muted)}
.cam{height:200px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin:14px 0}
</style></head><body>
<div class="wrap">
 <div class="panel">
  <h1>처방 변화 상담 포인트</h1>
  <p>프로토타입 · 가상 데이터</p>
  <h2>화면</h2>
  <div class="seg"><button id="m-in" class="on">내부 검증</button><button id="m-cu">고객앱</button></div>
  <h2>환자 / 고객</h2>
  <select id="sel"></select>
  <div id="case" class="legend" style="margin-top:6px"></div>
  <h2>단말 처방 데이터 (챗봇 첫 화면)</h2>
  <div class="seg"><button id="rx-has" class="on">있음</button><button id="rx-none">없음</button></div>
  <h2>위치 권한 (재고 찾기)</h2>
  <div class="seg"><button id="pm-allow">허용됨</button><button id="pm-first" class="on">처음</button><button id="pm-deny">거절함</button></div>
  <div id="steps"></div>
  <div class="legend">
   내부 검증 화면은 실제로는 <b>AI MATE 고객 종합 분석 탭</b>의 두 영역으로 붙습니다.<br>판정은 <b>03 5장</b> 규칙을 그대로 구현했습니다.<br>
   AI 문장은 연동 없이 <b>샘플 템플릿</b>으로 표시합니다.<br>
   장기복용은 기존 AI 약력관리 기준을 확인한 뒤 붙습니다.
  </div>
 </div>
 <div class="stage" id="stage"></div>
</div>

const pd=s=>new Date(s+'T00:00:00');
const minus6=d=>{const x=new Date(d);x.setMonth(x.getMonth()-6);return x};
const qty=s=>{const m=String(s).match(/^\s*([\d.\/]+)\s*(\S+)\s*$/);return m?m[1]+'|'+m[2]:String(s).trim()};
const fq=s=>String(s).replace(/\s+/g,'');
const rxOf=p=>DB.rx.filter(r=>r.patientId===p);
const lastDate=p=>rxOf(p).map(r=>r.prescriptionDate).sort().pop();

function analyze(pid){
  const rows=rxOf(pid); if(!rows.length) return null;
  const today=pd(lastDate(pid)), lo=minus6(today);
  const cur={},past={};
  rows.forEach(r=>{const k=drugById[r.drugId].ingredientCode,d=pd(r.prescriptionDate);
    if(+d===+today) cur[k]=r; });
  rows.filter(r=>{const d=pd(r.prescriptionDate);return d>=lo&&d<today})
      .sort((a,b)=>a.prescriptionDate<b.prescriptionDate?-1:1)
      .forEach(r=>past[drugById[r.drugId].ingredientCode]=r);
  const noHistory=Object.keys(past).length===0;
  const out=[];
  new Set([...Object.keys(cur),...Object.keys(past)]).forEach(k=>{
    const c=cur[k],q=past[k];
    let state,detail='',diffs=[];
    if(c&&!q){state='NEW'}
    else if(c&&q){
      const dc=drugById[c.drugId],dq=drugById[q.drugId];
      if(c.drugId!==q.drugId) diffs.push(['제품',dq.drugName,dc.drugName]);
      if(qty(dc.strength)!==qty(dq.strength)) diffs.push(['함량',dq.strength,dc.strength]);
      if(qty(c.dosePerTime)!==qty(q.dosePerTime)) diffs.push(['1회 투여량',q.dosePerTime,c.dosePerTime]);
      if(fq(c.frequency)!==fq(q.frequency)) diffs.push(['1일 횟수',q.frequency,c.frequency]);
      state=diffs.length?'CHANGED':'CONTINUE';
    } else {
      state='OUT';
      const end=pd(q.prescriptionDate); end.setDate(end.getDate()+q.duration);
      detail = end>=today ? '투약일수 남음' : '투약일수 종료';
    }
    out.push({key:k,state,detail,diffs,cur:c,past:q,drug:drugById[(c||q).drugId]});
  });
  return {today:lastDate(pid),noHistory,items:out,curCount:Object.keys(cur).length,
          pastGroups:new Set(rows.filter(r=>{const d=pd(r.prescriptionDate);return d>=lo&&d<today}).map(r=>r.prescriptionDate)).size};
}

function durCheck(pid,path){
  const list=codesOf(pid,path), hits=[];
  for(let x=0;x<list.length;x++)for(let y=x+1;y<list.length;y++){
    if(list[x].code===list[y].code){hits.push({type:'중복 성분',a:list[x],b:list[y],reason:'같은 성분이 두 번 확인됩니다'});continue}

    if(m) hits.push({type:'병용주의',a:list[x],b:list[y],reason:m.reason});
  }

}

const LIMIT_ADD='개인의 건강상태나 실제 복용 중인 다른 약에 따라 추가 확인이 필요할 수 있으므로, 복용 전 약사에게 확인해 주세요.';
const NOT_SAFE='DUR에 등록되지 않은 모든 조합이 안전하다는 뜻은 아닙니다. 실제 복용 중인 다른 약이나 건강상태에 따라 추가 확인이 필요할 수 있습니다.';
/* 약 하나를 성분 목록으로 편다 — 복합제는 구성성분까지 */
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1); return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b};
/* 성분 비교용 — 복합제는 구성성분만 쓴다. DUR 비교는 등록된 코드까지 함께 본다 */
function spread(item,forDup){
  if(forDup&&item.components&&item.components.length) return item.components.map(c=>({code:c.code,name:c.name}));
  const out=[{code:item.code,name:item.ingName}];
  (item.components||[]).forEach(c=>out.push({code:c.code,name:c.name}));
  return out;
}
function myItems(pid){
  const out=[];
  const a=analyze(pid);
  if(a) a.items.filter(i=>i.cur).forEach(i=>out.push({id:i.drug.drugId,name:i.drug.drugName,ingName:i.drug.ingredient,code:i.drug.ingredientCode,from:'처방',label:i.drug.drugName}));
  const rc=receiptOf(pid);

  return out;
}
const refer=m=>m.from==='최근 구매'?('최근 구매 기록에 있는 '+m.name):m.name;

function addCandidates(pid){
  const mine=myItems(pid), have=new Set(mine.map(m=>m.id));
  const out=[];
  (S.recent||[]).forEach(id=>{ if(have.has(id)||out.some(c=>c.id===id)) return;
    const o=otcById[id]||drugById[id]; if(o) out.push({id,label:(o.productName||o.drugName)+' · 최근 조회'})});
  DB.otc.forEach(o=>{ if(have.has(o.otcId)||out.some(c=>c.id===o.otcId)||out.length>=3) return;
    out.push({id:o.otcId,label:o.productName})});
  return out.slice(0,3);
}
/* extraId가 있으면 그 약과 내 약들을 비교하고, 없으면 내 약들끼리 비교한다 */
function interCheck(pid,extraId){
  const mine=myItems(pid);
  const ex=extraId?(otcById[extraId]||drugById[extraId]):null;
  const extra=ex?{id:extraId,name:ex.productName||ex.drugName,ingName:ex.ingredient,code:ex.ingredientCode,components:ex.components,from:'선택'}:null;
  const pairs=[];
  if(extra){ mine.forEach(m=>pairs.push([extra,m])); }
  else { for(let x=0;x<mine.length;x++) for(let y=x+1;y<mine.length;y++) pairs.push([mine[x],mine[y]]); }
  const dup=[], dur=[];
  pairs.forEach(([A,B])=>{
    if(A.id===B.id) return;
    const left=extra&&A===extra?('함께 복용하려는 '+A.name):refer(A);
    spread(A,true).forEach(sa=>spread(B,true).forEach(sb=>{
      if(sa.code===sb.code) dup.push(left+'과 '+refer(B)+'에 같은 성분인 '+sa.name+josa(sa.name,'이','가')+' 포함되어 있습니다.');
    }));
    spread(A).forEach(sa=>spread(B).forEach(sb=>{
      const d=DB.dur.병용주의.find(x=>(x.a===sa.code&&x.b===sb.code)||(x.b===sa.code&&x.a===sb.code));
      if(d) dur.push(left+'과 '+refer(B)+' — 함께 복용할 때 주의가 필요한 조합으로 등록되어 있습니다.');
    }));
  });
  const uniq=a=>[...new Set(a)];
  const blocks=[];
  if(uniq(dup).length) blocks.push('<b>성분 중복</b><br>'+uniq(dup).join('<br>')+'<div class="src">출처 · '+SRC_MINE+'</div>');
  if(uniq(dur).length) blocks.push('<b>병용 주의</b><br>'+uniq(dur).join('<br>')+'<div class="src">출처 · '+SRC_DUR+'</div>');
  let tail=LIMIT_ADD;
  if(!blocks.length){
    const head=extra?('함께 복용하려는 '+extra.name+'과 현재 등록된 처방약·구매 기록 사이에서 확인된 성분 중복과 주의 조합은 없습니다.')
                    :'현재 등록된 처방약과 구매 기록 기준으로 확인된 성분 중복과 주의 조합은 없습니다.';
    blocks.push(head+'<div class="src">출처 · '+SRC_MINE+' · '+SRC_DUR+'</div>');
    tail=NOT_SAFE+'<br>복용 전 약사에게 확인해 주세요.';
  }
  const detail='비교한 약 · '+mine.map(m=>m.name+(m.from==='최근 구매'?' (최근 구매 기록)':'')).join(', ')
    +(extra?'<br>함께 복용하려는 약 · '+extra.name:'')
    +'<br>성분 비교 · 복합제는 구성성분까지 펼쳐 비교했습니다'
    +'<br>DUR 기준 · 식약처·심평원 병용주의 (샘플)';
  return {text:blocks.join('<br><br>')+'<br><br>'+tail, detail};
}

/* 일반 주의사항보다 내 구매 기록의 사실을 먼저 쓴다 (09 9.3) */
function sameBought(pid,drug){
  const rc=receiptOf(pid); if(!rc) return null;
  const mine=[{code:drug.ingredientCode,name:drug.ingredient}];
  let hit=null;
  rc.items.filter(i=>i.kind==='일반약').forEach(i=>{const o=otcById[i.otcId];
    const codes=(o.components&&o.components.length)?o.components:[{code:o.ingredientCode,name:o.ingredient}];
    codes.forEach(c=>{ if(!hit&&mine.some(m=>m.code===c.code)) hit={product:o.productName,ing:c.name}; });});
  return hit;
}
function knowPoint(pid,drug){
  const b=sameBought(pid,drug);

  return (drug.precautions||[])[0]||'';
}

    return {t:nw.length?'이번 처방에 새로 추가된 약은 '+nw.map(i=>'<b>'+i.drug.drugName+'</b>').join(', ')+'입니다.':'이번 처방에 새로 추가된 약은 확인되지 않습니다.',
      src:rec,detail:nw.length?evidence(nw):null,follow:[['CHECK','복용할 때 확인할 점'],['INTERACTION','같이 먹어도 되는지 확인']]};
  }
  if(key==='INTERACTION'){
    const r=interCheck(pid,null);
    return {t:r.text,detail:r.detail,follow:[['ADD_DRUG','다른 약과 같이 먹어도 되는지'],['CALL','약국에 문의하기'],['CHECK','복용할 때 확인할 점']]};
  }
  if(key==='ADD_DRUG'){
    const cand=addCandidates(pid);
    return {t:'함께 드실 약을 골라 주세요. 지금 등록된 처방·구매 기록과 비교해 드릴게요.',
      follow:cand.map(c=>['ADD_CHECK',c.label,c.id]).concat([['GO_SEARCH','약품 검색에서 고르기']])};
  }
  if(key==='ADD_CHECK'){
    const r=interCheck(pid,arg);
    return {t:r.text,detail:r.detail,follow:[['ADD_DRUG','다른 약도 확인하기'],['CALL','약국에 문의하기']]};
  }
  if(key==='CHECK'){
    const tg=(a.noHistory?a.items:a.items.filter(i=>i.state==='NEW'||i.state==='CHANGED')).filter(i=>i.cur).slice(0,2);
    const list=(tg.length?tg:a.items.filter(i=>i.cur).slice(0,2));
    return {t:list.map(i=>`<b>${i.drug.drugName}</b> — ${(i.drug.precautions||[]).join(' ')}`).join('<br>')+'<br><br>'+LIMIT,
      src:'식약처 의약품 정보 (샘플)',follow:[['INTERACTION','같이 먹어도 되는지 확인'],['CALL','약국에 문의하기']]};
  }
  if(key==='CALL') return {t:'조제한 한일약국으로 연결할 수 있어요. 답변 내용은 이 기기에 남아 있으니, 보면서 약사에게 직접 물어보세요.<div class="linkrow"><button>📞 약국 전화하기</button><button>💬 약국과 채팅</button></div>',follow:[]};
  if(key==='DRUG_MENU') return {t:'어떤 약이 궁금하세요?',follow:DB.otc.slice(0,3).map(o=>['DRUG',o.productName,o.otcId])};
  if(key==='DRUG'){const o=otcById[arg];
    return {t:`<b>${o.productName}</b><br>성분 ${o.ingredient} · ${o.strength}<br>용도 ${o.purpose}<br>${(o.precautions||[]).join(' ')}`,
      src:'식약처 의약품 정보 (샘플)',follow:[['GO_MAP','내 주변 약국 재고 보기',arg]]};}
  if(key==='STOCK_Q') return {t:'주변 굿팜 약국의 현재 재고를 확인할 수 있어요. 찾는 약을 먼저 골라 주세요.',follow:DB.otc.slice(0,3).map(o=>['STOCK_DRUG',o.productName,o.otcId])};
  if(key==='STOCK_DRUG') return {t:'주변 굿팜 약국의 <b>'+otcById[arg].productName+'</b> 현재 재고를 확인할 수 있어요.',follow:[['GO_MAP','내 주변 약국 재고 보기',arg]]};
  if(key==='GUIDE_MENU') return {t:'무엇이 궁금하세요?',follow:DB.faq.slice(0,3).map((f,ix)=>['GUIDE',f.q,ix])};
  if(key==='GUIDE') return {t:DB.faq[arg].a,src:'굿팜 서비스 안내',follow:[]};
  return {t:'현재 제공된 정보만으로는 판단하기 어렵습니다.',follow:[]};
}

  document.querySelectorAll('[data-path2]').forEach(el=>el.onclick=()=>{S.path=el.dataset.path2;S.cust='cam';S.opened={};S.ans={};render()});
  document.querySelectorAll('[data-q]').forEach(el=>el.onclick=()=>{S.q=el.dataset.q;
    if(S.cust!=='stocksearch') S.cust='search'; render()});
  document.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.pick, o=otcById[id]||drugById[id], nm=o.productName||o.drugName;
    S.pick=false; S.cust='chat';
    const mode=chatMode(S.pid);
    S.msgs=(S.msgs||[{who:'bot',text:INTRO[mode]}]).concat({who:'me',text:nm});
    const r=chatAnswer('ADD_CHECK',id);
    S.msgs.push({who:'bot',text:r.t,src:r.src,detail:r.detail});
    S.chips=(r.follow||[]).concat([['MORE','다른 질문하기']]);
    render()});
  document.querySelectorAll('[data-drug]').forEach(el=>el.onclick=()=>{
    S.drug=el.dataset.drug;
    const pid0=el.dataset.drug.split(':')[1];
    S.recent=[pid0].concat((S.recent||[]).filter(x=>x!==pid0)).slice(0,5);
    const isStock=el.dataset.stock==='1', isOtc=S.drug.startsWith('O:');
    S.cust = 'drug';
    render()});
  document.querySelectorAll('[data-loc]').forEach(el=>el.onclick=()=>{S.loc=true});
  document.querySelectorAll('[data-pharm]').forEach(el=>el.onclick=()=>{S.pharm=el.dataset.pharm||null;S.phStockQ=null;S.cust='stock';render()});
  document.querySelectorAll('[data-say]').forEach(el=>el.onclick=()=>{
    const mode=chatMode(S.pid);
    const chips=S.chips||START[mode];
    const [key,label,arg]=chips[+el.dataset.say];
    if(key==='GO_MAP'){S.drug='O:'+arg;S.selPh=null;S.listView=false;S.cust=(S.perm==='allow'||S.addr)?'map':'loc';render();return}
    if(key==='GO_REGISTER'){S.path='rx';S.cust='consent';render();return}
    if(key==='GO_SEARCH'){S.q='';S.pick=true;S.cust='search';render();return}
    S.msgs=(S.msgs||[{who:'bot',text:INTRO[mode]}]).concat({who:'me',text:label});
    if(key==='MORE'){S.msgs.push({who:'bot',text:'다른 질문을 골라 주세요.'});S.chips=START[mode];render();return}
    const r=chatAnswer(key,arg);
    S.msgs.push({who:'bot',text:r.t,src:r.src,detail:r.detail,intent:INTENT[key]});
    S.chips=(r.follow||[]).slice(0,3).concat([MORE]);
    render()});
  document.querySelectorAll('[data-find]').forEach(el=>el.onclick=()=>{const fid=el.dataset.find;S.drug=(fid[0]==='D'?'D:':'O:')+fid;S.selPh=null;S.listView=false;S.cust=(S.perm==='allow'||S.addr)?'map':'loc';render()});
  document.querySelectorAll('[data-useloc]').forEach(el=>el.onclick=()=>{S.perm='allow';S.addr=null;S.cust='map';render()});
  document.querySelectorAll('[data-settings]').forEach(el=>el.onclick=()=>{S.settingsNote=true;render()});
  document.querySelectorAll('[data-addr]').forEach(el=>el.onclick=()=>{S.addr=el.dataset.addr;S.cust='map';render()});
  document.querySelectorAll('[data-selph]').forEach(el=>el.onclick=()=>{S.selPh=el.dataset.selph;render()});
  document.querySelectorAll('[data-list]').forEach(el=>el.onclick=()=>{S.listView=el.dataset.list==='1';render()});
  document.querySelectorAll('[data-only]').forEach(el=>el.onchange=()=>{S.onlyStock=el.checked;S.selPh=null;render()});
  document.querySelectorAll('[data-phq]').forEach(el=>el.onclick=()=>{S.phStockQ=el.dataset.phq;render()});
  ['allow','first','deny'].forEach(k=>{document.getElementById('pm-'+k).onclick=()=>{S.perm=k;S.addr=null;S.settingsNote=false;render()}});
  document.getElementById('rx-has').onclick=()=>{S.hasRx=true;S.msgs=null;S.chips=null;render()};
  document.getElementById('rx-none').onclick=()=>{S.hasRx=false;S.msgs=null;S.chips=null;render()};
  document.querySelectorAll('[data-svc]').forEach(el=>el.onclick=()=>{
    S.svcCat = el.dataset.svc===''?undefined:+el.dataset.svc; S.cust='svc'; render()});
  document.querySelectorAll('[data-faq]').forEach(el=>el.onclick=()=>{const i=+el.dataset.faq;
    S.opened['faq']=(S.opened['faq']||[]).concat(i);render()});
  document.querySelectorAll('[data-chip]').forEach(el=>el.onclick=()=>{
    const [tag,q]=el.dataset.chip.split('|');
    const ctx=S.ctx[tag]||{pid:S.pid,path:S.path};
    if(tag.startsWith('otc')){const r=receiptOf(S.pid);const list=r?r.items.filter(i=>i.kind==='일반약'):[];
      ctx.otc=otcById[(list[+tag.slice(3)]||{}).otcId];}
    S.ans[tag+'|'+q]=chipAnswer(q,{...ctx,pid:S.pid,path:S.path});
    S.opened[tag]=(S.opened[tag]||[]).concat(q); render();});
  document.querySelectorAll('[data-fq]').forEach(el=>el.onclick=()=>{const[ix,qi]=el.dataset.fq.split(':').map(Number);
    const k=S.pid+'-'+ix;S.opened[k]=(S.opened[k]||[]).concat(qi);render()});
}
render();
</script></body></html>
